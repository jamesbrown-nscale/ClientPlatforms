# Client Platforms on Docker.
#
# On the Google Cloud VM, docker-compose.vm.yml goes on top (HTTPS, OIDC sign-in): see deploy/vm/.
# On your own machine, this alone with a .env from .env.example: http://localhost:${HTTP_PORT:-8080},
# signing in with a password. Every image runs its tests while it builds, so a version with failing
# tests doesn't start.
#
#   proxy          Caddy: routes paths, asks the portal about every request to a tool
#   portal         home page, sign-in (OIDC, or passwords locally), people, settings
#   notifications  IT Notifications            /notifications/
#   elevation      admin elevation log         /elevation/
#   restart        Restart Reminder report     /restart/
#   projects       Projects, Tasks, Team, Change management and everyone's notifications:
#                  /projects/, /tasks/, /team/, /changes/, /inbox/
#   inventory      Users, Org chart, Departments and Devices (Jamf, Intune)   /users/, /org/, /departments/, /devices/
#
# Data is kept in one Docker volume per service (SQLite). On the VM, the disk's snapshots back them up.
name: client-platforms

x-service: &service
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s

x-auth: &auth
  AUTH_MODE: ${AUTH_MODE:-local}
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to a long random string (openssl rand -hex 32)}
  PORTAL_URL: /

services:
  proxy:
    build: ./proxy
    pull_policy: build   # rebuild from the repo on every (re)deploy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      # Locally: http://localhost:8080. On the VM, docker-compose.vm.yml swaps this for 80 and 443.
      - "${HTTP_PORT:-8080}:80"
    depends_on: [portal, notifications, elevation, restart, projects, inventory]

  portal:
    <<: *service
    build: ./services/portal
    pull_policy: build   # rebuild from the repo on every (re)deploy
    environment:
      <<: *auth
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL to the first admin email}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      DEVICE_URL: ${DEVICE_URL:-}
      SESSION_HOURS: ${SESSION_HOURS:-12}
    volumes:
      - portal-data:/data

  notifications:
    <<: *service
    build: ./services/notifications
    pull_policy: build   # rebuild from the repo on every (re)deploy
    environment:
      <<: *auth
      ENROLLMENT_KEY: ${ENROLLMENT_KEY:-}
      ADMIN_EMAILS: ${NOTIFY_ADMIN_EMAILS:-}
      ALLOWED_LINK_HOSTS: ${ALLOWED_LINK_HOSTS:-nscale.com}
    volumes:
      - notifications-data:/data

  elevation:
    <<: *service
    build: ./services/elevation
    pull_policy: build   # rebuild from the repo on every (re)deploy
    environment:
      <<: *auth
      INGEST_KEYS: ${ELEVATION_INGEST_KEYS:-}
    volumes:
      - elevation-data:/data

  restart:
    <<: *service
    build: ./services/restart
    pull_policy: build   # rebuild from the repo on every (re)deploy
    environment:
      <<: *auth
      INGEST_KEYS: ${RESTART_INGEST_KEYS:-}
      MAX_UPTIME_DAYS: ${MAX_UPTIME_DAYS:-3}
      COUNTDOWN_HOURS: ${COUNTDOWN_HOURS:-3}
      LATEST_SCHEDULE_TIME: ${LATEST_SCHEDULE_TIME:-17:00}
    volumes:
      - restart-data:/data

  projects:
    <<: *service
    build: ./services/projects
    pull_policy: build   # rebuild from the repo on every (re)deploy
    environment:
      <<: *auth
    volumes:
      - projects-data:/data

  inventory:
    <<: *service
    build: ./services/inventory
    pull_policy: build   # rebuild from the repo on every (re)deploy
    environment:
      <<: *auth
      SYNC_MINUTES: ${SYNC_MINUTES:-60}   # how often Devices are read again from Jamf and Intune
    volumes:
      - inventory-data:/data

volumes:
  portal-data:
  notifications-data:
  elevation-data:
  restart-data:
  projects-data:
  inventory-data:
