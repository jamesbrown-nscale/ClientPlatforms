name: test
on: [push, pull_request]
jobs:
  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [portal, notifications, elevation, restart, projects, inventory, packaging]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests
  # The same build the VM does: each image on its own, with its tests run inside it. Catches a test
  # that passes beside the other services but fails when a service is built alone.
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [portal, notifications, elevation, restart, projects, inventory, packaging]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test services/${{ matrix.service }}
