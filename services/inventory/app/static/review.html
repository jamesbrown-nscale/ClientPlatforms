<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review · Users · Nscale Client Platforms</title>
<link rel="icon" href="static/nscale-icon.svg">
<link rel="stylesheet" href="static/inventory.css">
<script src="/static/dialog.js"></script>
<script src="/static/nav.js" defer></script>
<style>
  .rtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--surface); margin: 0 0 14px; flex-wrap: wrap; }
  .rtabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--text2); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .rtabs button[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
  .rtabs .n { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px; background: var(--grey-fill); color: var(--text2); font-size: 12px; text-align: center; }
  .rtabs button[aria-selected="true"] .n { background: var(--surface); color: var(--primary); }
  .rbar2 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--surface); }
  .rbar2 input { height: 38px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 0 12px; outline: none; flex: 1; min-width: 220px; max-width: 380px; }
  .rbar2 .sp { flex: 1; }
  .ritem { display: grid; grid-template-columns: minmax(200px, 1.1fr) minmax(0, 2fr) auto; gap: 16px; align-items: start; padding: 12px 16px; border-bottom: 1px solid var(--surface); }
  .ritem:last-child { border-bottom: 0; }
  .ritem b { font-weight: 600; }
  .ritem .chg div { margin: 1px 0; }
  .ritem s { color: var(--text2); }
  .ritem .acts2 { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .kind { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 9px; margin-left: 6px; vertical-align: 1px; }
  .kind.new { background: var(--ok-fill); color: var(--ok-text); } .kind.changed { background: var(--surface); color: var(--primary); } .kind.left { background: var(--err-fill); color: var(--err); }
  @media (max-width: 800px) { .ritem { grid-template-columns: 1fr; } .ritem .acts2 { justify-content: flex-start; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <img src="static/nscale-wordmark.svg" alt="Nscale">
    <span class="app">Client Platforms</span>
    <a class="home" href="./" id="backTop">← Users</a>
    <div class="who"><span id="who"></span> · <a href="/logout" style="color:inherit">Sign out</a></div>
  </div>
</header>
<main>
  <div class="head">
    <div>
      <h1>Review</h1>
      <p class="sub" id="sub">What the last CSV import would change on Users. Nothing has changed until you accept it.</p>
    </div>
    <div class="acts"><a class="btn" href="./" id="backBtn">Back to Users</a></div>
  </div>
  <div class="notice" id="notice" hidden></div>
  <div class="rtabs" role="tablist" id="tabs">
    <button role="tab" data-k="new" aria-selected="true">New <span class="n" id="n-new">0</span></button>
    <button role="tab" data-k="changed" aria-selected="false">Changed <span class="n" id="n-changed">0</span></button>
    <button role="tab" data-k="left" aria-selected="false">Left <span class="n" id="n-left">0</span></button>
  </div>
  <div class="card">
    <div class="rbar2">
      <input type="search" id="q" placeholder="Search name or email" aria-label="Search">
      <span class="muted" id="what"></span>
      <span class="sp"></span>
      <span id="bulk"></span>
    </div>
    <div id="list"><div class="empty">Loading…</div></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const full = s => s ? new Date(s).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '';
let ME = null, ITEMS = [], KIND = 'new', BUSY = false;
const WHAT = {
  new: 'In the file, not on Users yet. Accept adds them; Delete leaves them out.',
  changed: "On Users, but the file says something different. Accept makes the change; Keep as is leaves them as they are; Delete user takes them off Users.",
  left: "On Users, but not in the file: they may have left. Delete user takes them off Users (into the recycle bin for 30 days); Keep leaves them.",
};

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, cache: 'no-store', headers: { Accept: 'application/json', 'Content-Type': 'application/json', 'X-Requested-With': 'nscale-admin' } });
  if (res.status === 401) throw new Error('Your sign-in has expired. Reload the page to sign in again.');
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.detail || `Error ${res.status}`);
  return j;
}
function note(msg, kind = '') { const n = $('notice'); n.textContent = msg; n.hidden = !msg; n.className = 'notice ' + kind; }

function buttons(i) {
  if (!ME?.canEdit) return '';
  const b = (action, label, cls = '') => `<button class="btn small ${cls}" type="button" data-act="${action}" data-id="${esc(i.id)}">${label}</button>`;
  if (i.kind === 'new') return b('accept', 'Accept', 'primary') + b('delete', 'Delete', 'danger');
  if (i.kind === 'changed') return b('accept', 'Accept', 'primary') + b('keep', 'Keep as is') + b('delete', 'Delete user', 'danger');
  return b('delete', 'Delete user', 'danger') + b('keep', 'Keep');
}

function draw() {
  const counts = { new: 0, changed: 0, left: 0 };
  ITEMS.forEach(i => counts[i.kind]++);
  for (const k in counts) $('n-' + k).textContent = counts[k].toLocaleString();
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.k === KIND)));
  $('what').textContent = WHAT[KIND];
  const words = $('q').value.toLowerCase().split(/\s+/).filter(Boolean);
  const rows = ITEMS.filter(i => i.kind === KIND && words.every(w => `${i.name} ${i.email}`.toLowerCase().includes(w)));
  const all = ITEMS.filter(i => i.kind === KIND);
  $('bulk').innerHTML = !ME?.canEdit || !all.length ? '' : KIND === 'left'
    ? `<button class="btn small danger" type="button" data-bulk="delete">Delete all ${all.length}</button> <button class="btn small" type="button" data-bulk="keep">Keep all</button>`
    : `<button class="btn small primary" type="button" data-bulk="accept">Accept all ${all.length}</button>${KIND === 'changed' ? ' <button class="btn small" type="button" data-bulk="keep">Keep all as they are</button>' : ' <button class="btn small" type="button" data-bulk="delete">Delete all</button>'}`;
  if (!ITEMS.length) { $('list').innerHTML = '<div class="empty"><b>Nothing to review</b>Import a CSV on the Users page and its new people, changes and leavers show here.</div>'; return; }
  if (!all.length) { $('list').innerHTML = `<div class="empty">Nothing ${KIND === 'new' ? 'new' : KIND === 'changed' ? 'changed' : 'left'} waiting.</div>`; return; }
  if (!rows.length) { $('list').innerHTML = '<div class="empty">Nobody matches.</div>'; return; }
  $('list').innerHTML = rows.slice(0, 1000).map(i => `<div class="ritem" data-row="${esc(i.id)}">
      <div><b>${esc(i.name || i.email)}</b><span class="kind ${i.kind}">${i.kind === 'new' ? 'New' : i.kind === 'changed' ? 'Changed' : 'Left'}</span><div class="muted">${esc(i.email)}</div></div>
      <div class="chg">${(i.changes || []).map(c => i.kind === 'left'
          ? `<div><span class="muted">${esc(c.field)}:</span> ${esc(c.from)}</div>`
          : `<div><span class="muted">${esc(c.field)}:</span> ${c.from ? `<s>${esc(c.from)}</s> → ` : ''}<b>${esc(c.to) || '<span class="muted">(empty)</span>'}</b></div>`).join('')
        || `<span class="muted">${i.kind === 'new' ? 'Just their email' : '—'}</span>`}</div>
      <div class="acts2">${buttons(i)}</div></div>`).join('')
    + (rows.length > 1000 ? '<div class="empty">Showing the first 1,000: search to find others, or use the buttons at the top for all of them.</div>' : '');
}

async function act(ids, action) {
  if (BUSY || !ids.length) return;
  BUSY = true;
  try {
    const r = await api('api/review/act', { method: 'POST', body: JSON.stringify({ ids, action }) });
    const gone = new Set(ids);
    ITEMS = ITEMS.filter(i => !gone.has(i.id));
    const said = [r.added && `${r.added} added`, r.updated && `${r.updated} updated`, r.deleted && `${r.deleted} deleted (in the recycle bin for 30 days)`].filter(Boolean).join(', ');
    note(said ? said[0].toUpperCase() + said.slice(1) + '.' : action === 'keep' ? 'Kept as they are.' : 'Left out.', 'ok');
    draw();
  } catch (e) { note(e.message); }
  finally { BUSY = false; }
}

$('list').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const i = ITEMS.find(x => x.id === b.dataset.id);
  if (b.dataset.act === 'delete' && i.kind !== 'new' &&
      !(await cp.confirm({ title: `Delete ${i.name || i.email}?`, message: 'They come off Users, with their tags. They stay in the recycle bin (Settings) for 30 days.', confirm: 'Delete user', danger: true }))) return;
  act([b.dataset.id], b.dataset.act);
});
$('bulk').addEventListener('click', async e => {
  const b = e.target.closest('[data-bulk]'); if (!b) return;
  const ids = ITEMS.filter(i => i.kind === KIND).map(i => i.id);
  const a = b.dataset.bulk;
  if (a === 'delete' && KIND !== 'new' &&
      !(await cp.confirm({ title: `Delete ${ids.length} user${ids.length === 1 ? '' : 's'}?`, message: 'They come off Users, with their tags. They stay in the recycle bin (Settings) for 30 days.', confirm: 'Delete them', danger: true }))) return;
  if (a === 'accept' && ids.length > 20 && !(await cp.confirm({ title: `Accept all ${ids.length}?`, message: KIND === 'new' ? 'They are all added to Users.' : 'Every change is made on Users.', confirm: 'Accept all' }))) return;
  act(ids, a);
});
$('tabs').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) { KIND = b.dataset.k; draw(); } });
$('q').addEventListener('input', draw);

(async () => {
  try {
    ME = await api('api/me'); $('who').textContent = ME.email;
    if (ME.list && ME.list !== 'users') {
      $('backTop').textContent = '← ' + ME.listName; $('backBtn').textContent = 'Back to ' + ME.listName;
      document.title = document.title.replace('· Users ·', `· ${ME.listName} ·`);
    }
    const r = await api('api/review');
    ITEMS = r.items;
    if (r.importedAt) $('sub').textContent = `From the CSV imported ${full(r.importedAt)}${r.importedBy ? ' by ' + r.importedBy : ''}. Nothing on Users has changed until you accept it.`;
    KIND = ['new', 'changed', 'left'].find(k => r.counts[k]) || 'new';
    draw();
  } catch (e) { note(e.message); $('list').innerHTML = ''; }
})();
</script>
</body>
</html>
