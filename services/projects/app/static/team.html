<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team · Nscale Client Platforms</title>
<link rel="icon" href="static/nscale-icon.svg">
<script src="/static/dialog.js"></script>
<script src="/static/nav.js" defer></script>
<style>
  :root {
    --bg: #FDFFF8; --text: #040E27; --text2: #3B404E; --muted: #6B7080; --primary: #0F41F3; --primary-hover: #0B34C8;
    --border: #C1CFF7; --surface: #E1EAF9; --page: #F3F5FB; --soft: #F7F9FE;
    --ok-fill: #D6FAEE; --ok-text: #006B4A; --err-fill: #FDECEC; --err: #B42318;
    --warn-fill: #FFF1D6; --warn: #8A5300; --grey-fill: #ECEEF3; --violet-fill: #ECE8FD; --violet: #4A3AB0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--primary); }
  [hidden] { display: none !important; }
  header.top { background: var(--bg); border-bottom: 1px solid var(--surface); }
  .bar { padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 64px; }
  .bar img { height: 16px; display: block; }
  .bar .app { color: var(--text2); border-left: 1px solid var(--border); padding-left: 16px; font-weight: 600; }
  .who { margin-left: auto; color: var(--text2); font-size: 12.5px; white-space: nowrap; }
  main { padding: 24px; display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
  .card { background: var(--bg); border: 1px solid var(--surface); border-radius: 12px; }
  .btn { height: 34px; border-radius: 8px; padding: 0 12px; border: 1px solid var(--border); background: transparent; cursor: pointer;
         white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--text); }
  .btn:hover { background: var(--surface); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--bg); font-weight: 600; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.danger { color: var(--err); border-color: #F7B4B4; }
  .btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .muted { color: var(--text2); font-size: 12.5px; }
  .notice { border-radius: 8px; padding: 9px 12px; background: var(--err-fill); color: var(--err); margin: 10px 0; }
  .empty { color: var(--text2); text-align: center; padding: 32px 16px; }
  .av { width: 38px; height: 38px; border-radius: 50%; background: var(--violet-fill); color: var(--violet); display: grid; place-items: center;
        font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .av.big { width: 64px; height: 64px; font-size: 22px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 11px; background: var(--grey-fill); color: var(--text2); white-space: nowrap; }
  .chip.blue { background: var(--surface); color: var(--primary); }
  .chip.green { background: var(--ok-fill); color: var(--ok-text); }
  .chip.amber { background: var(--warn-fill); color: var(--warn); }
  .chip.red { background: var(--err-fill); color: var(--err); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--grey-fill); vertical-align: middle; }
  .dot.Green { background: #12A26F; } .dot.Amber { background: #E39B12; } .dot.Red { background: #D92D20; }

  .list .head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; }
  .list h1 { font-size: 20px; margin: 0; }
  .filters { display: flex; gap: 8px; padding: 0 16px 12px; }
  .filters input, .filters select { height: 34px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; outline: none; min-width: 0; }
  .filters input { flex: 1; }
  .grp2 { font-size: 12.5px; font-weight: 600; color: var(--text2); padding: 8px 16px 2px 28px; }
  .filters.two select { flex: 1; }
  .grp { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); padding: 12px 16px 6px; border-top: 1px solid var(--surface); }
  .prow { display: flex; gap: 12px; align-items: center; padding: 10px 16px; cursor: pointer; }
  .prow:hover { background: var(--soft); }
  .prow[aria-current="true"] { background: var(--surface); }
  .prow .pname { font-weight: 600; }
  .prow .pmeta { font-size: 12.5px; color: var(--text2); display: flex; gap: 8px; flex-wrap: wrap; }

  .person { padding: 22px 24px 28px; min-height: 400px; }
  .phead { display: flex; gap: 16px; align-items: center; }
  .phead h2 { margin: 0; font-size: 22px; }
  .phead .role { color: var(--text2); }
  .facts { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 4px; font-size: 13px; color: var(--text2); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--surface); margin: 18px 0 18px; overflow-x: auto; }
  .tabs button { border: 0; background: none; padding: 9px 12px; cursor: pointer; color: var(--text2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .tabs .lock { font-size: 11px; margin-left: 4px; color: var(--muted); }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text2); margin: 20px 0 10px; display: flex; align-items: center; gap: 10px; }
  h3:first-child { margin-top: 0; }
  h3 .sp { flex: 1; }
  .about { white-space: pre-wrap; }
  .resp { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .resp .r { border: 1px solid var(--surface); border-radius: 10px; padding: 10px 12px; background: #fff; }
  .resp .r b { display: block; }
  .resp .r span { color: var(--text2); font-size: 13px; white-space: pre-wrap; }
  .redit { display: grid; grid-template-columns: 1fr 1.6fr 32px; gap: 8px; margin-bottom: 8px; }
  .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .proj { border: 1px solid var(--surface); border-radius: 10px; padding: 12px; text-decoration: none; color: inherit; background: #fff; display: flex; flex-direction: column; gap: 4px; }
  .proj:hover { border-color: var(--primary); }
  .proj .pm { font-size: 12.5px; color: var(--text2); }
  .tlist .t { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--surface); text-decoration: none; color: inherit; align-items: baseline; }
  .tlist .t:last-child { border-bottom: 0; }
  .tlist .ref { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--text2); }
  .late { color: var(--err); font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 6px; }
  .stat { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
  .stat .v { font-size: 20px; font-weight: 600; }
  .stat .k { font-size: 12px; color: var(--text2); }

  .form { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px 12px; }
  .fld { grid-column: span 3; }
  .fld.full { grid-column: span 6; } .fld.third { grid-column: span 2; }
  .fld label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text2); margin-bottom: 4px; }
  .fld input, .fld select, .fld textarea, .redit input { width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; outline: none; }
  .fld input, .fld select, .redit input { height: 36px; }
  .fld textarea { min-height: 90px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,65,243,.12); }
  .x { width: 32px; height: 36px; border: 0; background: transparent; cursor: pointer; color: var(--text2); font-size: 18px; border-radius: 8px; }
  .x:hover { background: var(--err-fill); color: var(--err); }

  .entries { display: flex; flex-direction: column; gap: 10px; }
  .entry { border: 1px solid var(--surface); border-radius: 10px; padding: 12px 14px; background: #fff; }
  .entry .eh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .entry .eh b { font-size: 15px; }
  .entry .body { white-space: pre-wrap; margin-top: 6px; overflow-wrap: anywhere; }
  .entry .acts { list-style: none; padding: 0; margin: 8px 0 0; }
  .entry .acts li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
  .entry .acts li.done span { text-decoration: line-through; color: var(--text2); }
  .entry .tools { margin-left: auto; display: flex; gap: 6px; }
  .feedback { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .fcol { border-radius: 12px; padding: 14px; }
  .fcol.well { background: #EEFBF5; border: 1px solid #BDEBD6; }
  .fcol.improve { background: #FFF8EA; border: 1px solid #F5DDA8; }
  .fcol h3 { margin-top: 0; }
  .fcol.well h3 { color: var(--ok-text); } .fcol.improve h3 { color: var(--warn); }
  .fcol .entry { border-color: transparent; }
  .addbox { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .addbox textarea { width: 100%; min-height: 64px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: #fff; resize: vertical; outline: none; }
  .private { display: flex; gap: 10px; align-items: center; background: var(--violet-fill); color: var(--violet); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
  .wb { display: inline-flex; gap: 3px; }
  .wb i { width: 10px; height: 10px; border-radius: 3px; background: var(--grey-fill); display: inline-block; }
  .wb i.on { background: #12A26F; }
  .wb.low i.on { background: #E39B12; } .wb.bad i.on { background: #D92D20; }
  .feed { border-left: 2px solid var(--surface); margin-left: 6px; padding-left: 14px; display: flex; flex-direction: column; gap: 10px; }
  .feed a { color: inherit; text-decoration: none; }
  .feed a:hover .what { text-decoration: underline; }
  .feed .when { color: var(--muted); font-size: 12px; }

  .lblrow { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; position: relative; }
  .lblrow label { margin: 0 !important; }
  .info { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--primary); background: #fff; color: var(--primary); cursor: pointer;
    font: italic 700 12px/1 Georgia, "Times New Roman", serif; display: inline-grid; place-items: center; padding: 0; }
  .info:hover, .info[aria-expanded="true"] { background: var(--primary); color: #fff; }
  .info:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(15,65,243,.3); }
  .tips { position: absolute; top: 28px; left: 0; z-index: 20; width: min(420px, calc(100vw - 48px)); background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: 0 16px 40px rgba(4,14,39,.18); padding: 14px 16px 12px; }
  .tips h4 { margin: 0 0 2px; font-size: 14px; }
  .tips .muted { margin: 0 0 10px; }
  .tips .tg { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); margin: 10px 0 4px; }
  .tips button.tip { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; color: var(--text); }
  .tips button.tip:hover, .tips button.tip:focus-visible { background: var(--surface); color: var(--primary); outline: none; }
  .tips button.tip::before { content: "+"; display: inline-block; width: 16px; color: var(--primary); font-weight: 700; }
  .tips .tfoot { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--surface); }
  .rtebar { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--border); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--soft); }
  .rtebar button { width: 30px; height: 28px; border: 0; background: none; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--text2); }
  .rtebar button:hover, .rtebar button[aria-pressed="true"] { background: var(--surface); color: var(--primary); }
  .rte { min-height: 160px; max-height: 480px; overflow: auto; border: 1px solid var(--border); border-radius: 0 0 8px 8px; padding: 8px 12px; background: #fff;
    outline: none; line-height: 1.55; overflow-wrap: anywhere; }
  .rte:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,65,243,.12); }
  .rte:empty::before { content: attr(data-placeholder); color: var(--muted); }
  .rte p, .notes p { margin: 0 0 6px; }
  .rte b u, .notes b u { text-underline-offset: 3px; }
  .rte ul, .rte ol, .notes ul, .notes ol { margin: 4px 0 6px; padding-left: 22px; }
  .entry .notes { margin-top: 6px; overflow-wrap: anywhere; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  @media (max-width: 700px) { main { padding: 14px; } .bar { padding: 0 16px; } .bar .app, .who { display: none; }
    .feedback, .stats { grid-template-columns: 1fr 1fr; } .feedback { grid-template-columns: 1fr; } .fld, .fld.third { grid-column: span 6; } .person { padding: 18px; } }
</style>
</head>
<body>
<header class="top"><div class="bar">
  <img src="static/nscale-wordmark.svg" alt="Nscale"><span class="app">Team</span>
  <div class="who"><span id="who"></span> · <a href="/logout" style="color:inherit">Sign out</a></div>
</div></header>

<main>
  <section class="card list" aria-label="Team members">
    <div class="head"><h1>Team</h1><span style="flex:1"></span><button class="btn primary" id="addBtn" hidden>Add person</button></div>
    <div class="filters">
      <input type="search" id="q" placeholder="Search name, role or responsibility" aria-label="Search">
    </div>
    <div class="filters two">
      <select id="deptF" aria-label="Department"><option value="">All departments</option></select>
      <select id="teamF" aria-label="Sub team" hidden><option value="">All sub teams</option></select>
    </div>
    <div id="people"><div class="empty">Loading…</div></div>
  </section>
  <section class="card person" id="person" aria-label="Person"><div class="empty">Pick someone to see their role, responsibilities, projects and 1-2-1s.</div></section>
</main>

<datalist id="accounts"></datalist>
<datalist id="depts"></datalist>
<datalist id="teams"></datalist>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let ME = null, MEMBERS = [], DEPTS = [], ACCOUNTS = [], CUR = null, TAB = 'overview', ENTRIES = null, WORK = null, EDIT = null;

async function api(path, opts = {}) {
  const res = await fetch('api/' + path, { ...opts, cache: 'no-store',
    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'nscale-admin', ...(opts.headers || {}) } });
  if (res.status === 401) { location.reload(); throw new Error('Signed out'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const d = data.detail; throw new Error(Array.isArray(d) ? d.map(x => x.msg).join('; ') : (d || res.statusText)); }
  return data;
}
const send = (p, body, method = 'POST') => api(p, { method, body: JSON.stringify(body ?? {}) });
const enc = encodeURIComponent;
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = s => s ? new Date(s + (s.length === 10 ? 'T00:00:00' : '')).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const ago = s => { if (!s) return ''; const days = Math.round((Date.now() - new Date(s)) / 864e5);
  return days <= 0 ? 'today' : days === 1 ? 'yesterday' : days < 30 ? `${days} days ago` : fmtDate(s.slice(0, 10)); };
const initials = n => String(n || '?').split(/[\s.@]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const first = n => String(n || '').split(' ')[0];
// Talking points for a 1-2-1: the ⓘ beside "What you talked about" lists these; clicking one adds it to the notes.
const TALK = [
  ['Check in', ['How are you doing, honestly?', 'Workload: too much, too little, about right?']],
  ['Since last time', ['Actions from last time', 'Wins and what went well']],
  ['Right now', ["What's blocking you, and what would help?", 'Priorities for the next two weeks']],
  ['Growing', ['What do you want to learn or get better at?', 'Career: where do you want to be in a year?']],
  ['Feedback', ['Feedback for you', 'Feedback for me, as your manager']],
  ['The team', ["Anything about the team, process or tools you'd change?"]],
];
const WB = { 1: 'Struggling', 2: 'Not great', 3: 'OK', 4: 'Good', 5: 'Great' };
function wellbeing(n) {
  if (!n) return '';
  return `<span class="wb ${n <= 2 ? 'bad' : n === 3 ? 'low' : ''}" title="How they're doing: ${n}/5">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span> <span class="muted">${esc(WB[n])}</span>`;
}

/* ---------- The list ---------- */
async function loadList() {
  const r = await api('members');
  MEMBERS = r.members; DEPTS = r.departments;
  // Only departments someone on the team is in, for the filter; every one (from Users) for the form.
  const used = new Set(MEMBERS.map(m => m.department));
  const keep = $('deptF').value;
  $('deptF').innerHTML = '<option value="">All departments</option>' + DEPTS.filter(d => used.has(d.name))
    .map(d => `<option value="${d.name ? esc(d.name) : '__none__'}">${esc(d.name || 'No department')}</option>`).join('');
  $('deptF').value = [...$('deptF').options].some(o => o.value === keep) ? keep : '';
  $('depts').innerHTML = DEPTS.filter(d => d.name).map(d => `<option value="${esc(d.name)}">`).join('');
  drawTeamFilter();
  drawList();
}

const deptOf = v => v === '__none__' ? '' : v;
function drawTeamFilter() {
  const dv = $('deptF').value, keep = $('teamF').value;
  const subs = dv ? [...new Set(MEMBERS.filter(m => m.department === deptOf(dv) && m.team).map(m => m.team))].sort() : [];
  $('teamF').hidden = !subs.length;
  $('teamF').innerHTML = '<option value="">All sub teams</option>' + subs.map(t => `<option>${esc(t)}</option>`).join('');
  $('teamF').value = subs.includes(keep) ? keep : '';
}

/** Sub teams (divisions) to suggest in the form: those of the department typed, or all of them. */
function subTeamList(dep) {
  const d = (dep || '').trim().toLowerCase();
  const names = new Set();
  for (const x of DEPTS) if (!d || x.name.toLowerCase() === d) x.divisions.forEach(v => names.add(v));
  $('teams').innerHTML = [...names].sort().map(t => `<option value="${esc(t)}">`).join('');
}

function drawList() {
  const words = $('q').value.toLowerCase().split(/\s+/).filter(Boolean), df = $('deptF').value, tf = $('teamF').value;
  const rows = MEMBERS.filter(m => (!df || m.department === deptOf(df)) && (!tf || m.team === tf) &&
    (!words.length || words.every(w => `${m.name} ${m.email} ${m.title} ${m.department} ${m.team} ${m.managerName}`.toLowerCase().includes(w))));
  if (!MEMBERS.length) { $('people').innerHTML = `<div class="empty">No one on the team yet.${ME.canAdd ? ' Add the first person.' : ''}</div>`; return; }
  if (!rows.length) { $('people').innerHTML = '<div class="empty">Nobody matches.</div>'; return; }
  // Department, then sub team (Division), then people.
  const groups = {};
  for (const m of rows) ((groups[m.department || ''] ||= {})[m.team || ''] ||= []).push(m);
  const by = (a, b) => (a === '') - (b === '') || a.localeCompare(b);
  const person = m => `<div class="prow" data-email="${esc(m.email)}" aria-current="${CUR?.email === m.email}" tabindex="0">
      <span class="av">${esc(initials(m.name))}</span>
      <div style="min-width:0"><div class="pname">${esc(m.name)}${m.email === ME.email ? ' <span class="chip blue">You</span>' : ''}</div>
        <div class="pmeta"><span>${esc(m.title || 'No role set')}</span>${m.managerName ? `<span>· reports to ${esc(m.managerName)}</span>` : ''}</div>
        <div class="pmeta"><span>${m.projects} project${m.projects === 1 ? '' : 's'}</span><span>${m.openTasks} open plan${m.openTasks === 1 ? '' : 's'}</span>
          ${m.rights.personal && (m.lastOneToOne || m.manager) ? `<span>${m.lastOneToOne ? 'Last 1-2-1 ' + esc(ago(m.lastOneToOne)) : '<span class="late">No 1-2-1 yet</span>'}</span>` : ''}</div></div></div>`;
  $('people').innerHTML = Object.keys(groups).sort(by).map(d => {
    const subs = groups[d], keys = Object.keys(subs).sort(by);
    return `<div class="grp">${esc(d || 'No department')}</div>` + keys.map(t =>
      (t || keys.length > 1 ? `<div class="grp2">${esc(t || 'No sub team')}</div>` : '') + subs[t].map(person).join('')).join('');
  }).join('');
  $('people').querySelectorAll('.prow').forEach(r => { r.onclick = () => openPerson(r.dataset.email); r.onkeydown = e => { if (e.key === 'Enter') openPerson(r.dataset.email); }; });
}

/* ---------- One person ---------- */
async function openPerson(email, tab) {
  try {
    CUR = await api('members/' + enc(email)); EDIT = null;
    TAB = tab || 'overview';
    if (!tabs().some(t => t[0] === TAB)) TAB = 'overview';
    [WORK, ENTRIES] = await Promise.all([api(`members/${enc(email)}/work`),
      CUR.rights.personal ? api(`members/${enc(email)}/entries`) : Promise.resolve(null)]);
    drawPerson(); drawList(); remember();
  } catch (e) { $('person').innerHTML = `<div class="notice">${esc(e.message)}</div>`; }
}

function tabs() {
  const r = CUR.rights, them = CUR.email === ME.email ? 'you' : first(CUR.name);
  return [['overview', 'Overview'], ['work', 'Work'],
    r.personal && ['one_to_one', '1-2-1s'], r.personal && ['feedback', 'Feedback'],
    r.managerNotes && ['manager_note', 'Manager notes', `Not shown to ${them}`]].filter(Boolean);
}

function drawPerson() {
  const m = CUR, r = m.rights;
  const n = k => ENTRIES?.entries?.[k]?.length || 0;
  $('person').innerHTML = `
    <div class="phead"><span class="av big">${esc(initials(m.name))}</span>

/* ----- 1-2-1s ----- */
function drawOneToOnes() {
  const list = ENTRIES.entries.one_to_one, can = ENTRIES.canWrite, who = CUR.email === ME.email ? 'your' : first(CUR.name) + "'s";
  $('tabBody').innerHTML = `
    ${!can ? `<div class="private">You can read ${who} 1-2-1s. Only ${CUR.email === ME.email ? 'your manager' : 'their manager'} and admins add or change them.</div>` : ''}
    ${can ? `<div style="margin-bottom:14px"><button class="btn primary" id="new121">Record a 1-2-1</button></div><div id="form121"></div>` : ''}
    <div class="entries">${list.map(e => {
      const d = e.data || {};
      return `<div class="entry" data-id="${esc(e.id)}"><div class="eh"><b>${esc(fmtDate(e.date))}</b>${wellbeing(d.wellbeing)}<span class="muted">by ${esc(e.authorName)}</span>
          ${can ? `<span class="tools"><button class="btn small" data-edit="${esc(e.id)}">Edit</button><button class="btn small danger" data-del="${esc(e.id)}">Delete</button></span>` : ''}</div>
        ${d.html ? `<div class="notes">${d.html}</div>` : e.body ? `<div class="body">${esc(e.body)}</div>` : ''}
        ${d.actions?.length ? `<div class="muted" style="margin-top:8px;font-weight:600">Actions</div><ul class="acts">${d.actions.map(a => `<li class="${a.done ? 'done' : ''}">
          <input type="checkbox" ${a.done ? 'checked' : ''} ${can ? '' : 'disabled'} data-tick="${esc(e.id)}" data-act="${esc(a.id)}" aria-label="Done: ${esc(a.text)}">
          <span>${esc(a.text)}${a.owner ? ` <span class="muted">· ${esc(a.owner)}</span>` : ''}${a.due ? ` <span class="${!a.done && a.due < today() ? 'late' : 'muted'}">· ${esc(fmtDate(a.due))}</span>` : ''}</span></li>`).join('')}</ul>` : ''}
        ${d.next ? `<div class="muted" style="margin-top:8px">Next 1-2-1: ${esc(fmtDate(d.next))}</div>` : ''}</div>`; }).join('') || '<div class="muted">No 1-2-1s recorded yet.</div>'}</div>`;
  if (!can) return;
  $('new121').onclick = () => form121(null);

  $('tabBody').querySelectorAll('[data-del]').forEach(b => b.onclick = () => delEntry(b.dataset.del, '1-2-1'));

    const e = list.find(x => x.id === cb.dataset.tick);

    try { ENTRIES = await send(`members/${enc(CUR.email)}/entries/${e.id}`, { data }, 'PUT'); drawOneToOnes(); } catch (err) { cp.alert(err.message); }

}

function form121(e) {
  const d = e?.data || {};
  const actRow = a => `<div class="redit" style="grid-template-columns: 1.6fr 1fr 150px 32px"><input data-c="text" value="${esc(a.text || '')}" placeholder="Action"><input data-c="owner" value="${esc(a.owner || '')}" placeholder="Who" list="accounts"><input type="date" data-c="due" value="${esc(a.due || '')}"><button class="x" type="button" title="Remove">×</button><input type="hidden" data-c="id" value="${esc(a.id || '')}"><input type="hidden" data-c="done" value="${a.done ? '1' : ''}"></div>`;
  $('form121').innerHTML = `<div class="entry" style="border-color:var(--border);margin-bottom:14px">
    <div class="form">
      <div class="fld third"><label for="o_date">Date</label><input type="date" id="o_date" value="${esc(e?.date || today())}"></div>
      <div class="fld third"><label for="o_wb">How ${CUR.email === ME.email ? "you're" : first(CUR.name) + ' is'} doing</label><select id="o_wb"><option value="">Not recorded</option>${[5, 4, 3, 2, 1].map(n => `<option value="${n}" ${d.wellbeing === n ? 'selected' : ''}>${n} · ${WB[n]}</option>`).join('')}</select></div>
      <div class="fld third"><label for="o_next">Next 1-2-1</label><input type="date" id="o_next" value="${esc(d.next || '')}"></div>
      <div class="fld full"><div class="lblrow"><label for="o_body">What you talked about</label>
          <button type="button" class="info" id="o_tipsBtn" aria-expanded="false" aria-controls="o_tips" title="Things to talk about">i</button>
          <div class="tips" id="o_tips" role="dialog" aria-label="Things to talk about" hidden>
            <h4>Things to talk about</h4><p class="muted">Pick any to add them to your notes as headings.</p>
            ${TALK.map(([g, items]) => `<div class="tg">${esc(g)}</div>` + items.map(t => `<button type="button" class="tip" data-tip="${esc(t)}">${esc(t)}</button>`).join('')).join('')}
            <div class="tfoot"><button type="button" class="btn small" id="o_tipsAll">Add them all as an agenda</button><span style="flex:1"></span><button type="button" class="btn small" id="o_tipsClose">Close</button></div>
          </div></div>
        <div class="rtebar" role="toolbar" aria-label="Formatting"><button type="button" data-cmd="bold" title="Bold (Ctrl/⌘ B)" aria-label="Bold"><b>B</b></button>
          <button type="button" data-cmd="italic" title="Italic (Ctrl/⌘ I)" aria-label="Italic"><i>I</i></button>
          <button type="button" data-cmd="underline" title="Underline (Ctrl/⌘ U)" aria-label="Underline"><u>U</u></button>
          <button type="button" data-cmd="insertUnorderedList" title="Bullet list" aria-label="Bullet list">•</button></div>
        <div class="rte" id="o_body" contenteditable="true" role="textbox" aria-multiline="true" aria-label="What you talked about"
          data-placeholder="Wins, blockers, wellbeing, development, anything they raised">${d.html || (e?.body ? esc(e.body).split('\n').map(l => `<p>${l || '<br>'}</p>`).join('') : '')}</div></div>
      <div class="fld full"><label>Actions</label><div id="o_acts">${(d.actions?.length ? d.actions : [{}]).map(actRow).join('')}</div><button class="btn small" id="o_addAct" type="button">Add an action</button></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px"><span style="flex:1"></span><button class="btn" id="o_cancel">Cancel</button><button class="btn primary" id="o_save">${e ? 'Save' : 'Save 1-2-1'}</button></div></div>`;
  const wire = () => $('o_acts').querySelectorAll('.x').forEach(b => b.onclick = () => b.parentElement.remove());
  wire();
  $('o_addAct').onclick = () => { $('o_acts').insertAdjacentHTML('beforeend', actRow({})); wire(); };
  const tips = $('o_tips'), tipsBtn = $('o_tipsBtn');
  const showTips = open => { tips.hidden = !open; tipsBtn.setAttribute('aria-expanded', String(open)); if (open) tips.querySelector('.tip').focus(); };
  const ed = $('o_body');
  const addHeading = t => {   // a bold, underlined heading in the notes, with the cursor on a fresh line under it
    // Drop a trailing empty line, so headings don't pile up blank lines between them.
    const last = ed.lastElementChild;
    if (last && last.tagName === 'P' && !last.textContent.trim()) last.remove();
    const h = document.createElement('p'), b = document.createElement('b'), u = document.createElement('u');
    u.textContent = t; b.append(u); h.append(b);
    const line = document.createElement('p'); line.append(document.createElement('br'));
    if (!ed.textContent.trim() && !ed.querySelector('li')) ed.innerHTML = '';
    ed.append(h, line);
    ed.focus();
    const r = document.createRange(); r.setStart(line, 0); r.collapse(true);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    line.scrollIntoView({ block: 'nearest' });
  };
  document.querySelectorAll('.rtebar [data-cmd]').forEach(b => {
    b.onmousedown = ev => ev.preventDefault();   // keep the cursor in the notes
    b.onclick = () => { document.execCommand(b.dataset.cmd); ed.focus(); syncBar(); };
  });
  const syncBar = () => document.querySelectorAll('.rtebar [data-cmd]').forEach(b => b.setAttribute('aria-pressed', String(document.queryCommandState(b.dataset.cmd))));
  ed.addEventListener('keyup', syncBar); ed.addEventListener('mouseup', syncBar);
  ed.addEventListener('paste', ev => {   // paste as plain text; the editor's own formatting only
    ev.preventDefault();
    document.execCommand('insertText', false, ev.clipboardData.getData('text/plain'));
  });
  tipsBtn.onclick = () => showTips(tips.hidden);
  $('o_tipsClose').onclick = () => { showTips(false); tipsBtn.focus(); };
  tips.querySelectorAll('[data-tip]').forEach(b => b.onclick = () => { addHeading(b.dataset.tip); b.disabled = true; b.style.opacity = .45; });
  $('o_tipsAll').onclick = () => { TALK.flatMap(([, items]) => items).forEach(t => addHeading(t)); showTips(false); };
  tips.addEventListener('keydown', ev => { if (ev.key === 'Escape') { showTips(false); tipsBtn.focus(); } });
  document.addEventListener('click', ev => { if (!tips.hidden && !tips.contains(ev.target) && ev.target !== tipsBtn) showTips(false); });
  $('o_cancel').onclick = () => { $('form121').innerHTML = ''; };
  $('o_save').onclick = async () => {
    const actions = [...$('o_acts').children].map(r => Object.fromEntries([...r.querySelectorAll('[data-c]')].map(i => [i.dataset.c, i.value.trim()])))
      .filter(a => a.text).map(a => ({ ...a, done: !!a.done }));
    const notes = $('o_body').textContent.trim() ? $('o_body').innerHTML : '';
    const body = { kind: 'one_to_one', date: $('o_date').value, body: $('o_body').innerText.trim(),
      data: { wellbeing: $('o_wb').value ? Number($('o_wb').value) : null, next: $('o_next').value, actions, html: notes } };
    try { ENTRIES = e ? await send(`members/${enc(CUR.email)}/entries/${e.id}`, body, 'PUT') : await send(`members/${enc(CUR.email)}/entries`, body);
      drawPerson(); loadList(); }
    catch (err) { cp.alert(err.message); }
  };
  $('o_body').focus();
}

function wireEntries(redraw) {

      <div class="fld${add ? '' : ' third'}"><label for="p_name">Name</label><input id="p_name" value="${esc(m.name || '')}" placeholder="From the email if empty" maxlength="100"></div>
      <div class="fld third"><label for="p_title">Role</label><input id="p_title" value="${esc(m.title || '')}" placeholder="Endpoint Engineer" maxlength="120"></div>
      <div class="fld third"><label for="p_dept">Department</label><input id="p_dept" list="depts" value="${esc(m.department || '')}" placeholder="Technology" maxlength="200"></div>
      <div class="fld third"><label for="p_team">Sub team</label><input id="p_team" list="teams" value="${esc(m.team || '')}" placeholder="Client Platforms" maxlength="200" title="Their Division"></div>
      ${mgrField}
      <div class="fld third"><label for="p_start">Start date</label><input id="p_start" type="date" value="${esc(m.startDate || '')}"></div>
      <div class="fld third"><label for="p_loc">Location</label><input id="p_loc" value="${esc(m.location || '')}" placeholder="London" maxlength="80"></div>
      <div class="fld full"><label for="p_about">About</label><textarea id="p_about" placeholder="What they work on, strengths, how they like to work" maxlength="2000">${esc(m.about || '')}</textarea></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px"><span style="flex:1"></span><button class="btn" id="p_cancel">Cancel</button><button class="btn primary" id="p_save">${add ? 'Add to team' : 'Save'}</button></div>`;
  $('p_cancel').onclick = () => add ? ($('person').innerHTML = '<div class="empty">Pick someone to see their role, responsibilities, projects and 1-2-1s.</div>') : drawPerson();
  subTeamList(m.department);
  $('p_dept').oninput = () => subTeamList($('p_dept').value);
  if (add) {
    $('p_email').oninput = e => { const a = ACCOUNTS.find(x => x.email === e.target.value.trim().toLowerCase()); if (a && !$('p_name').value) $('p_name').value = a.name; };
    // Someone in Users: their name, role, department and division, for anything still empty.
    $('p_email').onchange = async () => {
      const email = $('p_email').value.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return;
      const u = await api('lookup?email=' + enc(email)).catch(() => ({}));
      const fill = (id, v) => { if (v && !$(id).value) $(id).value = v; };
      fill('p_name', u.name); fill('p_title', u.title); fill('p_dept', u.department); fill('p_team', u.division);
      subTeamList($('p_dept').value);
    };
  }
  $('p_save').onclick = async () => {
    const body = { name: $('p_name').value, title: $('p_title').value, department: $('p_dept').value, team: $('p_team').value, startDate: $('p_start').value,
      location: $('p_loc').value, about: $('p_about').value };
    if ($('p_manager')) body.manager = $('p_manager').value;
    try {
      if (add) { body.email = $('p_email').value; const r = await send('members', body); await loadList(); openPerson(r.email); }
      else { CUR = { ...CUR, ...(await send('members/' + enc(CUR.email), body, 'PATCH')) }; drawPerson(); loadList(); }
    } catch (e) { cp.alert(e.message); }
  };
  (add ? $('p_email') : $('p_title')).focus();
}

/* ---------- Where you were ---------- */
function remember() {
  const p = new URLSearchParams();
  if (CUR) p.set('person', CUR.email);
  if (CUR && TAB !== 'overview') p.set('tab', TAB);
  history.replaceState(null, '', '#' + p.toString());
}

(async () => {
  ME = await api('me');
  $('who').textContent = ME.email;
  $('addBtn').hidden = !ME.canAdd;
  $('addBtn').onclick = () => { CUR = null; drawList(); profileForm(true); };
  $('q').oninput = drawList; $('teamF').onchange = drawList;
  $('deptF').onchange = () => { $('teamF').value = ''; drawTeamFilter(); drawList(); };
  const people = await fetch('/api/people', { cache: 'no-store' }).then(r => r.ok ? r.json() : { people: [] }).catch(() => ({ people: [] }));
  ACCOUNTS = people.people || [];
  $('accounts').innerHTML = ACCOUNTS.map(a => `<option value="${esc(a.email)}">${esc(a.name)}</option>`).join('');
  await loadList();
  const h = new URLSearchParams(location.hash.slice(1));
  const start = h.get('person') || (MEMBERS.some(m => m.email === ME.email) ? ME.email : null);
  if (start) openPerson(start, h.get('tab'));
})().catch(e => { $('people').innerHTML = `<div class="notice">${esc(e.message)}</div>`; });
</script>
</body>
</html>
