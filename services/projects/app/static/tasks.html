<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Planning · Nscale Client Platforms</title>
<link rel="icon" href="static/nscale-icon.svg">
<script src="/static/dialog.js"></script>
<script src="/static/mention.js"></script>
<script src="/static/nav.js" defer></script>
<style>
  :root {
    --bg: #FDFFF8; --text: #040E27; --text2: #3B404E; --muted: #6B7080; --primary: #0F41F3; --primary-hover: #0B34C8;
    --border: #C1CFF7; --surface: #E1EAF9; --page: #F3F5FB; --soft: #F7F9FE;
    --ok-fill: #D6FAEE; --ok-text: #006B4A; --err-fill: #FDECEC; --err: #B42318;
    --warn-fill: #FFF1D6; --warn: #8A5300; --grey-fill: #ECEEF3; --violet-fill: #ECE8FD; --violet: #4A3AB0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--primary); }
  [hidden] { display: none !important; }
  header.top { background: var(--bg); border-bottom: 1px solid var(--surface); }
  .bar { padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 64px; }
  .bar img { height: 16px; display: block; }
  .bar .app { color: var(--text2); border-left: 1px solid var(--border); padding-left: 16px; font-weight: 600; }
  .who { margin-left: auto; color: var(--text2); font-size: 12.5px; white-space: nowrap; }
  main { padding: 24px; display: grid; grid-template-columns: minmax(340px, 1fr) minmax(0, 1.25fr); gap: 16px; align-items: start; }
  .card { background: var(--bg); border: 1px solid var(--surface); border-radius: 12px; }
  .btn { height: 34px; border-radius: 8px; padding: 0 12px; border: 1px solid var(--border); background: transparent; cursor: pointer;
         white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--surface); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--bg); font-weight: 600; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.danger { color: var(--err); border-color: #F7B4B4; }
  .btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .muted { color: var(--text2); font-size: 12.5px; }
  .notice { border-radius: 8px; padding: 9px 12px; background: var(--err-fill); color: var(--err); margin: 10px 0; }

  .list .head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; flex-wrap: wrap; }
  .list h1 { font-size: 20px; margin: 0; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 10px; }
  .tabs button { border: 1px solid var(--surface); background: transparent; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  .tabs button[aria-pressed="true"] { background: var(--surface); color: var(--primary); border-color: var(--surface); font-weight: 600; }
  .tabs .n { color: var(--text2); font-weight: 400; margin-left: 2px; }
  .filters { display: flex; gap: 8px; padding: 0 16px 12px; }
  .filters input, .filters select { height: 34px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; outline: none; min-width: 0; }
  .filters input { flex: 1; }
  .rows { border-top: 1px solid var(--surface); }
  .trow { display: flex; gap: 10px; align-items: flex-start; padding: 11px 16px; border-bottom: 1px solid var(--surface); cursor: pointer; }
  .trow:hover { background: var(--soft); }
  .trow[aria-current="true"] { background: var(--surface); }
  .trow:last-child { border-bottom: 0; }
  .check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--muted); background: #fff; cursor: pointer; flex-shrink: 0; margin-top: 1px;
           display: grid; place-items: center; padding: 0; color: transparent; font-size: 12px; }
  .check:hover { border-color: var(--ok-text); color: var(--ok-text); }
  .check.done { background: #12A26F; border-color: #12A26F; color: #fff; }
  .check.prog { border-color: var(--primary); background: conic-gradient(var(--primary) var(--p), #fff 0); }
  .tmain { flex: 1; min-width: 0; }
  .ttitle { font-weight: 600; overflow-wrap: anywhere; }
  .done .ttitle, .trow.isdone .ttitle { text-decoration: line-through; color: var(--text2); font-weight: 400; }
  .tmeta { font-size: 12.5px; color: var(--text2); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
  .late { color: var(--err); font-weight: 600; }
  .q { color: var(--warn); font-weight: 600; }
  .av { width: 26px; height: 26px; border-radius: 50%; background: var(--violet-fill); color: var(--violet); display: grid; place-items: center;
        font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .av.me { background: var(--ok-fill); color: var(--ok-text); }
  .av.none { background: var(--grey-fill); color: var(--muted); }
  .empty { color: var(--text2); text-align: center; padding: 40px 16px; }

  .detail { padding: 20px; position: sticky; top: 16px; }
  .detail .tref { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--text2); }
  .titlein { width: 100%; font-size: 20px; font-weight: 600; border: 1px solid transparent; border-radius: 8px; padding: 4px 6px; margin: 2px -6px 8px; background: transparent; outline: none; }
  .titlein:hover:not(:disabled) { border-color: var(--surface); }
  .titlein:focus { border-color: var(--primary); background: #fff; }
  .fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 12px; margin-bottom: 12px; }
  .fields label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 4px; }
  .fields input, .fields select, .desc, .composer textarea, .composer input, .composer select {
    width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; outline: none; }
  .fields input, .fields select { height: 36px; }
  .fields .wide { grid-column: span 3; }
  .fields .two { grid-column: span 2; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,65,243,.12); }
  .desc { min-height: 80px; resize: vertical; }
  .bigbar { height: 8px; border-radius: 4px; background: var(--grey-fill); overflow: hidden; margin: 6px 0 14px; }
  .bigbar i { display: block; height: 100%; background: var(--primary); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text2); margin: 18px 0 8px; }
  .feed { border-left: 2px solid var(--surface); margin-left: 6px; padding-left: 14px; display: flex; flex-direction: column; gap: 10px; }
  .ev { position: relative; }
  .ev .who2 { font-weight: 600; }
  .ev .when { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .ev .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .ev.change { color: var(--text2); font-size: 13px; }
  .ev.box { border-radius: 8px; padding: 8px 10px; }
  .ev.question { background: var(--warn-fill); color: var(--warn); }
  .ev.question.answered { background: var(--grey-fill); color: var(--text2); }
  .ev.update { background: var(--surface); color: #0B2A99; }
  .ev.answer { border-left: 3px solid #E39B12; padding-left: 10px; border-radius: 0; }
  .ev .act { font-size: 12px; margin-top: 4px; display: flex; gap: 10px; }
  .ev .act button { border: 0; background: none; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; font-size: 12px; }
  .mention { background: var(--surface); color: var(--primary); border-radius: 4px; padding: 0 3px; font-weight: 600; }
  .composer { margin-top: 14px; border: 1px solid var(--border); border-radius: 10px; padding: 10px; background: var(--soft); }
  .kinds { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  .kinds button { border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
  .kinds button[aria-pressed="true"] { background: var(--surface); color: var(--primary); border-color: var(--primary); font-weight: 600; }
  .composer textarea { min-height: 64px; resize: vertical; }
  .composer .opts { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .composer .opts input[type=range] { width: 160px; padding: 0; border: 0; background: none; box-shadow: none; }
  .composer .opts input.ask { max-width: 260px; height: 32px; }
  .replying { font-size: 12.5px; color: var(--warn); margin-bottom: 6px; }

  /* List / Calendar switch */
  .modes { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .modes button { border: 0; background: transparent; height: 32px; padding: 0 12px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: var(--text2); }
  .modes button + button { border-left: 1px solid var(--border); }
  .modes button[aria-pressed="true"] { background: var(--surface); color: var(--primary); font-weight: 600; }
  .modes svg { width: 15px; height: 15px; }
  main.cal { grid-template-columns: minmax(0, 1fr); }
  main.cal.withdetail { grid-template-columns: minmax(0, 1fr) minmax(360px, 480px); }
  main.cal .detail .fields { grid-template-columns: 1fr 1fr; }
  main.cal .detail .fields .wide, main.cal .detail .fields .two { grid-column: span 2; }

  /* Jobs */
  .jobshead { display: flex; align-items: center; gap: 10px; margin: 18px 0 8px; }
  .jobshead h2 { margin: 0; }
  .jobshead .muted { flex: 1; }
  .jobs { display: flex; flex-direction: column; gap: 6px; }
  .job { border: 1px solid var(--surface); border-radius: 10px; background: #fff; }
  .job.open { border-color: var(--border); box-shadow: 0 2px 10px rgba(4,14,39,.06); }
  .job.dragging { opacity: .45; }
  .job.over { border-color: var(--primary); }
  .jh { display: flex; gap: 10px; align-items: center; padding: 8px 10px; cursor: pointer; }
  .jh:hover { background: var(--soft); border-radius: 10px; }
  .grip { cursor: grab; color: var(--muted); font-size: 14px; line-height: 1; user-select: none; padding: 2px 0; }
  .jdot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .jt { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .job.isdone .jt { text-decoration: line-through; color: var(--text2); font-weight: 400; }
  .jw { font-size: 12.5px; color: var(--text2); white-space: nowrap; }
  .jw.unsched { color: var(--muted); font-style: italic; }
  .chip { font-size: 11.5px; border-radius: 999px; padding: 1px 8px; background: var(--grey-fill); color: var(--text2); white-space: nowrap; }
  .chip.s-inprogress { background: var(--surface); color: #0B2A99; }
  .chip.s-blocked { background: var(--err-fill); color: var(--err); }
  .chip.s-done { background: var(--ok-fill); color: var(--ok-text); }
  .jb { padding: 4px 12px 12px; border-top: 1px solid var(--surface); }
  .jb .fields { margin: 10px 0; }
  .jb .ends { height: 36px; display: flex; align-items: center; color: var(--text2); }
  .jtext h3 { font-size: 12px; color: var(--text2); margin: 10px 0 2px; }
  .jtext .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .jnote { background: var(--warn-fill); color: #5C3A00; border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .jactions { display: flex; gap: 8px; align-items: center; }
  .jempty { border: 1px dashed var(--border); border-radius: 10px; padding: 14px; color: var(--text2); text-align: center; font-size: 13px; }

  /* Timeline (Gantt) */
  .tlhead1 { display: flex; align-items: center; gap: 10px; padding: 14px 16px; flex-wrap: wrap; }
  .tlhead1 h1 { font-size: 20px; margin: 0; }
  .tlhead1 select { height: 34px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; outline: none; }
  .tlbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--surface); flex-wrap: wrap; }
  .ib { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; display: inline-grid; place-items: center; color: var(--text2); padding: 0; }
  .ib:hover:not(:disabled) { background: var(--surface); color: var(--text); }
  .ib:disabled { opacity: .35; cursor: default; }
  .ib svg, .tlbar .btn svg { width: 16px; height: 16px; }
  .tlrange { font-weight: 600; margin-left: 6px; white-space: nowrap; }
  .tlrange span { font-weight: 400; color: var(--muted); }
  .tlhint { font-size: 12.5px; color: var(--text2); padding: 0 16px 10px; }
  .tl { user-select: none; -webkit-user-select: none; cursor: grab; overflow: auto; border-top: 1px solid var(--surface); max-height: calc(100vh - 230px); min-height: 260px; border-radius: 0 0 12px 12px; }
  .tlin { position: relative; min-width: 100%; }
  .tlcols { position: absolute; top: 0; bottom: 0; z-index: 0; pointer-events: none; }
  .tlcols i { position: absolute; top: 0; bottom: 0; background: #F2F4F8; }
  .tltoday { position: absolute; top: 22px; bottom: 0; width: 2px; background: #E5484D; z-index: 3; pointer-events: none; }
  .tlrow { display: flex; position: relative; }
  .tllab { position: sticky; left: 0; z-index: 4; flex-shrink: 0; background: #fff; border-right: 1px solid var(--surface); padding: 0 14px 0 20px; min-width: 0;
           display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
  .tltrack { position: relative; flex-shrink: 0; z-index: 1; }
  .tlhd { position: sticky; top: 0; z-index: 6; background: #fff; border-bottom: 1px solid var(--surface); }
  .tlhd .tllab { z-index: 7; cursor: default; }
  .tl.panning, .tl.panning * { cursor: grabbing !important; }
  .tllab, .tltrack.pick { cursor: pointer; }
  .tlmonths { position: relative; height: 22px; }
  .tlmonths b { position: absolute; top: 4px; font-size: 12.5px; white-space: nowrap; padding-left: 6px; border-left: 1px solid var(--border); }
  .tldays { position: relative; height: 30px; }
  .tldays span { position: absolute; top: 0; height: 30px; text-align: center; font-size: 12px; color: var(--text2); line-height: 1.15; padding-top: 2px; }
  .tldays span small { display: block; font-size: 9.5px; color: var(--muted); text-transform: uppercase; }
  .tldays span.we { background: #ECEEF3; }
  .tldays span.td { color: #E5484D; font-weight: 700; }
  .tldays span.mon { text-align: left; padding-left: 3px; border-left: 1px solid var(--surface); }
  .tlgroup .tllab { background: var(--soft); flex-direction: row; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text); padding-top: 6px; padding-bottom: 6px; }
  .tlgroup .tllab .gt { flex: 1; min-width: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
  .tlgroup .tllab .ref { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); }
  .tlgroup .tltrack { background: rgba(247,249,254,.75); }
  .tlgroup, .tljob { border-bottom: 1px solid var(--surface); }
  .sq { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .tladd { border: 0; background: transparent; color: var(--primary); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 4px; border-radius: 6px; }
  .tladd:hover { background: var(--surface); }
  .tljob .tllab { padding-top: 6px; padding-bottom: 6px; }
  .tljob .tllab .jn, .tljob .tllab .js { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tljob .tllab .jn { font-size: 14px; line-height: 1.3; }
  .tljob .tllab .js { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .colgrip { position: absolute; right: -4px; top: 0; bottom: 0; width: 9px; cursor: col-resize; z-index: 8; }
  .colgrip::after { content: ""; position: absolute; left: 4px; top: 10px; bottom: 10px; width: 2px; border-radius: 1px; background: var(--border); opacity: 0; transition: opacity .15s; }
  .tlhd:hover .colgrip::after, .colgrip.on::after { opacity: 1; }
  .tljob.isdone .tllab .jn { text-decoration: line-through; color: var(--text2); }
  .tljob.sel .tllab, .tlgroup.sel .tllab { box-shadow: inset 3px 0 0 var(--primary); }
  .tljob.sel .tllab { background: #F5F8FF; }
  .tljob .tltrack.pick, .tlgroup .tltrack.pick { cursor: copy; }
  .tlspan { position: absolute; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; opacity: .35; }
  .gbar { position: absolute; top: 50%; height: 24px; margin-top: -12px; border-radius: 6px; background: var(--c); color: #fff; font-size: 12px; line-height: 24px;
          padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; box-shadow: 0 1px 2px rgba(4,14,39,.15); user-select: none; touch-action: none; }
  .gbar.can { cursor: grab; }
  .gbar.dragging { cursor: grabbing; box-shadow: 0 4px 14px rgba(4,14,39,.25); opacity: .92; }
  .gbar.done { opacity: .45; }
  .gbar.late { box-shadow: 0 0 0 2px #E5484D; }
  .gbar.sel { outline: 2px solid var(--text); outline-offset: 1px; }
  .gbar .rh { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; cursor: ew-resize; }
  .gbar .rh::after { content: ""; position: absolute; right: 3px; top: 7px; bottom: 7px; width: 2px; border-radius: 1px; background: rgba(255,255,255,.7); }
  .diamond { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; transform: rotate(45deg); border-radius: 2px; background: var(--c); cursor: pointer;
             box-shadow: 0 0 0 2px #fff; z-index: 2; }
  .diamond.late { background: #E5484D; }
  .pav { width: 24px; height: 24px; border-radius: 50%; background: var(--violet-fill); color: var(--violet); display: grid; place-items: center; font-size: 10.5px; font-weight: 700; flex-shrink: 0; }
  .pav.me { background: var(--ok-fill); color: var(--ok-text); }
  .pav.none { background: var(--grey-fill); color: var(--muted); }
  .tlgroup .tllab .cnt { font-weight: 400; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .tlbusy { position: absolute; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; background: var(--violet); opacity: .25; }
  .tlbusy.over { background: #E5484D; opacity: .55; }
  .planmenu { position: absolute; z-index: 1000; min-width: 240px; max-width: 340px; max-height: 300px; overflow: auto; background: #FDFFF8; border: 1px solid var(--border); border-radius: 10px;
              box-shadow: 0 12px 32px rgba(4,14,39,.18); padding: 4px; }
  .planmenu .g { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); padding: 8px 8px 4px; }
  .planmenu button { display: flex; gap: 8px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .planmenu button:hover, .planmenu button:focus { background: var(--surface); outline: none; }
  .planmenu .ref { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; color: var(--muted); margin-left: auto; }
  .tlnone { color: var(--muted); font-size: 13px; font-style: italic; }
  .tlempty { padding: 50px 16px; text-align: center; color: var(--text2); }

  @media (max-width: 1000px) { main, main.cal.withdetail { grid-template-columns: 1fr; } .detail { position: static; } }
  @media (max-width: 700px) { main { padding: 14px; } .bar { padding: 0 16px; } .bar .app, .who { display: none; } .modes span { display: none; }
    .tlrange span { display: none; }
    .fields { grid-template-columns: 1fr 1fr; } .fields .wide, .fields .two { grid-column: span 2; } }
</style>
</head>
<body>
<header class="top"><div class="bar">
  <img src="static/nscale-wordmark.svg" alt="Nscale"><span class="app">Team Planning</span>
  <div class="who"><span id="who"></span> · <a href="/logout" style="color:inherit">Sign out</a></div>
</div></header>

<main id="main">
  <section class="card list" id="listCard" aria-label="Plans">
    <div class="head"><h1>Team Planning</h1><span style="flex:1"></span><div class="modes" id="modes1" role="group" aria-label="Show as">
        <button type="button" data-mode="list" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>List</span></button>
        <button type="button" data-mode="timeline" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h9M8 12h10M6 18h7"/></svg><span>Timeline</span></button>
      </div><button class="btn primary" id="newBtn">New plan</button></div>
    <div class="tabs" id="tabs" role="toolbar" aria-label="Show"></div>
    <div class="filters">
      <input type="search" id="q" placeholder="Search plans" aria-label="Search">
      <select id="proj" aria-label="Project"><option value="">All projects</option></select>
    </div>
    <div class="rows" id="rows"><div class="empty">Loading…</div></div>
  </section>

  <section class="card" id="calCard" aria-label="Timeline" hidden>
    <div class="tlhead1">
      <h1>Team Planning</h1><span style="flex:1"></span>
      <select id="calGroup" aria-label="Group rows"><option value="person">By person</option><option value="plan">By plan</option></select>
      <select id="calWho" aria-label="Whose jobs"><option value="">Everyone's jobs</option><option value="mine">Just my jobs</option></select>
      <select id="calProj" aria-label="Project"><option value="">All projects</option></select>
      <div class="modes" id="modes2" role="group" aria-label="Show as">
        <button type="button" data-mode="list" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>List</span></button>
        <button type="button" data-mode="timeline" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h9M8 12h10M6 18h7"/></svg><span>Timeline</span></button>
      </div>
      <button class="btn primary" id="newBtn2">New plan</button>
    </div>
    <div class="tlbar">
      <button class="ib" id="calPrev" title="Earlier" aria-label="Earlier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="ib" id="calNext" title="Later" aria-label="Later"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="btn small" id="calToday" style="height:32px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>Today</button>
      <span class="tlrange" id="calTitle"></span><span style="flex:1"></span>
      <button class="ib" id="zoomOut" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6"/></svg></button>
      <button class="ib" id="zoomIn" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6M11 8v6"/></svg></button>
      <button class="btn small" id="zoomFit" style="height:32px" title="Fit the whole plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>Fit</button>
    </div>
    <div class="tlhint" id="calHint"></div>
    <div class="tl" id="calGrid"></div>
  </section>

  <section class="card detail" id="detail" aria-label="Plan">
    <div class="empty">Pick a plan to see it here, or create a new one.</div>
  </section>
</main>

<datalist id="people"></datalist>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TABS = [['mine', 'Mine'], ['asked', 'I asked'], ['waiting', 'Waiting on me'], ['mentioned', 'Mentions'], ['all', 'All open'], ['done', 'Done']];
let ME = null, PEOPLE = [], PROJECTS = [], TASKS = [], COUNTS = {}, VIEW = 'mine', OPEN = null, KIND = 'comment', ANSWERING = null, MENTION = null;
let JM = {};   // @mention pickers on the job form's description and note
let MODE = 'list', CAL = null, JOBOPEN = null, NEWSTART = '', NEWASSIGNEE = '';
let GROUP = (() => { try { return localStorage.getItem('cp.tl.group') === 'plan' ? 'plan' : 'person'; } catch { return 'person'; } })();   // timeline rows: by person or by plan
let RS = null, RE = null, DW = 34, FIT = true;   // timeline: first and last day shown, day width in px, fitted to the plan
const EMPTY_DETAIL = '<div class="empty">Pick a plan to see it here, or create a new one.</div>';

/** Who to suggest after @: the people on this plan first, then everyone with Team Planning. */
function mentionPeople() {
  const t = OPEN, out = [], add = (email, hint) => { if (email && email !== ME.email && !out.some(p => p.email === email)) out.push({ email, name: personName(email), hint }); };
  if (!t) return {};
  add(t.assignee, 'Assigned');
  add(t.createdBy, 'Created it');
  (t.jobs || []).forEach(j => add(j.assignee, 'Has a job: ' + j.title));
  t.activity.forEach(a => { add(a.waitingOn, 'Asked a question'); add(a.author, 'In the thread'); });
  return { involved: out, everyone: PEOPLE.filter(p => p.email !== ME.email) };
}

async function api(path, opts = {}) {
  const res = await fetch('api/' + path, { ...opts, cache: 'no-store',
    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'nscale-admin', ...(opts.headers || {}) } });
  if (res.status === 401) { location.reload(); throw new Error('Signed out'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const d = data.detail; throw new Error(Array.isArray(d) ? d.map(x => x.msg).join('; ') : (d || res.statusText)); }
  return data;
}
const send = (p, body, method = 'POST') => api(p, { method, body: JSON.stringify(body ?? {}) });

const today = () => new Date().toISOString().slice(0, 10);
const fmtDay = s => s ? new Date(s + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) : '';
function ago(s) {
  if (!s) return '';
  const d = new Date(s), mins = (Date.now() - d) / 6e4;
  if (mins < 1) return 'just now';
  if (mins < 60) return `${Math.round(mins)} min ago`;
  if (mins < 60 * 24 && d.getDate() === new Date().getDate()) return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
const initials = n => String(n || '?').split(/[\s.@]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const personName = email => (PEOPLE.find(p => p.email === email) || {}).name || (email ? email.split('@')[0].replace(/\./g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : '');
function avatar(t) {
  if (!t.assignee) return '<span class="av none" title="Unassigned">–</span>';
  return `<span class="av ${t.assignee === ME.email ? 'me' : ''}" title="${esc(t.assigneeName || t.assignee)}">${esc(initials(t.assigneeName || t.assignee))}</span>`;
}
function withMentions(text) {
  return esc(text).replace(/@([\w.+-]+@[\w-]+\.[\w.-]+|[\w.-]+)/g, (m) => `<span class="mention">${m}</span>`);
}

/* Each plan gets its own colour on the timeline and beside its jobs. */
const PALETTE = [['#0F41F3', '#E1EAF9', '#0B2A99'], ['#12A26F', '#D6FAEE', '#006B4A'], ['#7A5AF8', '#ECE8FD', '#4A3AB0'], ['#E39B12', '#FFF1D6', '#8A5300'],
                 ['#D92D6B', '#FDE7EF', '#9E1747'], ['#0E9CB8', '#DDF5FA', '#0B6377'], ['#B54708', '#FCEBDD', '#8A3505'], ['#475467', '#ECEEF3', '#344054']];
const colourOf = id => { let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
const colourVars = id => { const [c, f, t] = colourOf(id); return `--c:${c};--f:${f};--t:${t}`; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const shortDay = s => s ? new Date(s + 'T00:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '';
const span = (a, b) => !a ? '' : a === b ? fmtDay(a) : `${fmtDay(a)} → ${fmtDay(b)}`;
const days = n => `${n} day${n === 1 ? '' : 's'}`;
const statusChip = st => `<span class="chip s-${esc(String(st).toLowerCase().replace(/\s+/g, ''))}">${esc(st)}</span>`;
const findPerson = v => { v = String(v || '').trim(); const p = PEOPLE.find(x => x.email === v.toLowerCase() || x.name.toLowerCase() === v.toLowerCase()); return { assignee: p ? p.email : v, assigneeName: p ? p.name : '' }; };

/* ---------- List ---------- */
function drawTabs() {
  $('tabs').innerHTML = TABS.map(([k, label]) => `<button type="button" data-view="${k}" aria-pressed="${k === VIEW}">${esc(label)}${COUNTS[k] != null && k !== 'done' ? `<span class="n">${COUNTS[k]}</span>` : ''}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { VIEW = b.dataset.view; save(); load(); });
}

async function load() {
  const params = new URLSearchParams({ view: VIEW, project: $('proj').value });
  try {
    const r = await api('tasks?' + params);
    TASKS = r.tasks; COUNTS = r.counts;
    drawTabs(); drawRows();
    window.cpNavRefreshTasks?.();
  } catch (e) { $('rows').innerHTML = `<div class="notice">${esc(e.message)}</div>`; }
  if (MODE === 'timeline') loadCal();
}

function drawRows() {
  const words = $('q').value.toLowerCase().split(/\s+/).filter(Boolean);
  const rows = TASKS.filter(t => !words.length || words.every(w => `${t.ref} ${t.title} ${t.description} ${t.assigneeName} ${t.project?.name || ''}`.toLowerCase().includes(w)));
  const empty = { mine: 'No plans or jobs assigned to you. Nice.', asked: "You haven't given anyone a plan.", waiting: 'No questions waiting on you.',
                  mentioned: 'Nobody has mentioned you.', all: 'No open plans.', done: 'Nothing done yet.' }[VIEW];
  if (!rows.length) { $('rows').innerHTML = `<div class="empty">${TASKS.length ? 'Nothing matches.' : esc(empty)}</div>`; return; }
  $('rows').innerHTML = rows.map(t => {
    const done = t.status === 'Done', late = !done && t.due && t.due < today();
    const jb = t.jobs || {};
    const meta = [
      jb.total ? `<span>${jb.done}/${jb.total} job${jb.total === 1 ? '' : 's'} done${jb.mine ? ` · <b>${jb.mine} yours</b>` : ''}</span>` : '',
      jb.start ? `<span>${esc(shortDay(jb.start))}${jb.end !== jb.start ? ' – ' + esc(shortDay(jb.end)) : ''}</span>` : '',
      t.due ? `<span class="${late ? 'late' : ''}">${late ? 'Overdue · ' : 'Due '}${esc(fmtDay(t.due))}</span>` : '',
      t.status !== 'To do' && !done ? `<span>${esc(t.status)}${t.progress != null ? ' · ' + t.progress + '%' : ''}</span>` : '',
      t.waitingOnMe ? '<span class="q">Question for you</span>' : t.openQuestions ? `<span class="q">${t.openQuestions} open question${t.openQuestions > 1 ? 's' : ''}</span>` : '',
      t.comments ? `<span>${t.comments} comment${t.comments > 1 ? 's' : ''}</span>` : '',
      t.project ? `<span>${esc(t.project.name)}</span>` : '',
      t.priority === 'Urgent' || t.priority === 'High' ? `<span class="${t.priority === 'Urgent' ? 'late' : ''}">${esc(t.priority)}</span>` : '',
    ].filter(Boolean).join('');
    const prog = !done && t.progress ? ` prog" style="--p:${t.progress}%` : '';
    return `<div class="trow ${done ? 'isdone' : ''}" data-id="${esc(t.id)}" aria-current="${OPEN?.id === t.id}" tabindex="0">
      <button type="button" class="check ${done ? 'done' : ''}${prog}" data-done="${esc(t.id)}" title="${done ? 'Reopen' : 'Mark done'}" aria-label="${done ? 'Reopen' : 'Mark done'}: ${esc(t.title)}">✓</button>
      <div class="tmain"><div class="ttitle"><span class="jdot" style="display:inline-block;margin-right:6px;background:${colourOf(t.id)[0]}"></span>${esc(t.title)}</div><div class="tmeta">${meta}</div></div>${avatar(t)}</div>`;
  }).join('');
  $('rows').querySelectorAll('.trow').forEach(r => {
    r.onclick = e => { if (!e.target.closest('[data-done]')) openTask(r.dataset.id); };
    r.onkeydown = e => { if (e.key === 'Enter') openTask(r.dataset.id); };
  });
  $('rows').querySelectorAll('[data-done]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const t = TASKS.find(x => x.id === b.dataset.done);
    try { const r = await send('tasks/' + t.id, { status: t.status === 'Done' ? 'To do' : 'Done' }, 'PATCH');
      if (OPEN?.id === t.id) { OPEN = r; drawDetail(); } load(); }
    catch (err) { cp.alert(err.message); }
  });
}

/* ---------- One plan ---------- */
async function openTask(id, job = null) {
  try {
    if (OPEN?.id !== id) { KIND = 'comment'; ANSWERING = null; }
    OPEN = await api('tasks/' + id); JOBOPEN = job; NEWSTART = ''; NEWASSIGNEE = '';
    showDetail(); drawDetail(); drawRows(); if (MODE === 'timeline') drawCal(); save();
    if (job) document.querySelector(`.job[data-job="${CSS.escape(job)}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  catch (e) { showDetail(); $('detail').innerHTML = `<div class="notice">${esc(e.message)}</div>`; }
}

function showDetail() { $('detail').hidden = false; $('main').classList.toggle('withdetail', MODE === 'timeline'); }
function closeDetail() {
  OPEN = null; JOBOPEN = null; $('detail').innerHTML = EMPTY_DETAIL;
  if (MODE === 'timeline') { $('detail').hidden = true; $('main').classList.remove('withdetail'); drawCal(); }
  drawRows(); save();
}

function projectOptions(selected) {
  const list = [...PROJECTS];
  if (selected && !list.some(p => p.id === selected.id)) list.unshift(selected);   // keep the current one even if you can't add to it
  return `<option value="">No project</option>` + list.map(p => `<option value="${esc(p.id)}" ${selected?.id === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
}

function drawDetail() {
  const t = OPEN, ro = !t.canChange ? 'disabled' : '';
  const opt = (list, v) => list.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
  $('detail').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px"><span class="tref">${esc(t.ref)}</span>
      <span class="muted">Created by ${esc(t.createdByName || t.createdBy)} · ${esc(ago(t.createdAt))}</span><span style="flex:1"></span>
      ${t.canDelete ? '<button class="btn small danger" id="del">Delete</button>' : ''}<button class="btn small" id="closeT">Close</button></div>
    <input class="titlein" id="fTitle" value="${esc(t.title)}" aria-label="Title" maxlength="200" ${ro}>
    <div class="fields">
      <div><label for="fStatus">Status</label><select id="fStatus" ${ro}>${opt(ME.statuses, t.status)}</select></div>
      <div><label for="fPriority">Priority</label><select id="fPriority" ${ro}>${opt(ME.priorities, t.priority)}</select></div>
      <div><label for="fDue">Due</label><input type="date" id="fDue" value="${esc(t.due)}" ${ro}></div>
      <div class="two"><label for="fAssignee">Owner</label><input id="fAssignee" list="people" value="${esc(t.assignee)}" placeholder="Pick someone or type their email" ${ro}></div>
      <div><label for="fProject">Project</label><select id="fProject" ${ro}>${projectOptions(t.project)}</select></div>
      <div class="wide"><label for="fDesc">Description</label><textarea class="desc" id="fDesc" placeholder="What this plan delivers, and what done looks like" ${ro}>${esc(t.description)}</textarea></div>
    </div>
    ${t.progress != null && t.status !== 'Done' ? `<div class="muted">Progress ${t.progress}%</div><div class="bigbar"><i style="width:${t.progress}%"></i></div>` : ''}
    <div id="dNotice" class="notice" hidden></div>
    ${jobsSection(t)}
    <h2>Activity</h2>
    <div class="feed">${t.activity.map(ev).join('') || '<div class="muted">Nothing yet.</div>'}</div>
    <div class="composer" id="composer">
      <div class="kinds" id="kinds">
        ${[['comment', 'Comment'], ['question', 'Question'], ['update', 'Update']].filter(([k]) => k !== 'update' || t.canChange)
          .map(([k, l]) => `<button type="button" data-kind="${k}" aria-pressed="${k === KIND && !ANSWERING}">${l}</button>`).join('')}
      </div>
      <div class="replying" id="replying" ${ANSWERING ? '' : 'hidden'}>Answering: “${esc(ANSWERING?.body.slice(0, 80) || '')}” · <a href="#" id="cancelAnswer">cancel</a></div>
      <textarea id="cBody" placeholder="${KIND === 'question' ? 'What do you need to know?' : KIND === 'update' ? 'Where it stands' : 'Write a comment. @name to mention someone.'}"></textarea>
      <div class="opts">
        ${KIND === 'question' && !ANSWERING ? `<label class="muted" for="cTo">Ask</label><input class="ask" id="cTo" list="people" placeholder="${esc(defaultAsk())}">` : ''}
        ${KIND === 'update' && !ANSWERING ? `<label class="muted" for="cProg">Progress</label><input type="range" id="cProg" min="0" max="100" step="10" value="${t.progress ?? 0}"><span id="cProgV" class="muted">${t.progress ?? 0}%</span>` : ''}
        <span style="flex:1"></span><button class="btn primary" id="cSend">${ANSWERING ? 'Answer' : KIND === 'question' ? 'Ask' : KIND === 'update' ? 'Post update' : 'Comment'}</button>
      </div>
    </div>`;
  wireDetail();
}

function defaultAsk() {
  const t = OPEN, to = ME.email === t.assignee || !t.assignee ? t.createdBy : t.assignee;
  return to === ME.email ? 'Their email' : personName(to);
}

function ev(a) {
  const when = `<span class="when">${esc(ago(a.createdAt))}</span>`;
  const mine = a.author === ME.email || ME.admin;
  const del = mine && a.kind !== 'change' ? `<button type="button" data-del="${esc(a.id)}">Delete</button>` : '';
  if (a.kind === 'change' && (a.data || {}).field === 'job') {
    const d = a.data, verb = { added: 'added job', removed: 'removed job', done: 'finished job', scheduled: 'scheduled job' }[d.action] || 'changed job';
    return `<div class="ev change"><span class="who2">${esc(a.authorName)}</span> ${esc(verb)} <b>${esc(d.to)}</b>${d.when ? ' · ' + esc(d.when) : ''} ${when}</div>`;
  }
  if (a.kind === 'change') {
    const d = a.data || {}, label = { title: 'renamed it', status: 'set status', priority: 'set priority', due: 'set the due date', assignee: 'assigned it', project: 'moved it' }[d.field] || 'changed ' + d.field;
    let to = d.to || 'nothing';
    if (d.field === 'due') to = d.to ? fmtDay(d.to) : 'no date';
    if (d.field === 'assignee') to = d.to || 'nobody';
    if (d.field === 'project') to = d.to ? 'to ' + d.to : 'out of its project';
    return `<div class="ev change"><span class="who2">${esc(a.authorName)}</span> ${esc(label)} ${d.field === 'project' ? esc(to) : '→ <b>' + esc(to) + '</b>'} ${when}</div>`;
  }
  if (a.kind === 'question') {
    const open = !a.answeredAt, forMe = a.waitingOn === ME.email;
    return `<div class="ev box question ${open ? '' : 'answered'}"><div style="font-size:12px"><b>Question</b> from ${esc(a.authorName)} ${when}</div>
      <div class="body">${withMentions(a.body)}</div>
      <div class="act">${open ? `<span>Waiting on <b>${esc(forMe ? 'you' : personName(a.waitingOn))}</b></span><button type="button" data-answer="${esc(a.id)}">Answer</button>` : `<span>Answered by ${esc(a.answeredBy)}</span>`}${del}</div></div>`;
  }
  if (a.kind === 'update') {
    return `<div class="ev box update"><div style="font-size:12px"><b>Update</b> from ${esc(a.authorName)}${a.progress != null ? ' · ' + a.progress + '%' : ''} ${when}</div>
      ${a.body ? `<div class="body">${withMentions(a.body)}</div>` : ''}<div class="act">${del}</div></div>`;
  }
  return `<div class="ev ${a.kind === 'answer' ? 'answer' : ''}"><span class="who2">${esc(a.authorName)}</span>${a.kind === 'answer' ? ' <span class="muted">answered</span>' : ''} ${when}
    <div class="body">${withMentions(a.body)}</div>${del ? `<div class="act">${del}</div>` : ''}</div>`;
}

/* ---------- Jobs ---------- */
function jobsSection(t) {
  const jobs = t.jobs || [], done = jobs.filter(j => j.status === 'Done').length;
  const starts = jobs.filter(j => j.start), first = starts.map(j => j.start).sort()[0], last = starts.map(j => j.end).sort().pop();
  const sum = jobs.length ? `${done} of ${jobs.length} done${first ? ` · ${shortDay(first)}${last !== first ? ' – ' + shortDay(last) : ''}` : ''}` : '';
  return `<div class="jobshead"><h2>Jobs</h2><span class="muted">${esc(sum)}</span>
      ${t.canChange ? '<button class="btn small" id="addJob">+ Add job</button>' : ''}</div>
    <div class="jobs" id="jobs">
      ${jobs.map(j => jobRow(t, j)).join('')}
      ${JOBOPEN === 'new' ? `<div class="job open" data-job="new">${jobForm(t, { title: '', start: NEWSTART, duration: 1, status: 'To do', assignee: NEWASSIGNEE, description: '', note: '' })}</div>` : ''}
      ${!jobs.length && JOBOPEN !== 'new' ? `<div class="jempty">No jobs yet. ${t.canChange ? 'Add the jobs that make up this plan, with when each is expected to start and how long it takes; they show on the timeline.' : ''}</div>` : ''}
    </div>`;
}

function jobRow(t, j) {
  const open = JOBOPEN === j.id, isDone = j.status === 'Done';
  const late = !isDone && j.end && j.end < today();
  const when = j.start ? `<span class="jw ${late ? 'late' : ''}" title="${esc(span(j.start, j.end))}">${late ? 'Overdue · ' : ''}${esc(shortDay(j.start))}${j.end !== j.start ? ' – ' + esc(shortDay(j.end)) : ''} · ${days(j.duration)}</span>`
    : '<span class="jw unsched">Not scheduled</span>';
  const who = j.assignee ? `<span class="av ${j.assignee === ME.email ? 'me' : ''}" title="${esc(j.assigneeName || j.assignee)}">${esc(initials(j.assigneeName || j.assignee))}</span>` : '<span class="av none" title="Unassigned">–</span>';
  return `<div class="job ${open ? 'open' : ''} ${isDone ? 'isdone' : ''}" data-job="${esc(j.id)}" ${t.canChange ? 'draggable="true"' : ''}>
    <div class="jh" data-toggle="${esc(j.id)}">
      ${t.canChange ? '<span class="grip" title="Drag to reorder" aria-hidden="true">⋮⋮</span>' : ''}
      <button type="button" class="check ${isDone ? 'done' : ''}" data-jdone="${esc(j.id)}" ${t.canChange ? '' : 'disabled'} title="${isDone ? 'Reopen' : 'Mark done'}" aria-label="${isDone ? 'Reopen' : 'Mark done'}: ${esc(j.title)}">✓</button>
      <span class="jt">${esc(j.title)}</span>${j.status !== 'To do' && !isDone ? statusChip(j.status) : ''}${when}${who}
    </div>
    ${open ? (t.canChange ? jobForm(t, j) : jobText(j)) : ''}
  </div>`;
}

function jobText(j) {
  return `<div class="jb jtext">
    <div class="muted" style="margin-top:8px">${j.start ? esc(span(j.start, j.end)) + ' · ' + days(j.duration) : 'Not scheduled'} · ${esc(j.status)}${j.assignee ? ' · ' + esc(j.assigneeName || j.assignee) : ''}</div>
    ${j.description ? `<h3>Description</h3><div class="body">${withMentions(j.description)}</div>` : ''}
    ${j.note ? `<h3>Note</h3><div class="jnote">${withMentions(j.note)}</div>` : ''}
  </div>`;
}

function jobForm(t, j) {

function wireJobs() {
  const t = OPEN, box = $('jobs');
  if (!box) return;
  if ($('addJob')) $('addJob').onclick = () => { JOBOPEN = 'new'; NEWSTART = ''; NEWASSIGNEE = ''; drawDetail(); $('jTitle')?.focus(); };
  box.querySelectorAll('[data-toggle]').forEach(h => h.onclick = e => {
    if (e.target.closest('[data-jdone]')) return;
    JOBOPEN = JOBOPEN === h.dataset.toggle ? null : h.dataset.toggle; drawDetail(); save();
    if (MODE === 'timeline') drawCal();
  });
  box.querySelectorAll('[data-jdone]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const j = t.jobs.find(x => x.id === b.dataset.jdone);
    try { OPEN = await send(`tasks/${t.id}/jobs/${j.id}`, { status: j.status === 'Done' ? 'To do' : 'Done' }, 'PATCH'); drawDetail(); load(); }
    catch (err) { cp.alert(err.message); }
  });
  // The form (a job being edited or added)
  if ($('jSave')) {
    const ends = () => {
      const st = $('jStart').value, n = Math.max(1, Number($('jDur').value) || 1);
      $('jEnds').textContent = st ? `${fmtDay(addDays(st, n - 1))}` : '–';
    };
    $('jStart').oninput = ends; $('jDur').oninput = ends; ends();
    JM.desc?.destroy(); JM.note?.destroy();
    JM = { desc: cpMention.attach($('jDesc'), mentionPeople), note: cpMention.attach($('jNote'), mentionPeople) };
    $('jCancel').onclick = () => { JOBOPEN = null; NEWSTART = ''; drawDetail(); save(); };
    $('jTitle').onkeydown = e => { if (e.key === 'Enter') $('jSave').click(); };
    $('jSave').onclick = async () => {
      const body = { title: $('jTitle').value, start: $('jStart').value, duration: Math.max(1, Number($('jDur').value) || 1),
                     status: $('jStatus').value, description: $('jDesc').value, note: $('jNote').value, ...findPerson($('jAssignee').value),
                     mentions: [...new Set([...(JM.desc?.picked() || []), ...(JM.note?.picked() || [])])] };
      $('jSave').disabled = true;
      try {
        OPEN = JOBOPEN === 'new' ? await send(`tasks/${t.id}/jobs`, body) : await send(`tasks/${t.id}/jobs/${JOBOPEN}`, body, 'PATCH');
        JOBOPEN = null; NEWSTART = ''; drawDetail(); load(); save();
      } catch (e) { $('jNotice').hidden = false; $('jNotice').textContent = e.message; $('jSave').disabled = false; }
    };
    if ($('jDel')) $('jDel').onclick = async () => {
      const j = t.jobs.find(x => x.id === JOBOPEN);
      if (!(await cp.confirm({ title: `Delete “${j.title}”?`, message: "The job comes off this plan and the timeline. This can't be undone.", confirm: 'Delete job', danger: true }))) return;
      try { OPEN = await api(`tasks/${t.id}/jobs/${j.id}`, { method: 'DELETE' }); JOBOPEN = null; drawDetail(); load(); save(); } catch (e) { cp.alert(e.message); }
    };
  }
  // Drag to reorder
  let dragged = null;
  box.querySelectorAll('.job[draggable="true"]').forEach(el => {
    el.addEventListener('dragstart', e => {
      if (e.target.closest('input, textarea, select') || JOBOPEN) { e.preventDefault(); return; }
      dragged = el; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); box.querySelectorAll('.over').forEach(x => x.classList.remove('over')); });
    el.addEventListener('dragover', e => { if (!dragged || dragged === el) return; e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', async e => {
      e.preventDefault(); el.classList.remove('over');
      if (!dragged || dragged === el) return;
      const ids = t.jobs.map(j => j.id).filter(id => id !== dragged.dataset.job);
      const at = ids.indexOf(el.dataset.job), below = e.offsetY > el.offsetHeight / 2;
      ids.splice(at + (below ? 1 : 0), 0, dragged.dataset.job);
      dragged = null;
      try { OPEN = await send(`tasks/${t.id}/jobs/order`, { ids }); drawDetail(); } catch (err) { cp.alert(err.message); }
    });
  });
}

async function patch(body) {

}

  $('cSend').onclick = async () => {
    const body = { kind: ANSWERING ? 'answer' : KIND, body: $('cBody').value, mentions: MENTION ? MENTION.picked() : [] };
    if (ANSWERING) body.answers = ANSWERING.id;

    }
    if (KIND === 'update' && !ANSWERING) body.progress = Number($('cProg').value);
    $('cSend').disabled = true;
    try { OPEN = await send(`tasks/${OPEN.id}/activity`, body); ANSWERING = null; KIND = 'comment'; drawDetail(); load(); }
    catch (e) { $('dNotice').hidden = false; $('dNotice').textContent = e.message; $('cSend').disabled = false; }
  };
  $('cBody').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('cSend').click(); });

let LEFT = (() => { try { return Math.min(560, Math.max(200, Number(localStorage.getItem('cp.tl.left')) || 280)); } catch { return 280; } })();
const ZOOMS = [6, 9, 13, 18, 26, 34, 46, 60];
const between = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const dmy = s => s ? new Date(s + 'T00:00:00').toLocaleDateString() : '';
const said = st => st === 'To do' ? 'Not started' : st;
const avail = () => Math.max(200, ($('calGrid').clientWidth || 900) - LEFT);

async function loadCal() {
  try {
    CAL = await api('timeline?' + new URLSearchParams({ project: $('calProj').value, mine: $('calWho').value === 'mine' }));
    if (!RS) fitRange();
    drawCal();
  } catch (e) { $('calGrid').innerHTML = `<div class="notice" style="margin:16px">${esc(e.message)}</div>`; }
}

/** Show the whole plan: from the first job (or due date) to the last, with a little room either side. */
function fitRange() {
  const ds = [];
  (CAL?.plans || []).forEach(p => { if (p.due) ds.push(p.due); p.jobs.forEach(j => { if (j.start) ds.push(j.start, j.end); }); });
  ds.sort();
  if (!ds.length) { DW = 34; RS = addDays(today(), -7); RE = addDays(RS, Math.ceil(avail() / DW) - 1); }
  else {
    RS = addDays(ds[0], -2); RE = addDays(ds[ds.length - 1], 2);
    if (today() >= addDays(RS, -14) && today() < RS) RS = addDays(today(), -1);   // keep today in view when it's close
    const n = between(RS, RE) + 1;
    DW = Math.max(ZOOMS[0], Math.min(60, Math.floor(avail() / n)));
  }
  FIT = true;
}

function zoom(dir) {
  const n = between(RS, RE) + 1, mid = addDays(RS, Math.floor(n / 2));
  const i = ZOOMS.findIndex(z => z >= DW), next = dir > 0 ? ZOOMS.find(z => z > DW) : [...ZOOMS].reverse().find(z => z < DW);
  if (!next) return;
  DW = next; const m = Math.ceil(avail() / DW);
  RS = addDays(mid, -Math.floor(m / 2)); RE = addDays(RS, m - 1); FIT = false; drawCal(); save();
}
function shift(dir) { const n = between(RS, RE) + 1, by = Math.max(1, Math.round(n / 3)); RS = addDays(RS, dir * by); RE = addDays(RE, dir * by); FIT = false; drawCal(); save(); }
function goToday() { const n = Math.max(between(RS, RE) + 1, Math.ceil(avail() / DW)); RS = addDays(today(), -Math.round(n / 4)); RE = addDays(RS, n - 1); FIT = false; drawCal(); save(); }

function rangeLabel(a, b) {
  const A = new Date(a + 'T00:00:00'), B = new Date(b + 'T00:00:00');
  const left = A.toLocaleDateString(undefined, { day: 'numeric', month: 'short', ...(A.getFullYear() !== B.getFullYear() ? { year: 'numeric' } : {}) });
  return `${left} – ${B.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })}`;
}

function drawCal() {
  if (!CAL || MODE !== 'timeline') return;
  if (FIT) fitRange();   // also when the space changes, e.g. a plan opens beside the timeline
  const n = Math.max(between(RS, RE) + 1, Math.ceil(avail() / DW)), end = addDays(RS, n - 1), W = n * DW, t0 = today();
  const scale = DW >= 18 ? 'days' : DW >= 9 ? 'weeks' : 'months';
  $('calTitle').innerHTML = `${esc(rangeLabel(RS, end))} <span>· ${scale}${FIT ? ' (fit to plan)' : ''}</span>`;
  $('zoomIn').disabled = DW >= ZOOMS[ZOOMS.length - 1]; $('zoomOut').disabled = DW <= ZOOMS[0];
  const x = d => between(RS, d) * DW;   // left edge of a day

  // Header: months, then days; weekend columns and the today line behind everything.
  let months = '', daysH = '', cols = '';
  for (let i = 0; i < n; i++) {
    const d = addDays(RS, i), dt = new Date(d + 'T00:00:00'), dow = dt.getDay(), we = dow === 0 || dow === 6;
    if (i === 0 || dt.getDate() === 1) months += `<b style="left:${i * DW}px">${esc(dt.toLocaleDateString(undefined, { month: DW >= 12 ? 'long' : 'short', year: 'numeric' }))}</b>`;
    if (we && DW >= 9) cols += `<i style="left:${i * DW}px;width:${DW}px"></i>`;
    if (DW >= 18) daysH += `<span class="${we ? 'we' : ''} ${d === t0 ? 'td' : ''}" style="left:${i * DW}px;width:${DW}px">${DW >= 26 ? `<small>${esc(dt.toLocaleDateString(undefined, { weekday: 'narrow' }))}</small>` : '<small>&nbsp;</small>'}${dt.getDate()}</span>`;
    else if (dow === 1) daysH += `<span class="mon ${d === t0 ? 'td' : ''}" style="left:${i * DW}px;width:${DW * 7}px"><small>wk</small>${dt.getDate()}</span>`;
  }
  const grid = DW >= 9 ? `background-image:repeating-linear-gradient(to right, transparent 0 ${DW - 1}px, #ECEFF5 ${DW - 1}px ${DW}px)` : '';
  const todayLine = t0 >= RS && t0 <= end ? `<div class="tltoday" style="left:${LEFT + x(t0) + DW / 2 - 1}px"></div>` : '';

  const jobRow = (p, j, byPerson) => {
    const cv = colourVars(p.id), isDone = j.status === 'Done', lateJ = !isDone && j.end && j.end < t0, sel = OPEN?.id === p.id && JOBOPEN === j.id;
    const dates = j.start ? `${dmy(j.start)} – ${dmy(j.end)}` : 'Not scheduled';
    const who = j.assigneeName ? j.assigneeName.split(' ')[0] : '';
    const sub = byPerson ? `${p.ref} ${p.title} · ${dates} · ${said(j.status)}` : `${dates} · ${said(j.status)}${who ? ' · ' + j.assigneeName : ''}`;
    const label = byPerson ? esc(j.title) : esc(j.title) + (who ? ' · ' + esc(who) : '');
    const bar = j.start && j.end >= RS && j.start <= end
      ? `<div class="gbar ${p.canChange ? 'can' : ''} ${isDone ? 'done' : ''} ${lateJ ? 'late' : ''} ${sel ? 'sel' : ''}" style="left:${x(j.start) + 1}px;width:${(j.duration || 1) * DW - 2}px;${cv}"
           data-plan="${esc(p.id)}" data-job="${esc(j.id)}" title="${esc(j.title)} (${esc(p.ref)} ${esc(p.title)})\n${esc(span(j.start, j.end))} (${days(j.duration)})${who ? '\n' + esc(j.assigneeName) : ''}\n${esc(said(j.status))}${p.canChange ? '\nDrag to move; drag its right edge to change how long' : ''}">${DW * (j.duration || 1) > 40 ? label : ''}${p.canChange ? '<span class="rh"></span>' : ''}</div>` : '';
    return `<div class="tlrow tljob ${isDone ? 'isdone' : ''} ${sel ? 'sel' : ''}" style="min-height:48px">
      <div class="tllab" style="width:${LEFT}px" data-open="${esc(p.id)}" data-job="${esc(j.id)}" title="${esc(j.title)}">${byPerson ? `<span class="jn"><span class="sq" style="display:inline-block;width:9px;height:9px;margin-right:6px;background:${colourOf(p.id)[0]}"></span>${esc(j.title)}</span>` : `<span class="jn">${esc(j.title)}</span>`}<span class="js">${esc(sub)}</span></div>
      <div class="tltrack ${!j.start && p.canChange ? 'pick' : ''}" style="width:${W}px" ${!j.start && p.canChange ? `data-sched="${esc(j.id)}" data-plan="${esc(p.id)}" title="Click a day to schedule this job"` : ''}>${bar}</div></div>`;
  };
  const anyChange = CAL.plans.some(p => p.canChange);
  let rows = '';
  if (GROUP === 'plan') for (const p of CAL.plans) {
    const cv = colourVars(p.id), canAdd = p.canChange, gsel = OPEN?.id === p.id;
    const spanBar = p.start ? `<div class="tlspan" style="left:${x(p.start)}px;width:${(between(p.start, p.end) + 1) * DW}px;background:${colourOf(p.id)[0]}"></div>` : '';
    const late = p.due && p.due < t0;
    const due = p.due ? `<div class="diamond ${late ? 'late' : ''}" style="left:${x(p.due) + DW / 2}px;${cv}" data-open="${esc(p.id)}" title="${esc(p.ref)} ${esc(p.title)} is due ${esc(fmtDay(p.due))}${late ? ' (overdue)' : ''}"></div>` : '';
    rows += `<div class="tlrow tlgroup ${gsel ? 'sel' : ''}" style="min-height:36px">
      <div class="tllab" style="width:${LEFT}px" data-open="${esc(p.id)}" title="${esc(p.title)}${p.project ? ' · ' + esc(p.project) : ''}"><span class="sq" style="background:${colourOf(p.id)[0]}"></span><span class="gt">${esc(p.title)}</span><span class="ref">${esc(p.ref)}</span>
        ${canAdd ? `<button type="button" class="tladd" data-add="${esc(p.id)}" title="Add a job to ${esc(p.title)}" aria-label="Add a job to ${esc(p.title)}">+</button>` : ''}</div>
      <div class="tltrack ${canAdd ? 'pick' : ''}" style="width:${W}px" data-plan="${esc(p.id)}" ${canAdd ? 'title="Click a day to add a job starting then"' : ''}>${spanBar}${due}</div></div>`;
    if (!p.jobs.length) rows += `<div class="tlrow tljob" style="min-height:44px"><div class="tllab" style="width:${LEFT}px" data-open="${esc(p.id)}"><span class="tlnone">No jobs yet</span></div><div class="tltrack" style="width:${W}px"></div></div>`;
    for (const j of p.jobs) rows += jobRow(p, j, false);
  }
  else {
    // One group per staff member (everyone with Team Planning), their jobs under them; then anyone else with jobs, then unassigned.
    const mine = $('calWho').value === 'mine', byWho = new Map();
    const person = (email, name) => { if (!byWho.has(email)) byWho.set(email, { email, name: name || personName(email), jobs: [] }); return byWho.get(email); };
    (mine ? PEOPLE.filter(p => p.email === ME.email) : PEOPLE).forEach(p => person(p.email, p.name));
    if (mine && !byWho.size) person(ME.email, ME.name);
    CAL.plans.forEach(p => p.jobs.forEach(j => person(j.assignee || '', j.assignee ? j.assigneeName : 'Unassigned').jobs.push({ p, j })));
    const groups = [...byWho.values()].sort((a, b) => (a.email === '') - (b.email === '') || (b.email === ME.email) - (a.email === ME.email) || a.name.localeCompare(b.name));
    for (const g of groups) {
      g.jobs.sort((a, b) => (a.j.start || '9999').localeCompare(b.j.start || '9999') || a.p.ref.localeCompare(b.p.ref));
      // A faint line where they're busy; red where two of their open jobs overlap.
      const load = {};
      g.jobs.forEach(({ j }) => { if (j.start && j.status !== 'Done') for (let d = j.start; d <= j.end; d = addDays(d, 1)) load[d] = (load[d] || 0) + 1; });
      let busy = '';
      for (let i = 0; i < n; i++) { const d = addDays(RS, i); if (load[d]) busy += `<div class="tlbusy ${load[d] > 1 ? 'over' : ''}" style="left:${i * DW}px;width:${DW}px" ${load[d] > 1 ? `title="${load[d]} jobs at once on ${esc(fmtDay(d))}"` : ''}></div>`; }
      const open = g.jobs.filter(({ j }) => j.status !== 'Done').length;
      const av = g.email ? `<span class="pav ${g.email === ME.email ? 'me' : ''}">${esc(initials(g.name))}</span>` : '<span class="pav none">–</span>';
      rows += `<div class="tlrow tlgroup" style="min-height:40px">
        <div class="tllab" style="width:${LEFT}px;cursor:default" title="${esc(g.name)}${g.email ? ' · ' + esc(g.email) : ''}">${av}<span class="gt">${esc(g.name)}${g.email === ME.email ? ' (you)' : ''}</span><span class="cnt">${open} open</span>
          ${anyChange ? `<button type="button" class="tladd" data-addp="${esc(g.email)}" title="Add a job for ${esc(g.name)}" aria-label="Add a job for ${esc(g.name)}">+</button>` : ''}</div>
        <div class="tltrack ${anyChange ? 'pick' : ''}" style="width:${W}px" data-person="${esc(g.email)}" ${anyChange ? `title="Click a day to add a job for ${esc(g.name)} starting then"` : ''}>${busy}</div></div>`;
      if (!g.jobs.length) rows += `<div class="tlrow tljob" style="min-height:40px"><div class="tllab" style="width:${LEFT}px;cursor:default"><span class="tlnone">Nothing planned</span></div><div class="tltrack" style="width:${W}px"></div></div>`;
      for (const { p, j } of g.jobs) rows += jobRow(p, j, true);
    }
  }
  $('calGrid').innerHTML = `<div class="tlin" style="width:${LEFT + W}px">
    <div class="tlcols" style="left:${LEFT}px;width:${W}px;${grid}">${cols}</div>${todayLine}
    <div class="tlrow tlhd"><div class="tllab" style="width:${LEFT}px"><span class="colgrip" id="colGrip" title="Drag to widen or narrow the names"></span></div><div style="width:${W}px"><div class="tlmonths">${months}</div><div class="tldays">${daysH}</div></div></div>
    ${rows || `<div class="tlempty">${$('calWho').value === 'mine' ? 'No jobs for you in open plans.' : 'No open plans yet. Create one with New plan, then add its jobs.'}</div>`}
  </div>`;
  const unsched = CAL.plans.reduce((k, p) => k + p.jobs.filter(j => !j.start).length, 0);
  $('calHint').textContent = [anyChange ? `Drag the dates to move along. Drag a bar to move a job, or its right edge to change how long it takes. Click a day in ${GROUP === 'person' ? 'someone’s' : 'a plan’s'} row to add a job starting then.${GROUP === 'person' ? ' Red under a name means two jobs at once.' : ''}` : 'Drag the dates to move along. Click a job to see it.',
    unsched ? `${unsched} job${unsched === 1 ? ' has' : 's have'} no start date: click a day in ${unsched === 1 ? 'its' : 'their'} row to schedule ${unsched === 1 ? 'it' : 'them'}.` : ''].filter(Boolean).join(' ');
  wireTimeline();
  $('colGrip').onpointerdown = e => {
    e.preventDefault(); e.stopPropagation();
    const x0 = e.clientX, l0 = LEFT;
    const move = ev => { const l = Math.min(560, Math.max(200, l0 + ev.clientX - x0)); if (l !== LEFT) { LEFT = l; drawCal(); $('colGrip').classList.add('on'); } };
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      try { localStorage.setItem('cp.tl.left', LEFT); } catch {} drawCal(); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
}

/** Drag the dates (anywhere that isn't a bar or a name) to move earlier or later; a sideways scroll does the same. */
function wirePanning() {
  const g = $('calGrid');
  let pan = null, swallow = false, acc = 0;
  g.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.gbar, .tllab, .diamond, button')) return;
    pan = { x: e.clientX, rs: RS, re: RE, moved: false };
  });
  window.addEventListener('pointermove', e => {
    if (!pan) return;
    const dx = e.clientX - pan.x;
    if (!pan.moved && Math.abs(dx) < 5) return;
    if (!pan.moved) { pan.moved = true; g.classList.add('panning'); }
    const dd = Math.round(-dx / DW);
    if (addDays(pan.rs, dd) !== RS) { RS = addDays(pan.rs, dd); RE = addDays(pan.re, dd); FIT = false; drawCal(); }
  });
  window.addEventListener('pointerup', () => {
    if (!pan) return;
    if (pan.moved) { swallow = true; g.classList.remove('panning'); save(); setTimeout(() => { swallow = false; }, 0); }
    pan = null;
  });
  g.addEventListener('click', e => { if (swallow) { e.stopPropagation(); e.preventDefault(); swallow = false; } }, true);
  g.addEventListener('wheel', e => {
    if (MODE !== 'timeline' || !RS || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    e.preventDefault();
    acc += e.deltaX;
    const dd = Math.trunc(acc / DW);
    if (dd) { acc -= dd * DW; RS = addDays(RS, dd); RE = addDays(RE, dd); FIT = false; drawCal(); clearTimeout(g._save); g._save = setTimeout(save, 300); }
  }, { passive: false });
}

/** Adding a job for someone: which plan is it part of? (Straight in if there's only one, or one is open.) */
function planMenu(e, email, day) {
  document.querySelector('.planmenu')?.remove();
  const plans = CAL.plans.filter(p => p.canChange);
  if (!plans.length) { cp.alert('Create a plan first, then add jobs to it.'); return; }
  if (plans.length === 1) return addJobOn(plans[0].id, day, email);
  const name = email ? personName(email) : 'nobody yet';
  const m = document.createElement('div');
  m.className = 'planmenu'; m.setAttribute('role', 'menu');
  const first = OPEN && plans.find(p => p.id === OPEN.id);
  const list = first ? [first, ...plans.filter(p => p !== first)] : plans;
  m.innerHTML = `<div class="g">Add a job for ${esc(name)}${day ? ' from ' + esc(shortDay(day)) : ''} to…</div>` +
    list.map(p => `<button type="button" role="menuitem" data-pick="${esc(p.id)}"><span class="sq" style="background:${colourOf(p.id)[0]}"></span>${esc(p.title)}<span class="ref">${esc(p.ref)}</span></button>`).join('');
  document.body.append(m);
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(e.pageX, window.scrollX + document.documentElement.clientWidth - r.width - 12) + 'px';
  m.style.top = Math.min(e.pageY + 6, window.scrollY + window.innerHeight - r.height - 12) + 'px';
  const close = () => { m.remove(); document.removeEventListener('pointerdown', away, true); document.removeEventListener('keydown', key, true); };
  const away = ev => { if (!m.contains(ev.target)) close(); };
  const key = ev => { if (ev.key === 'Escape') close(); };
  setTimeout(() => { document.addEventListener('pointerdown', away, true); document.addEventListener('keydown', key, true); }, 0);
  m.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { close(); addJobOn(b.dataset.pick, day, email); });
  m.querySelector('button')?.focus();
}

const dayAt = (track, e) => addDays(RS, Math.floor((e.clientX - track.getBoundingClientRect().left) / DW));

function wireTimeline() {
  const g = $('calGrid');
  g.querySelectorAll('.tllab[data-open], .diamond[data-open]').forEach(el => el.onclick = e => {
    if (e.target.closest('[data-add]')) return;
    openTask(el.dataset.open, el.dataset.job || null);
  });
  g.querySelectorAll('[data-add]').forEach(b => b.onclick = e => { e.stopPropagation(); addJobOn(b.dataset.add, ''); });
  g.querySelectorAll('.tlgroup .tltrack.pick[data-plan]').forEach(t => t.onclick = e => { if (!e.target.closest('.diamond')) addJobOn(t.dataset.plan, dayAt(t, e)); });
  g.querySelectorAll('.tlgroup .tltrack.pick[data-person]').forEach(t => t.onclick = e => planMenu(e, t.dataset.person, dayAt(t, e)));
  g.querySelectorAll('[data-addp]').forEach(b => b.onclick = e => { e.stopPropagation(); planMenu(e, b.dataset.addp, ''); });
  g.querySelectorAll('[data-sched]').forEach(t => t.onclick = async e => {
    try { await send(`tasks/${t.dataset.plan}/jobs/${t.dataset.sched}`, { start: dayAt(t, e) }, 'PATCH'); afterJobChange(t.dataset.plan); }
    catch (err) { cp.alert(err.message); }
  });
  g.querySelectorAll('.gbar').forEach(bar => {
    bar.onpointerdown = e => {
      if (e.button !== 0) return;
      const plan = CAL.plans.find(p => p.id === bar.dataset.plan), job = plan.jobs.find(j => j.id === bar.dataset.job);
      const resize = !!e.target.closest('.rh'), x0 = e.clientX, left0 = bar.offsetLeft, w0 = bar.offsetWidth;
      let dd = 0, moved = false;
      if (plan.canChange) bar.setPointerCapture(e.pointerId);
      bar.onpointermove = ev => {
        if (!plan.canChange) return;
        const dx = ev.clientX - x0;
        if (!moved && Math.abs(dx) < 4) return;
        moved = true; bar.classList.add('dragging');
        dd = Math.round(dx / DW);
        if (resize) { const nd = Math.max(1, (job.duration || 1) + dd); dd = nd - (job.duration || 1); bar.style.width = nd * DW - 2 + 'px'; }
        else bar.style.left = left0 + dd * DW + 'px';
        const s = resize ? job.start : addDays(job.start, dd), len = resize ? (job.duration || 1) + dd : job.duration || 1;
        bar.title = `${span(s, addDays(s, len - 1))} (${days(len)})`;
        const lab = bar.closest('.tlrow').querySelector('.js');
        if (lab) lab.textContent = `${dmy(s)} – ${dmy(addDays(s, len - 1))} · ${said(job.status)}`;
      };
      bar.onpointerup = async () => {
        bar.onpointermove = bar.onpointerup = null;
        if (!moved) { openTask(plan.id, job.id); return; }
        bar.classList.remove('dragging');
        if (!dd) return drawCal();
        const body = resize ? { duration: (job.duration || 1) + dd } : { start: addDays(job.start, dd) };
        try { await send(`tasks/${plan.id}/jobs/${job.id}`, body, 'PATCH'); afterJobChange(plan.id); }
        catch (err) { cp.alert(err.message); drawCal(); }
      };
    };
  });
}

async function afterJobChange(pid) {
  FIT = false;   // keep the view still while you arrange jobs
  await loadCal();
  if (OPEN?.id === pid) { OPEN = await api('tasks/' + pid); drawDetail(); }
  load();
}

async function addJobOn(pid, day, assignee = '') {
  await openTask(pid);
  if (!OPEN?.canChange) return;
  JOBOPEN = 'new'; NEWSTART = day; NEWASSIGNEE = assignee; drawDetail();
  $('jobs')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); $('jTitle')?.focus();
}

/* ---------- Start ---------- */
(async () => {
  ME = await api('me');
  $('who').textContent = ME.email;
  const fromHash = new URLSearchParams(location.hash.slice(1));
  VIEW = TABS.some(([k]) => k === fromHash.get('view')) ? fromHash.get('view') : 'mine';
  // People to assign to: the portal's accounts with the Team Planning tool; otherwise whoever Team Planning already knows.
  const portal = await fetch('/api/people?tool=tasks', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
  PEOPLE = portal?.people?.length ? portal.people : (await api('people')).people;
  $('people').innerHTML = PEOPLE.map(p => `<option value="${esc(p.email)}">${esc(p.name)}</option>`).join('');
  const [{ projects }, all] = await Promise.all([api('projects'), api('tasks?view=all')]);
  PROJECTS = projects;
  const seen = new Map(PROJECTS.map(p => [p.id, p.name]));
  all.tasks.forEach(t => t.project && seen.set(t.project.id, t.project.name));
  const projOpts = [...seen].sort((a, b) => a[1].localeCompare(b[1])).map(([id, n]) => `<option value="${esc(id)}">${esc(n)}</option>`).join('');
  $('proj').innerHTML += projOpts; $('calProj').innerHTML += projOpts;
  if (fromHash.get('project')) $('proj').value = $('calProj').value = fromHash.get('project');
  $('proj').onchange = () => { $('calProj').value = $('proj').value; save(); load(); };
  $('calProj').onchange = () => { $('proj').value = $('calProj').value; save(); load(); };
  $('calWho').value = fromHash.get('who') === 'mine' ? 'mine' : '';
  $('calWho').onchange = () => { FIT = true; save(); loadCal(); };
  if (['person', 'plan'].includes(fromHash.get('by'))) GROUP = fromHash.get('by');
  $('calGroup').value = GROUP;
  $('calGroup').onchange = () => { GROUP = $('calGroup').value; try { localStorage.setItem('cp.tl.group', GROUP); } catch {} save(); drawCal(); };
  $('q').oninput = drawRows;
  $('newBtn').onclick = newTask; $('newBtn2').onclick = newTask;
  if (/^\d{4}-\d{2}-\d{2}$/.test(fromHash.get('from') || '')) {
    RS = fromHash.get('from'); DW = ZOOMS.includes(Number(fromHash.get('zoom'))) ? Number(fromHash.get('zoom')) : 34; FIT = false; RE = RS;
  }
  wirePanning();
  $('calPrev').onclick = () => shift(-1); $('calNext').onclick = () => shift(1);
  $('calToday').onclick = goToday;
  $('zoomIn').onclick = () => zoom(1); $('zoomOut').onclick = () => zoom(-1);
  $('zoomFit').onclick = () => { FIT = true; drawCal(); save(); };
  let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(drawCal, 150); });
  document.querySelectorAll('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  setMode(['timeline', 'calendar'].includes(fromHash.get('mode')) ? 'timeline' : 'list');
  await load();
  if (fromHash.get('task')) openTask(fromHash.get('task'), fromHash.get('job'));
})().catch(e => { $('rows').innerHTML = `<div class="notice">${esc(e.message)}</div>`; });
</script>
