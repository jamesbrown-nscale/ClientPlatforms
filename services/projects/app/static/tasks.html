<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Planning · Nscale Client Platforms</title>
<link rel="icon" href="static/nscale-icon.svg">
<script src="/static/dialog.js"></script>
<script src="/static/mention.js"></script>
<script src="/static/nav.js" defer></script>
<style>
  :root {
    --bg: #FDFFF8; --text: #040E27; --text2: #3B404E; --muted: #6B7080; --primary: #0F41F3; --primary-hover: #0B34C8;
    --border: #C1CFF7; --surface: #E1EAF9; --page: #F3F5FB; --soft: #F7F9FE;
    --ok-fill: #D6FAEE; --ok-text: #006B4A; --err-fill: #FDECEC; --err: #B42318;
    --warn-fill: #FFF1D6; --warn: #8A5300; --grey-fill: #ECEEF3; --violet-fill: #ECE8FD; --violet: #4A3AB0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--primary); }
  [hidden] { display: none !important; }
  header.top { background: var(--bg); border-bottom: 1px solid var(--surface); }
  .bar { padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 64px; }
  .bar img { height: 16px; display: block; }
  .bar .app { color: var(--text2); border-left: 1px solid var(--border); padding-left: 16px; font-weight: 600; }
  .who { margin-left: auto; color: var(--text2); font-size: 12.5px; white-space: nowrap; }
  main { padding: 24px; display: grid; grid-template-columns: minmax(340px, 1fr) minmax(0, 1.25fr); gap: 16px; align-items: start; }
  .card { background: var(--bg); border: 1px solid var(--surface); border-radius: 12px; }
  .btn { height: 34px; border-radius: 8px; padding: 0 12px; border: 1px solid var(--border); background: transparent; cursor: pointer;
         white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--surface); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--bg); font-weight: 600; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.danger { color: var(--err); border-color: #F7B4B4; }
  .btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .muted { color: var(--text2); font-size: 12.5px; }
  .notice { border-radius: 8px; padding: 9px 12px; background: var(--err-fill); color: var(--err); margin: 10px 0; }

  .list .head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; flex-wrap: wrap; }
  .list h1 { font-size: 20px; margin: 0; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 10px; }
  .tabs button { border: 1px solid var(--surface); background: transparent; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  .tabs button[aria-pressed="true"] { background: var(--surface); color: var(--primary); border-color: var(--surface); font-weight: 600; }
  .tabs .n { color: var(--text2); font-weight: 400; margin-left: 2px; }
  .filters { display: flex; gap: 8px; padding: 0 16px 12px; }
  .filters input, .filters select { height: 34px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; outline: none; min-width: 0; }
  .filters input { flex: 1; }
  .rows { border-top: 1px solid var(--surface); }
  .filters.all { flex-wrap: wrap; }
  .filters.all #q { order: -1; flex: 1 1 100%; }
  .filters.all select { flex: 1 1 0; }
  .allsum { padding: 8px 16px; font-size: 12.5px; color: var(--text2); border-bottom: 1px solid var(--surface); background: var(--soft); }
  .trow.ajob { align-items: center; }
  .trow.ajob .tmain { flex: 1; min-width: 0; }
  .trow.ajob .aplan { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .trow.ajob .aplan .sq { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .trow.ajob .aplan b { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 500; font-size: 11.5px; white-space: nowrap; }
  .trow.ajob .aplan i { color: var(--muted); }
  .trow.ajob .aside { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .trow { display: flex; gap: 10px; align-items: flex-start; padding: 11px 16px; border-bottom: 1px solid var(--surface); cursor: pointer; }
  .trow:hover { background: var(--soft); }
  .trow[aria-current="true"] { background: var(--surface); }
  .trow:last-child { border-bottom: 0; }
  .check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--muted); background: #fff; cursor: pointer; flex-shrink: 0; margin-top: 1px;
           display: grid; place-items: center; padding: 0; color: transparent; font-size: 12px; }
  .check:hover { border-color: var(--ok-text); color: var(--ok-text); }
  .check.done { background: #12A26F; border-color: #12A26F; color: #fff; }
  .check.prog { border-color: var(--primary); background: conic-gradient(var(--primary) var(--p), #fff 0); }
  .tmain { flex: 1; min-width: 0; }
  .ttitle { font-weight: 600; overflow-wrap: anywhere; }
  .done .ttitle, .trow.isdone .ttitle { text-decoration: line-through; color: var(--text2); font-weight: 400; }
  .tmeta { font-size: 12.5px; color: var(--text2); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
  .late { color: var(--err); font-weight: 600; }
  .q { color: var(--warn); font-weight: 600; }
  .av { width: 26px; height: 26px; border-radius: 50%; background: var(--violet-fill); color: var(--violet); display: grid; place-items: center;
        font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .av.me { background: var(--ok-fill); color: var(--ok-text); }
  .av.none { background: var(--grey-fill); color: var(--muted); }
  .pgroup { border-bottom: 1px solid var(--surface); }
  .pgroup:last-child { border-bottom: 0; }
  .pgroup .ph { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--soft); border-bottom: 1px solid var(--surface); position: sticky; top: 0; z-index: 1; }
  .pgroup .trow { padding-left: 26px; }
  .pgroup .psub { display: flex; align-items: center; gap: 8px; padding: 8px 16px 6px 24px; font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 1px solid var(--surface); }
  .pgroup .psub:hover { background: var(--soft); }
  .pgroup .psub .ref { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 400; font-size: 11.5px; color: var(--muted); }
  .pgroup .psub .gt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .chev { display: inline-block; width: 14px; flex-shrink: 0; color: var(--muted); font-size: 10px; transition: transform .15s; text-align: center; }
  [aria-expanded="true"] > .chev { transform: rotate(90deg); }
  .refbtn { border: 0; background: transparent; padding: 2px 6px; border-radius: 6px; cursor: pointer; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 400; font-size: 11.5px; color: var(--primary); }
  .refbtn:hover { background: var(--surface); text-decoration: underline; }
  .pgroup .trow.ind { padding-left: 50px; }
  .pgroup .trow:last-child { border-bottom: 0; }
  .empty { color: var(--text2); text-align: center; padding: 40px 16px; }

  .detail { padding: 20px; position: sticky; top: 16px; }
  .detail .tref { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--text2); }
  .titlein { width: 100%; font-size: 20px; font-weight: 600; border: 1px solid transparent; border-radius: 8px; padding: 4px 6px; margin: 2px -6px 8px; background: transparent; outline: none; }
  .titlein:hover:not(:disabled) { border-color: var(--surface); }
  .titlein:focus { border-color: var(--primary); background: #fff; }
  .fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 12px; margin-bottom: 12px; }
  .fields label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 4px; }
  .fields input, .fields select, .desc, .composer textarea, .composer input, .composer select {
    width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; outline: none; }
  .fields input, .fields select { height: 36px; }
  .fields .wide { grid-column: span 3; }
  .fields .two { grid-column: span 2; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,65,243,.12); }
  .desc { min-height: 80px; resize: vertical; }
  .bigbar { height: 8px; border-radius: 4px; background: var(--grey-fill); overflow: hidden; margin: 6px 0 14px; }
  .bigbar i { display: block; height: 100%; background: var(--primary); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text2); margin: 18px 0 8px; }
  .feed { border-left: 2px solid var(--surface); margin-left: 6px; padding-left: 14px; display: flex; flex-direction: column; gap: 10px; }
  .ev { position: relative; }
  .ev .who2 { font-weight: 600; }
  .ev .when { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .ev .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .ev.change { color: var(--text2); font-size: 13px; }
  .ev.box { border-radius: 8px; padding: 8px 10px; }
  .ev.question { background: var(--warn-fill); color: var(--warn); }
  .ev.question.answered { background: var(--grey-fill); color: var(--text2); }
  .ev.update { background: var(--surface); color: #0B2A99; }
  .ev.answer { border-left: 3px solid #E39B12; padding-left: 10px; border-radius: 0; }
  .ev .act { font-size: 12px; margin-top: 4px; display: flex; gap: 10px; }
  .ev .act button { border: 0; background: none; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; font-size: 12px; }
  .mention { background: var(--surface); color: var(--primary); border-radius: 4px; padding: 0 3px; font-weight: 600; }
  .composer { margin-top: 14px; border: 1px solid var(--border); border-radius: 10px; padding: 10px; background: var(--soft); }
  .kinds { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  .kinds button { border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
  .kinds button[aria-pressed="true"] { background: var(--surface); color: var(--primary); border-color: var(--primary); font-weight: 600; }
  .composer textarea { min-height: 64px; resize: vertical; }
  .composer .opts { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .composer .opts input[type=range] { width: 160px; padding: 0; border: 0; background: none; box-shadow: none; }
  .composer .opts input.ask { max-width: 260px; height: 32px; }
  .actbtn { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 18px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
            background: #fff; cursor: pointer; text-align: left; }
  .actbtn:hover { background: var(--soft); border-color: var(--primary); }
  .actbtn.ask { border-color: #F7B4B4; background: #FFF8F8; }
  .actbtn > svg { width: 22px; height: 22px; color: var(--primary); flex-shrink: 0; }
  .actbtn .at { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .actbtn .go { color: var(--primary); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .modal { position: fixed; inset: 0; z-index: 900; background: rgba(4,14,39,.45); display: grid; place-items: center; padding: 24px; }
  .mpanel { background: var(--bg); border-radius: 14px; width: min(760px, 100%); max-height: min(86vh, 900px); display: flex; flex-direction: column;
            box-shadow: 0 24px 60px rgba(4,14,39,.3); overflow: hidden; }
  .mhead { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px 20px; border-bottom: 1px solid var(--surface); }
  .mhead h2 { margin: 0; flex: 1; min-width: 0; font-size: 17px; text-transform: none; letter-spacing: 0; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mhead h2 .muted { font-size: 14px; font-weight: 400; margin-left: 6px; }
  .mbody { padding: 18px 20px; overflow: auto; flex: 1; min-height: 120px; }
  .mfoot { padding: 0 20px 16px; border-top: 1px solid var(--surface); }
  .mfoot .composer { margin-top: 12px; }
  @media (max-width: 700px) { .modal { padding: 0; } .mpanel { max-height: 100vh; height: 100%; border-radius: 0; } }
  .replying { font-size: 12.5px; color: var(--warn); margin-bottom: 6px; }

  /* List / Calendar switch */
  .modes { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .modes button { border: 0; background: transparent; height: 32px; padding: 0 12px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: var(--text2); }
  .modes button + button { border-left: 1px solid var(--border); }
  .modes button[aria-pressed="true"] { background: var(--surface); color: var(--primary); font-weight: 600; }
  .modes svg { width: 15px; height: 15px; }
  main.cal { grid-template-columns: minmax(0, 1fr); }
  main.cal.withdetail { grid-template-columns: minmax(0, 1fr) minmax(360px, 480px); }
  main.cal .detail .fields { grid-template-columns: 1fr 1fr; }
  main.cal .detail .fields .wide, main.cal .detail .fields .two { grid-column: span 2; }

  /* Jobs */
  .jobshead { display: flex; align-items: center; gap: 10px; margin: 18px 0 8px; }
  .jobshead h2 { margin: 0; }
  .jobshead .muted { flex: 1; }
  .jobs { display: flex; flex-direction: column; gap: 6px; }
  .job { border: 1px solid var(--surface); border-radius: 10px; background: #fff; }
  .job.open { border-color: var(--border); box-shadow: 0 2px 10px rgba(4,14,39,.06); }
  .job.dragging { opacity: .45; }
  .job.over { border-color: var(--primary); }
  .jh { display: flex; gap: 10px; align-items: center; padding: 8px 10px; cursor: pointer; }
  .jh:hover { background: var(--soft); border-radius: 10px; }
  .grip { cursor: grab; color: var(--muted); font-size: 14px; line-height: 1; user-select: none; padding: 2px 0; }
  .jdot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .jt { font-weight: 600; flex: 1 1 120px; min-width: 90px; overflow-wrap: break-word; }
  .jh { flex-wrap: wrap; row-gap: 4px; }
  .job.isdone .jt { text-decoration: line-through; color: var(--text2); font-weight: 400; }
  .jw { font-size: 12.5px; color: var(--text2); white-space: nowrap; }
  .jw.unsched { color: var(--muted); font-style: italic; }
  /* Sub jobs: a checklist inside a job */
  .jsubn { font-size: 12px; color: var(--text2); white-space: nowrap; background: var(--soft); border-radius: 999px; padding: 1px 8px; }
  .jsubn.all { background: var(--ok-fill); color: var(--ok-text); }
  .jsadd { display: none; border: 0; background: none; color: var(--primary); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .jh:hover .jsadd, .jsadd:focus-visible { display: inline-block; }
  .jsadd:hover { background: var(--surface); }
  .subs { padding: 0 10px 8px 46px; display: flex; flex-direction: column; gap: 1px; }
  .sub { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 6px; border-radius: 6px; }
  .sub:hover { background: var(--soft); }
  .scheck { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--muted); background: #fff; color: transparent; font-size: 11px; line-height: 1;
            display: grid; place-items: center; cursor: pointer; flex-shrink: 0; padding: 0; }
  .scheck.done { background: var(--ok, #12B76A); border-color: var(--ok, #12B76A); color: #fff; }
  .scheck:disabled { cursor: default; }
  .stitle { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 13.5px; }
  .stitle[data-sedit] { cursor: text; }
  .sub.done .stitle { text-decoration: line-through; color: var(--text2); }
  .sname, .swho { font-size: 12px; white-space: nowrap; border-radius: 999px; padding: 1px 8px; border: 0; font-family: inherit; }
  .sname { background: var(--violet-fill, #ECE8FD); color: var(--violet, #4A3AB0); font-weight: 600; }
  .sname.me { background: var(--ok-fill); color: var(--ok-text); }
  button.sname { cursor: pointer; }
  .swho { display: none; background: none; color: var(--primary); cursor: pointer; font-weight: 600; }
  .sub:hover .swho, .swho:focus-visible { display: inline-block; }
  .sx { display: none; border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; }
  .sub:hover .sx, .sx:focus-visible { display: inline-grid; place-items: center; }
  .sx:hover { background: var(--err-fill); color: var(--err); }
  .sub input, .sadd input { height: 28px; border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; font: inherit; font-size: 13.5px; outline: none; background: #fff; min-width: 0; }
  .sub input:focus, .sadd input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,65,243,.12); }
  .sub input.stin { flex: 1; }
  .sub input.swin { width: 170px; }
  .sadd { display: flex; gap: 6px; padding: 4px 0 0 30px; }
  .sadd input[data-snew] { flex: 1; }
  .sadd input[data-snewwho] { width: 170px; }
  .chip { font-size: 11.5px; border-radius: 999px; padding: 1px 8px; background: var(--grey-fill); color: var(--text2); white-space: nowrap; }
  .chip.s-inprogress { background: var(--surface); color: #0B2A99; }
  .chip.s-blocked { background: var(--err-fill); color: var(--err); }
  .chip.s-done { background: var(--ok-fill); color: var(--ok-text); }
  .jb { padding: 4px 12px 12px; border-top: 1px solid var(--surface); }
  .jb .fields { margin: 10px 0; }
  .jb .ends { height: 36px; display: flex; align-items: center; color: var(--text2); }
  .jb select.jplan { width: 100%; max-width: 520px; height: 36px; border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; background: #fff; }
  .jb #jPlanHint { display: block; margin-top: 4px; font-size: 12.5px; }
  .jb .recur { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; }
  .jb .recur .rchk { display: inline-flex; gap: 6px; align-items: center; margin: 0; cursor: pointer; font-weight: 600; }
  .jb .recur #jRecurBox { display: inline-flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .jb .recur #jRecurBox[hidden] { display: none; }
  .jb .recur select, .jb .recur input[type=date] { height: 36px; border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; background: #fff; width: auto; }
  .jb .recur #jRecurHint { flex-basis: 100%; }
  .jb .recur .runtil { display: inline-flex; gap: 6px; align-items: center; margin: 0; font-weight: 400; color: var(--text2); }
  .rbar { position: absolute; top: 50%; transform: translateY(-50%); height: 22px; border-radius: 6px; border: 1.5px dashed var(--c, #0F41F3);
    background: color-mix(in srgb, var(--c, #0F41F3) 12%, transparent); color: var(--text2); font-size: 11.5px; line-height: 19px; padding: 0 6px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; box-sizing: border-box; }
  .rbar:hover { background: color-mix(in srgb, var(--c, #0F41F3) 22%, transparent); }
  .jrec { color: var(--text2); white-space: nowrap; }
  .jnum { flex: 0 0 auto; min-width: 22px; text-align: right; font-weight: 700; font-size: 15px; color: var(--primary); font-variant-numeric: tabular-nums; margin-right: 8px; }
  .jnum.sm { min-width: 0; font-size: 12px; margin-right: 6px; }
  .jnum.sm:empty { display: none; }
  .trow.ind[draggable="true"] { cursor: grab; }
  .trow.ind.dragging { opacity: .5; }
  .trow.ind.over { box-shadow: inset 0 2px 0 var(--primary); }
  .pplpick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 36px; padding: 4px 6px; background: #fff; border: 1px solid var(--border); border-radius: 8px; cursor: text; }
  .pplpick:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,65,243,.12); }
  .pplpick #jChips { display: contents; }
  .pplpick input { flex: 1 1 140px; min-width: 120px; border: 0 !important; height: 26px !important; padding: 0 4px !important; outline: none; box-shadow: none !important; background: transparent; }
  .pchip { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 4px 0 10px; border-radius: 13px; background: var(--violet-fill, #ECE8FD); color: var(--violet, #4A3AB0); font-size: 13px; font-weight: 600; }
  .pchip.me { background: var(--ok-fill); color: var(--ok-text); }
  .pchip button { border: 0; background: transparent; color: inherit; cursor: pointer; width: 20px; height: 20px; border-radius: 50%; font-size: 15px; line-height: 1; padding: 0; }
  .pchip button:hover { background: rgba(4,14,39,.1); }
  .avs { display: inline-flex; flex-shrink: 0; }
  .avs .av { box-shadow: 0 0 0 2px var(--bg); }
  .avs .av + .av { margin-left: -6px; }
  .av.more { background: var(--grey-fill); color: var(--text2); font-size: 10.5px; }
  .stp { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .stp select { flex: 0 0 auto; width: auto; min-width: 160px; }
  .pctin { display: inline-flex; align-items: center; gap: 8px; color: var(--text2); font-size: 13px; }
  .pctin[hidden] { display: none; }
  .pctin input { width: 76px; text-align: right; }
  .pbar { display: inline-block; width: 90px; height: 6px; border-radius: 3px; background: var(--surface); overflow: hidden; vertical-align: middle; }
  .pbar i { display: block; height: 100%; background: var(--primary); border-radius: 3px; transition: width .15s; }
  .jpct { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); white-space: nowrap; }
  .jpct .pbar { width: 48px; height: 5px; }
  .ppct { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text2); white-space: nowrap; flex-shrink: 0; }
  .ppct .pbar { width: 56px; height: 5px; }

  .tllab .ppct { gap: 4px; font-size: 11.5px; }

  .jtext .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .jnote { background: var(--warn-fill); color: #5C3A00; border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .jactions { display: flex; gap: 8px; align-items: center; }
  .jempty { border: 1px dashed var(--border); border-radius: 10px; padding: 14px; color: var(--text2); text-align: center; font-size: 13px; }

  /* Timeline (Gantt) */
  .tlhead1 { display: flex; align-items: center; gap: 10px; padding: 14px 16px; flex-wrap: wrap; }
  .tlhead1 h1 { font-size: 20px; margin: 0; }
  .tlhead1 select { height: 34px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; outline: none; }
  .tlbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--surface); flex-wrap: wrap; }
  .ib { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; display: inline-grid; place-items: center; color: var(--text2); padding: 0; }
  .ib:hover:not(:disabled) { background: var(--surface); color: var(--text); }
  .ib:disabled { opacity: .35; cursor: default; }
  .ib svg, .tlbar .btn svg { width: 16px; height: 16px; }
  .tlrange { font-weight: 600; margin-left: 6px; white-space: nowrap; }
  .tlrange span { font-weight: 400; color: var(--muted); }
  .tlhint { font-size: 12.5px; color: var(--text2); padding: 0 16px 10px; }
  .tl { user-select: none; -webkit-user-select: none; cursor: grab; overflow: auto; border-top: 1px solid var(--surface); max-height: calc(100vh - 230px); min-height: 260px; border-radius: 0 0 12px 12px; }
  .tlin { position: relative; min-width: 100%; }
  .tlcols { position: absolute; top: 0; bottom: 0; z-index: 0; pointer-events: none; }
  .tlcols i { position: absolute; top: 0; bottom: 0; background: #F2F4F8; }
  .tltoday { position: absolute; top: 22px; bottom: 0; width: 2px; background: #E5484D; z-index: 3; pointer-events: none; }
  .tlrow { display: flex; position: relative; }
  .tllab { position: sticky; left: 0; z-index: 4; flex-shrink: 0; background: #fff; border-right: 1px solid var(--surface); padding: 0 14px 0 20px; min-width: 0;
           display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
  .tltrack { position: relative; flex-shrink: 0; z-index: 1; }
  .tlhd { position: sticky; top: 0; z-index: 6; background: #fff; border-bottom: 1px solid var(--surface); }
  .tlhd .tllab { z-index: 7; cursor: default; }
  .tl.panning, .tl.panning * { cursor: grabbing !important; }
  .tllab, .tltrack.pick { cursor: pointer; }
  .tlmonths { position: relative; height: 22px; }
  .tlmonths b { position: absolute; top: 4px; font-size: 12.5px; white-space: nowrap; padding-left: 6px; border-left: 1px solid var(--border); }
  .tldays { position: relative; height: 30px; }
  .tldays span { position: absolute; top: 0; height: 30px; text-align: center; font-size: 12px; color: var(--text2); line-height: 1.15; padding-top: 2px; }
  .tldays span small { display: block; font-size: 9.5px; color: var(--muted); text-transform: uppercase; }
  .tldays span.we { background: #ECEEF3; }
  .tldays span.td { color: #E5484D; font-weight: 700; }
  .tldays span.mon { text-align: left; padding-left: 3px; border-left: 1px solid var(--surface); }
  .tlgroup .tllab { background: var(--soft); flex-direction: row; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text); padding-top: 6px; padding-bottom: 6px; }
  .tlgroup .tllab .gt { flex: 1; min-width: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
  .tlgroup .tllab[data-sub] { padding-left: 10px; }
  .tlgroup .tllab .ref { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); }
  .tlgroup .tltrack { background: rgba(247,249,254,.75); }
  .tlgroup, .tljob { border-bottom: 1px solid var(--surface); }
  .sq { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .tladd { border: 0; background: transparent; color: var(--primary); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 4px; border-radius: 6px; }
  .tladd:hover { background: var(--surface); }
  .tljob .tllab { padding-top: 6px; padding-bottom: 6px; }
  .tlsub { border-bottom: 1px solid var(--surface); }
  .tlsub .tllab { flex-direction: row; align-items: center; gap: 8px; padding: 6px 14px 6px 22px; font-size: 13px; font-weight: 600; color: var(--text); background: #FAFBFE; }
  .tlsub .tllab .gt { flex: 1; min-width: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
  .tlsub .tllab .ref { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 400; font-size: 11.5px; color: var(--muted); }
  .tlsub.sel .tllab { box-shadow: inset 3px 0 0 var(--primary); }
  .tlsub .tltrack.pick { cursor: copy; }
  .tljob.ind .tllab { padding-left: 52px; }
  .tljob .tllab .jn, .tljob .tllab .js { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tljob .tllab .jn { font-size: 14px; line-height: 1.3; }
  .tljob .tllab .js { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .colgrip { position: absolute; right: -4px; top: 0; bottom: 0; width: 9px; cursor: col-resize; z-index: 8; }
  .colgrip::after { content: ""; position: absolute; left: 4px; top: 10px; bottom: 10px; width: 2px; border-radius: 1px; background: var(--border); opacity: 0; transition: opacity .15s; }
  .tlhd:hover .colgrip::after, .colgrip.on::after { opacity: 1; }
  .tljob.isdone .tllab .jn { text-decoration: line-through; color: var(--text2); }
  .tljob.sel .tllab, .tlgroup.sel .tllab { box-shadow: inset 3px 0 0 var(--primary); }
  .tljob.sel .tllab { background: #F5F8FF; }
  .tljob .tltrack.pick, .tlgroup .tltrack.pick { cursor: copy; }
  .tlspan { position: absolute; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; opacity: .35; }
  /* A job bar: a frame from its first to its last day, with one .gseg per working stretch inside it, so
     weekends in between stay empty. Only the pieces take the pointer. */
  .gbar { position: absolute; top: 50%; height: 24px; margin-top: -12px; pointer-events: none; user-select: none; touch-action: none; }
  .gseg { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: var(--c); color: #fff; font-size: 12px; line-height: 24px;
          padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; box-shadow: 0 1px 2px rgba(4,14,39,.15); pointer-events: auto; }
  .gbar.can .gseg { cursor: grab; }
  .gbar.dragging { opacity: .92; z-index: 5; }
  .tlrow.droptarget, .tlrow.droptarget .tllab { background: rgba(15,65,243,.07) !important; }
  .tlrow.tlgroup.droptarget .tllab { box-shadow: inset 3px 0 0 var(--primary); }
  .droptip { position: absolute; z-index: 1000; pointer-events: none; background: #040E27; color: #fff; font-size: 12.5px; font-weight: 600; padding: 4px 9px; border-radius: 6px; white-space: nowrap; }
  .gbar.dragging .gseg { cursor: grabbing; box-shadow: 0 4px 14px rgba(4,14,39,.25); }
  .gbar.done { opacity: .45; }
  .gbar.late .gseg { box-shadow: 0 0 0 2px #E5484D; }
  .gbar.sel .gseg { outline: 2px solid var(--text); outline-offset: 1px; }
  .gbar .rh { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; cursor: ew-resize; }
  .gbar .rh::after { content: ""; position: absolute; right: 3px; top: 7px; bottom: 7px; width: 2px; border-radius: 1px; background: rgba(255,255,255,.7); }
  .diamond { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; transform: rotate(45deg); border-radius: 2px; background: var(--c); cursor: pointer;
             box-shadow: 0 0 0 2px #fff; z-index: 2; }
  .diamond.late { background: #E5484D; }
  .pav { width: 24px; height: 24px; border-radius: 50%; background: var(--violet-fill); color: var(--violet); display: grid; place-items: center; font-size: 10.5px; font-weight: 700; flex-shrink: 0; }
  .pav.me { background: var(--ok-fill); color: var(--ok-text); }
  .pav.none { background: var(--grey-fill); color: var(--muted); }
  .tlgroup .tllab .cnt { font-weight: 400; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .tlbusy { position: absolute; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; background: var(--violet); opacity: .25; }
  .tlbusy.over { background: #E5484D; opacity: .55; }
  .tlleave { position: absolute; top: 4px; bottom: 4px; border-radius: 6px; background: repeating-linear-gradient(135deg, #FFF1D6 0 6px, #FFE6B3 6px 12px);
    border: 1px solid #F0C36A; color: #8A5300; font-size: 11.5px; font-weight: 600; line-height: 1; padding: 0 6px; display: flex; align-items: center;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; z-index: 1; box-sizing: border-box; }
  .tlleave:hover { border-color: #C98A12; }
  .planmenu button.pmleave { color: #8A5300; font-weight: 600; }
  dialog.leavedlg { border: 0; border-radius: 14px; padding: 0; width: min(420px, calc(100vw - 32px)); background: #FDFFF8; box-shadow: 0 24px 64px rgba(4,14,39,.28); }
  dialog.leavedlg::backdrop { background: rgba(4,14,39,.45); }
  .leavedlg form { padding: 22px 24px 18px; }
  .leavedlg h2 { margin: 0 0 4px; font-size: 18px; text-transform: none; letter-spacing: normal; color: var(--text); }
  .leavedlg .lrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .leavedlg label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  .leavedlg input { width: 100%; height: 38px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; font: inherit; background: #fff; box-sizing: border-box; }
  .leavedlg .lact { display: flex; gap: 8px; margin-top: 18px; align-items: center; }
  .planmenu { position: absolute; z-index: 1000; min-width: 240px; max-width: 340px; max-height: 300px; overflow: auto; background: #FDFFF8; border: 1px solid var(--border); border-radius: 10px;
              box-shadow: 0 12px 32px rgba(4,14,39,.18); padding: 4px; }
  .planmenu .g { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); padding: 8px 8px 4px; }
  .planmenu button { display: flex; gap: 8px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .planmenu button:hover, .planmenu button:focus { background: var(--surface); outline: none; }
  .planmenu .ref { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; color: var(--muted); margin-left: auto; flex-shrink: 0; }
  .planmenu { width: 360px; max-width: calc(100vw - 24px); max-height: min(460px, calc(100vh - 24px)); }
  .planmenu .pmq { width: calc(100% - 12px); margin: 2px 6px 6px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 13px; background: #fff; }
  .planmenu .pmq:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,65,243,.15); }
  .planmenu .pmplan { padding: 2px 0 4px; }
  .planmenu .pmplan + .pmplan { border-top: 1px solid var(--surface); }
  .planmenu .pmhead { display: flex; gap: 8px; align-items: center; padding: 8px 8px 4px; font-weight: 600; font-size: 13.5px; }
  .planmenu .pmt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .planmenu button.pmjob { flex-direction: column; align-items: flex-start; gap: 0; padding: 6px 8px 6px 30px; }
  .planmenu .pmjob .pmt { max-width: 100%; }
  .planmenu .pmm { font-size: 12px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .planmenu button.pmnew { padding: 5px 8px 5px 30px; font-size: 12.5px; color: var(--primary); font-weight: 600; }
  .planmenu [hidden] { display: none !important; }
  .planmenu .pmnone { padding: 10px 12px; color: var(--muted); font-size: 13px; }
  .tlhidden { margin-top: 4px; color: var(--text2); }
  .tlhidden .linkbtn { border: 0; background: none; padding: 0; color: var(--primary); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; }
  .tlnone { color: var(--muted); font-size: 13px; font-style: italic; }
  .tlempty { padding: 50px 16px; text-align: center; color: var(--text2); }

  @media (max-width: 1000px) { main, main.cal.withdetail { grid-template-columns: 1fr; } .detail { position: static; } }
  @media (max-width: 700px) { main { padding: 14px; } .bar { padding: 0 16px; } .bar .app, .who { display: none; } .modes span { display: none; }
    .tlrange span { display: none; }
    .fields { grid-template-columns: 1fr 1fr; } .fields .wide, .fields .two { grid-column: span 2; } }
</style>
</head>
<body>
<header class="top"><div class="bar">
  <img src="static/nscale-wordmark.svg" alt="Nscale"><span class="app">Team Planning</span>
  <div class="who"><span id="who"></span> · <a href="/logout" style="color:inherit">Sign out</a></div>
</div></header>

<main id="main">
  <section class="card list" id="listCard" aria-label="Plans">
    <div class="head"><h1>Team Planning</h1><span style="flex:1"></span><div class="modes" id="modes1" role="group" aria-label="Show as">
        <button type="button" data-mode="all" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 1.5 1.5L11 8M7 15l1.5 1.5L11 14M14 9.5h4M14 15.5h4"/></svg><span>All Tasks</span></button>
        <button type="button" data-mode="list" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>List</span></button>
        <button type="button" data-mode="timeline" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h9M8 12h10M6 18h7"/></svg><span>Timeline</span></button>
      </div><button class="btn primary" id="newBtn">New plan</button></div>
    <div class="tabs" id="tabs" role="toolbar" aria-label="Show"></div>
    <div class="filters" id="filters">
      <select id="listGroup" aria-label="Group"><option value="person">By person</option><option value="plan">By plan</option></select>
      <select id="jobSt" aria-label="Status" hidden><option value="">All statuses</option><option value="open">Not done</option><option value="To do">Not started</option><option value="In progress">In progress</option><option value="Blocked">Blocked</option><option value="Done">Done</option></select>
      <input type="search" id="q" placeholder="Search plans" aria-label="Search">
      <select id="jobSort" aria-label="Sort" hidden><option value="start">By start date</option><option value="plan">By plan</option><option value="person">By person</option><option value="status">By status</option></select>
      <select id="proj" aria-label="Project"><option value="">All projects</option></select>
    </div>
    <div class="rows" id="rows"><div class="empty">Loading…</div></div>
  </section>

  <section class="card" id="calCard" aria-label="Timeline" hidden>
    <div class="tlhead1">
      <h1>Team Planning</h1><span style="flex:1"></span>
      <select id="calGroup" aria-label="Group rows"><option value="person">By person</option><option value="plan">By plan</option></select>
      <select id="calWho" aria-label="Whose jobs"><option value="">Everyone's jobs</option><option value="mine">Just my jobs</option></select>
      <select id="calProj" aria-label="Project"><option value="">All projects</option></select>
      <div class="modes" id="modes2" role="group" aria-label="Show as">
        <button type="button" data-mode="all" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 1.5 1.5L11 8M7 15l1.5 1.5L11 14M14 9.5h4M14 15.5h4"/></svg><span>All Tasks</span></button>
        <button type="button" data-mode="list" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>List</span></button>
        <button type="button" data-mode="timeline" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h9M8 12h10M6 18h7"/></svg><span>Timeline</span></button>
      </div>
      <button class="btn primary" id="newBtn2">New plan</button>
    </div>
    <div class="tlbar">
      <button class="ib" id="calPrev" title="Earlier" aria-label="Earlier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="ib" id="calNext" title="Later" aria-label="Later"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="btn small" id="calToday" style="height:32px" title="This week and the next two"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>Today</button>
      <span class="tlrange" id="calTitle"></span><span style="flex:1"></span>
      <button class="ib" id="zoomOut" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6"/></svg></button>
      <button class="ib" id="zoomIn" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6M11 8v6"/></svg></button>
      <button class="btn small" id="zoomFit" style="height:32px" title="Fit the whole plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>Fit</button>
    </div>
    <div class="tlhint" id="calHint"></div>
    <div class="tl" id="calGrid"></div>
  </section>

  <section class="card detail" id="detail" aria-label="Plan">
    <div class="empty">Pick a plan to see it here, or create a new one.</div>
  </section>
</main>

<div class="modal" id="actModal" hidden>
  <div class="mpanel" role="dialog" aria-modal="true" aria-labelledby="actTitle">
    <div class="mhead"><h2 id="actTitle">Activity</h2><button type="button" class="ib" id="actClose" aria-label="Close" title="Close (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="mbody" id="actBody"></div>
    <div class="mfoot" id="actFoot"></div>
  </div>
</div>

<datalist id="people"></datalist>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TABS = [['mine', 'Mine'], ['asked', 'I asked'], ['waiting', 'Waiting on me'], ['mentioned', 'Mentions'], ['all', 'All open'], ['done', 'Done']];
let ME = null, PEOPLE = [], PROJECTS = [], TASKS = [], COUNTS = {}, VIEW = 'mine', OPEN = null, KIND = 'comment', ANSWERING = null, MENTION = null;
let JM = {};   // @mention pickers on the job form's description and note
let MODE = 'list', ALLJOBS = null, CAL = null, CAL_ALL = null, CAL_HIDDEN = 0, JOBOPEN = null, NEWSTART = '', NEWASSIGNEE = '';
let GROUP = (() => { try { return localStorage.getItem('cp.tl.group') === 'plan' ? 'plan' : 'person'; } catch { return 'person'; } })();   // timeline rows: by person or by plan
let RS = null, RE = null, DW = 34, FIT = false, WEEKS = true;   // timeline: first and last day shown, day width in px; fitted to the plans, or this week and the next two (the default)
const EMPTY_DETAIL = '<div class="empty">Pick a plan to see it here, or create a new one.</div>';

/** Who to suggest after @: the people on this plan first, then everyone with Team Planning. */
function mentionPeople() {
  const t = OPEN, out = [], add = (email, hint) => { if (email && email !== ME.email && !out.some(p => p.email === email)) out.push({ email, name: personName(email), hint }); };
  if (!t) return {};
  add(t.assignee, 'Assigned');
  add(t.createdBy, 'Created it');
  (t.jobs || []).forEach(j => jobPeople(j).forEach(p => add(p.email, 'Has a job: ' + j.title)));
  t.activity.forEach(a => { add(a.waitingOn, 'Asked a question'); add(a.author, 'In the thread'); });
  return { involved: out, everyone: PEOPLE.filter(p => p.email !== ME.email) };
}

async function api(path, opts = {}) {
  const res = await fetch('api/' + path, { ...opts, cache: 'no-store',
    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'nscale-admin', ...(opts.headers || {}) } });
  if (res.status === 401) { location.reload(); throw new Error('Signed out'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const d = data.detail; throw new Error(Array.isArray(d) ? d.map(x => x.msg).join('; ') : (d || res.statusText)); }
  return data;
}
const send = (p, body, method = 'POST') => api(p, { method, body: JSON.stringify(body ?? {}) });

const today = () => new Date().toISOString().slice(0, 10);
const fmtDay = s => s ? new Date(s + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) : '';
function ago(s) {
  if (!s) return '';
  const d = new Date(s), mins = (Date.now() - d) / 6e4;
  if (mins < 1) return 'just now';
  if (mins < 60) return `${Math.round(mins)} min ago`;
  if (mins < 60 * 24 && d.getDate() === new Date().getDate()) return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
const initials = n => String(n || '?').split(/[\s.@]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const personName = email => (PEOPLE.find(p => p.email === email) || {}).name || (email ? email.split('@')[0].replace(/\./g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : '');
function avatar(t) {
  if (!t.assignee) return '<span class="av none" title="Unassigned">–</span>';
  return `<span class="av ${t.assignee === ME.email ? 'me' : ''}" title="${esc(t.assigneeName || t.assignee)}">${esc(initials(t.assigneeName || t.assignee))}</span>`;
}
function withMentions(text) {
  return esc(text).replace(/@([\w.+-]+@[\w-]+\.[\w.-]+|[\w.-]+)/g, (m) => `<span class="mention">${m}</span>`);
}

/* Each plan gets its own colour on the timeline and beside its jobs. */
const PALETTE = [['#0F41F3', '#E1EAF9', '#0B2A99'], ['#12A26F', '#D6FAEE', '#006B4A'], ['#7A5AF8', '#ECE8FD', '#4A3AB0'], ['#E39B12', '#FFF1D6', '#8A5300'],
                 ['#D92D6B', '#FDE7EF', '#9E1747'], ['#0E9CB8', '#DDF5FA', '#0B6377'], ['#B54708', '#FCEBDD', '#8A3505'], ['#475467', '#ECEEF3', '#344054']];
const colourOf = id => { let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
const colourVars = id => { const [c, f, t] = colourOf(id); return `--c:${c};--f:${f};--t:${t}`; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
/* Jobs are in working days: weekends don't count, and a job starts on a weekday. */
const isWeekend = s => { const w = new Date(s + 'T00:00:00').getDay(); return w === 0 || w === 6; };
const workday = s => { while (isWeekend(s)) s = addDays(s, 1); return s; };
const workEnd = (s, n) => { s = workday(s); for (let i = 1; i < Math.max(1, n); i++) s = workday(addDays(s, 1)); return s; };
const workDays = (a, b) => { let n = 0; for (let d = a; d <= b; d = addDays(d, 1)) n += !isWeekend(d); return n; };
/** The working stretches between two days: [[Mon, Fri], [Mon, Wed], …]. Weekends fall between them. */
const workRuns = (s, e) => {
  const out = []; let a = null;
  for (let d = s; d <= e; d = addDays(d, 1)) {
    if (isWeekend(d)) { if (a) { out.push([a, addDays(d, -1)]); a = null; } }
    else if (!a) a = d;
  }
  if (a) out.push([a, e]);
  return out.length ? out : [[s, e]];   // a span that's all weekend still shows
};
const shortDay = s => s ? new Date(s + 'T00:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '';
const span = (a, b) => !a ? '' : a === b ? fmtDay(a) : `${fmtDay(a)} → ${fmtDay(b)}`;
/** "1 day", "2 days", "½ day", "1½ days". */
const days = n => { n = Number(n) || 1; const w = Math.floor(n), h = n - w >= 0.5; return `${w ? w : ''}${h ? '½' : ''} day${n > 1 ? 's' : ''}`; };
const isHalf = n => (Number(n) || 1) % 1 !== 0;
const statusChip = st => `<span class="chip s-${esc(String(st).toLowerCase().replace(/\s+/g, ''))}">${esc(st)}</span>`;
/** Everyone on a job (older jobs: their one assignee). */
const jobPeople = j => j.people?.length ? j.people : j.assignee ? [{ email: j.assignee, name: j.assigneeName || personName(j.assignee) }] : [];
const jobNames = j => jobPeople(j).map(p => p.name || personName(p.email)).join(', ');
const avatars = j => { const ps = jobPeople(j); if (!ps.length) return '<span class="av none" title="Unassigned">–</span>';
  return `<span class="avs" title="${esc(jobNames(j))}">${ps.slice(0, 3).map(p => `<span class="av ${p.email === ME.email ? 'me' : ''}">${esc(initials(p.name || p.email))}</span>`).join('')}${ps.length > 3 ? `<span class="av more">+${ps.length - 3}</span>` : ''}</span>`; };
let JPEOPLE = [];   // the people on the job being edited
const findPerson = v => { v = String(v || '').trim(); const p = PEOPLE.find(x => x.email === v.toLowerCase() || x.name.toLowerCase() === v.toLowerCase()); return { assignee: p ? p.email : v, assigneeName: p ? p.name : '' }; };

/** Everyone with Team Planning (you first), each with their jobs from CAL's open plans; then anyone else with jobs, then unassigned. */
function peopleGroups(mine) {
  const byWho = new Map();
  const person = (email, name) => { if (!byWho.has(email)) byWho.set(email, { email, name: name || personName(email), jobs: [] }); return byWho.get(email); };
  (mine ? PEOPLE.filter(p => p.email === ME.email) : PEOPLE).forEach(p => person(p.email, p.name));
  if (mine && !byWho.size) person(ME.email, ME.name);
  // A job with several people is under each of them.
  (CAL?.plans || []).forEach(p => p.jobs.forEach(j => {
    const ps = jobPeople(j);
    (ps.length ? ps : [{ email: '', name: 'Unassigned' }]).forEach(x => person(x.email, x.email ? x.name : 'Unassigned').jobs.push({ p, j }));
  }));
  const groups = [...byWho.values()].sort((a, b) => (a.email === '') - (b.email === '') || (b.email === ME.email) - (a.email === ME.email) || a.name.localeCompare(b.name));
  groups.forEach(g => g.jobs.sort((a, b) => (a.j.status === 'Done') - (b.j.status === 'Done') || (a.j.start || '9999').localeCompare(b.j.start || '9999') || a.p.ref.localeCompare(b.p.ref)));
  return groups;
}

/* Plan sub-headings under a person: collapsed unless opened (remembered), or one of its jobs is the one open. */
let EXPANDED = new Set();
try { EXPANDED = new Set(JSON.parse(localStorage.getItem('cp.tl.open') || '[]')); } catch {}
const subKey = (email, pid) => `${email}|${pid}`;
const CLOSED = new Set();   // headings you folded yourself, which stay folded even while one of their jobs is open
const isOpenSub = (email, p, js) => { const k = subKey(email, p.id);
  return EXPANDED.has(k) || (!CLOSED.has(k) && OPEN?.id === p.id && js.some(j => j.id === JOBOPEN)); };
/** A plan heading: its arrow folds and unfolds; anywhere else opens the plan on the right, unfolded. */
function headClick(e, el) {
  if (e.target.closest('[data-psub]')) return;
  if (e.target.closest('.chev') || !el.dataset.hplan) { toggleSub(el.dataset.sub, el); return; }
  if (el.getAttribute('aria-expanded') !== 'true') { EXPANDED.add(el.dataset.sub); CLOSED.delete(el.dataset.sub); try { localStorage.setItem('cp.tl.open', JSON.stringify([...EXPANDED])); } catch {} }
  openTask(el.dataset.hplan);
}

function toggleSub(key, el) {
  const shown = el?.getAttribute('aria-expanded') === 'true';
  if (shown) { EXPANDED.delete(key); CLOSED.add(key); } else { EXPANDED.add(key); CLOSED.delete(key); }
  try { localStorage.setItem('cp.tl.open', JSON.stringify([...EXPANDED])); } catch {}
  MODE === 'timeline' ? drawCal() : drawPeople();
}

/** A person's jobs gathered under their plans, plans in the order their first job comes. */
function byPlan(jobs) {
  const m = new Map();
  jobs.forEach(({ p, j }) => { if (!m.has(p.id)) m.set(p.id, { p, jobs: [] }); m.get(p.id).jobs.push(j); });
  for (const g of m.values()) g.jobs.sort((a, b) => (a.priority || 999) - (b.priority || 999));   // 1, 2, 3 …: the plan's order
  return [...m.values()];
}

function setGroup(g) {
  GROUP = g; $('calGroup').value = $('listGroup').value = g;
  try { localStorage.setItem('cp.tl.group', g); } catch {}
  save();
  if (MODE === 'timeline') drawCal(); else load();
}

/* By person: each staff member, with their jobs underneath. */
function drawPeople() {
  const words = $('q').value.toLowerCase().split(/\s+/).filter(Boolean), t0 = today();
  const anyChange = (CAL?.plans || []).some(p => p.canChange);
  const groups = peopleGroups(false).map(g => ({ ...g, jobs: g.jobs.filter(({ p, j }) => !words.length
    || words.every(w => `${g.name} ${g.email} ${j.title} ${p.ref} ${p.title} ${j.note} ${j.description}`.toLowerCase().includes(w))) }))
    .filter(g => !words.length || g.jobs.length);
  if (!groups.length) { $('rows').innerHTML = `<div class="empty">${words.length ? 'Nothing matches.' : 'Nobody has Team Planning yet.'}</div>`; return; }
  $('rows').innerHTML = groups.map(g => {
    const open = g.jobs.filter(({ j }) => j.status !== 'Done').length;
    const av = g.email ? `<span class="pav ${g.email === ME.email ? 'me' : ''}">${esc(initials(g.name))}</span>` : '<span class="pav none">–</span>';
    const jobs = byPlan(g.jobs).map(({ p, jobs: js }) => {
      const open = js.filter(j => j.status !== 'Done').length;
      const ex = isOpenSub(g.email, p, js);
      return `<div class="psub" data-sub="${esc(subKey(g.email, p.id))}" data-hplan="${esc(p.id)}" role="button" tabindex="0" aria-expanded="${ex}" title="Open ${esc(p.title)} and its jobs (the arrow ${ex ? 'hides' : 'shows'} them here)"><span class="chev" title="${ex ? 'Hide' : 'Show'} the jobs">▶</span><span class="sq" style="background:${colourOf(p.id)[0]}"></span><span class="gt">${esc(p.title)}</span><button type="button" class="refbtn" data-psub="${esc(p.id)}" title="Open ${esc(p.ref)} ${esc(p.title)}">${esc(p.ref)}</button>${planBar(p)}<span class="muted" style="font-weight:400;font-size:12px">${open} open</span></div>` +
      (ex ? js : []).map(j => {
      const done = j.status === 'Done', late = !done && j.end && j.end < t0, sel = OPEN?.id === p.id && JOBOPEN === j.id;
      const meta = [
        j.start ? `<span class="${late ? 'late' : ''}">${late ? 'Overdue · ' : ''}${esc(shortDay(j.start))}${j.end !== j.start ? ' – ' + esc(shortDay(j.end)) : ''} · ${days(j.duration)}${recurTxt(j)}</span>` : '<span style="font-style:italic">Not scheduled</span>',
        j.status !== 'To do' && !done ? `<span>${esc(saidJob(j))}</span>` : '',
        subCount(j),
        j.note ? '<span title="Has a note">📝 Note</span>' : '',
      ].filter(Boolean).join('');
      return `<div class="trow ind ${done ? 'isdone' : ''}" data-plan="${esc(p.id)}" data-job="${esc(j.id)}" aria-current="${sel}" tabindex="0" ${p.canChange ? 'draggable="true"' : ''}>
        ${jnum(j)}<button type="button" class="check ${done ? 'done' : ''}" data-pdone="${esc(j.id)}" data-pplan="${esc(p.id)}" ${p.canChange ? '' : 'disabled'} title="${done ? 'Reopen' : 'Mark done'}" aria-label="${done ? 'Reopen' : 'Mark done'}: ${esc(j.title)}">✓</button>
        <div class="tmain"><div class="ttitle">${esc(j.title)}</div><div class="tmeta">${meta}</div></div></div>`;
      }).join('');
    }).join('') || '<div class="trow" style="cursor:default"><span class="muted" style="font-style:italic;padding-left:30px">Nothing planned</span></div>';
    return `<div class="pgroup"><div class="ph">${av}<b>${esc(g.name)}${g.email === ME.email ? ' <span class="muted">(you)</span>' : ''}</b><span class="muted">${open} open</span><span style="flex:1"></span>
        ${anyChange ? `<button type="button" class="tladd" data-addp="${esc(g.email)}" title="Add a job for ${esc(g.name)}" aria-label="Add a job for ${esc(g.name)}">+</button>` : ''}</div>${jobs}</div>`;
  }).join('');
  $('rows').querySelectorAll('.trow[data-job]').forEach(r => {
    r.onclick = e => { if (!e.target.closest('[data-pdone]')) openTask(r.dataset.plan, r.dataset.job); };
    r.onkeydown = e => { if (e.key === 'Enter') openTask(r.dataset.plan, r.dataset.job); };
  });
  $('rows').querySelectorAll('.psub[data-sub]').forEach(r => {
    r.onclick = e => headClick(e, r);
    r.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === r) { e.preventDefault(); toggleSub(r.dataset.sub, r); } };
  });
  $('rows').querySelectorAll('[data-psub]').forEach(b => b.onclick = e => { e.stopPropagation(); openTask(b.dataset.psub); });
  $('rows').querySelectorAll('[data-pdone]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const j = CAL.plans.find(p => p.id === b.dataset.pplan).jobs.find(x => x.id === b.dataset.pdone);
    try { const r = await send(`tasks/${b.dataset.pplan}/jobs/${j.id}`, { status: j.status === 'Done' ? 'To do' : 'Done' }, 'PATCH');

  // Drag a job up or down among its plan's jobs: the plan's order (its priorities) changes to match.
  let dragged = null;
  $('rows').querySelectorAll('.trow.ind[draggable="true"]').forEach(el => {
    el.addEventListener('dragstart', e => { dragged = el; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); $('rows').querySelectorAll('.over').forEach(x => x.classList.remove('over')); });
    el.addEventListener('dragover', e => { if (!dragged || dragged === el || dragged.dataset.plan !== el.dataset.plan) return; e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', async e => {
      e.preventDefault(); el.classList.remove('over');
      if (!dragged || dragged === el || dragged.dataset.plan !== el.dataset.plan) return;
      const plan = CAL.plans.find(p => p.id === el.dataset.plan);
      const ids = plan.jobs.map(j => j.id).filter(id => id !== dragged.dataset.job);
      ids.splice(ids.indexOf(el.dataset.job) + (e.offsetY > el.offsetHeight / 2 ? 1 : 0), 0, dragged.dataset.job);
      dragged = null;
      try { const r = await send(`tasks/${plan.id}/jobs/order`, { ids }); if (OPEN?.id === r.id) { OPEN = r; drawDetail(); } load(); }
      catch (err) { cp.alert(err.message); }
    });
  });
}

/* ---------- All Tasks: every job in every plan, in one list ---------- */
/** "2 of 4" for a job with a checklist, or "". */
const subCount = j => (j.subs || []).length ? `<span class="jsubn ${j.subsDone === j.subs.length ? 'all' : ''}" title="Sub jobs done">${j.subsDone} of ${j.subs.length}</span>` : '';
const STATUS_ORDER = { 'In progress': 0, Blocked: 1, 'To do': 2, Done: 3 };
function drawAllJobs() {
  if (!ALLJOBS) { $('rows').innerHTML = '<div class="empty">Loading…</div>'; return; }
  const words = $('q').value.toLowerCase().split(/\s+/).filter(Boolean), st = $('jobSt').value, by = $('jobSort').value, t0 = today();
  const everyJob = ALLJOBS.flatMap(p => p.jobs.map(j => ({ p, j })));
  const list = everyJob.filter(({ p, j }) => (!st || (st === 'open' ? j.status !== 'Done' : j.status === st))
    && (!words.length || words.every(w => `${j.title} ${p.ref} ${p.title} ${p.project} ${jobNames(j)} ${jobPeople(j).map(x => x.email).join(' ')} ${said(j.status)} ${j.note} ${j.description} ${(j.subs || []).map(x => `${x.title} ${x.name} ${x.email}`).join(' ')}`.toLowerCase().includes(w))));
  const start = j => j.start || '9999', first = j => (jobNames(j) || '\uffff').toLowerCase();
  const order = {
    start: (a, b) => start(a.j).localeCompare(start(b.j)) || a.p.ref.localeCompare(b.p.ref),
    plan: (a, b) => a.p.ref.localeCompare(b.p.ref) || start(a.j).localeCompare(start(b.j)),
    person: (a, b) => first(a.j).localeCompare(first(b.j)) || start(a.j).localeCompare(start(b.j)),
    status: (a, b) => STATUS_ORDER[a.j.status] - STATUS_ORDER[b.j.status] || start(a.j).localeCompare(start(b.j)),
  }[by];
  // Done jobs go to the bottom, unless sorting by status (where they're last anyway) or showing only them.
  list.sort((a, b) => (by !== 'status' && st !== 'Done' ? (a.j.status === 'Done') - (b.j.status === 'Done') : 0) || order(a, b));
  const plans = new Set(list.map(x => x.p.id)).size;
  if (!list.length) {
    $('rows').innerHTML = `<div class="empty">${everyJob.length ? 'No jobs match.' : 'No jobs in any plan yet.'}</div>`;
    return;
  }
  $('rows').innerHTML = `<div class="allsum">${list.length} job${list.length === 1 ? '' : 's'} in ${plans} plan${plans === 1 ? '' : 's'}</div>` + list.map(({ p, j }) => {
    const done = j.status === 'Done', late = !done && j.end && j.end < t0, sel = OPEN?.id === p.id && JOBOPEN === j.id, pct = pctOf(j);
    const when = j.start ? `<span class="${late ? 'late' : ''}">${late ? 'Overdue · ' : ''}${esc(shortDay(j.start))}${j.end !== j.start ? ' – ' + esc(shortDay(j.end)) : ''} · ${days(j.duration)}${recurTxt(j)}</span>`
                         : '<span style="font-style:italic">Not scheduled</span>';
    const state = pct != null ? `<span class="jpct" title="In progress · ${pct}% complete"><span class="pbar"><i style="width:${pct}%"></i></span>${pct}%</span>`
                : j.status !== 'To do' ? statusChip(j.status) : '';
    return `<div class="trow ajob ${done ? 'isdone' : ''}" data-plan="${esc(p.id)}" data-job="${esc(j.id)}" aria-current="${sel}" tabindex="0">
      ${jnum(j)}<button type="button" class="check ${done ? 'done' : ''}" data-adone="${esc(j.id)}" data-aplan="${esc(p.id)}" ${p.canChange ? '' : 'disabled'} title="${done ? 'Reopen' : 'Mark done'}" aria-label="${done ? 'Reopen' : 'Mark done'}: ${esc(j.title)}">✓</button>
      <div class="tmain"><div class="ttitle">${esc(j.title)}</div>
        <div class="tmeta"><span class="aplan"><span class="sq" style="background:${colourOf(p.id)[0]}"></span><b>${esc(p.ref)}</b> ${esc(p.title)}${p.status === 'Done' ? ' <i>(plan done)</i>' : ''}</span>${when}</div></div>
      <div class="aside">${subCount(j)}${state}${avatars(j)}</div></div>`;
  }).join('');
  $('rows').querySelectorAll('.ajob').forEach(r => {
    const open = () => openTask(r.dataset.plan, r.dataset.job);
    r.onclick = e => { if (!e.target.closest('.check')) open(); };
    r.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === r) { e.preventDefault(); open(); } };
  });
  $('rows').querySelectorAll('[data-adone]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const j = ALLJOBS.find(p => p.id === b.dataset.aplan).jobs.find(x => x.id === b.dataset.adone);
    try { const r = await send(`tasks/${b.dataset.aplan}/jobs/${j.id}`, { status: j.status === 'Done' ? 'To do' : 'Done' }, 'PATCH');
      if (OPEN?.id === r.id) { OPEN = r; drawDetail(); } load(); }
    catch (err) { cp.alert(err.message); }
  });
}
