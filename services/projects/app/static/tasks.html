      jb.total ? `<span>${jb.done}/${jb.total} job${jb.total === 1 ? '' : 's'} done${jb.mine ? ` · <b>${jb.mine} yours</b>` : ''}</span>` : '',
      jb.start ? `<span>${esc(shortDay(jb.start))}${jb.end !== jb.start ? ' – ' + esc(shortDay(jb.end)) : ''}</span>` : '',
      t.due ? `<span class="${late ? 'late' : ''}">${late ? 'Overdue · ' : 'Due '}${esc(fmtDay(t.due))}</span>` : '',
      t.status !== 'To do' && !done ? `<span>${esc(t.status)}${t.progress != null ? ' · ' + t.progress + '%' : ''}</span>` : '',
      t.waitingOnMe ? '<span class="q">Question for you</span>' : t.openQuestions ? `<span class="q">${t.openQuestions} open question${t.openQuestions > 1 ? 's' : ''}</span>` : '',
      t.comments ? `<span>${t.comments} comment${t.comments > 1 ? 's' : ''}</span>` : '',
      t.project ? `<span>${esc(t.project.name)}</span>` : '',
      t.priority === 'Urgent' || t.priority === 'High' ? `<span class="${t.priority === 'Urgent' ? 'late' : ''}">${esc(t.priority)}</span>` : '',
    ].filter(Boolean).join('');
    const prog = !done && t.progress ? ` prog" style="--p:${t.progress}%` : '';
    return `<div class="trow ${done ? 'isdone' : ''}" data-id="${esc(t.id)}" aria-current="${OPEN?.id === t.id}" tabindex="0">
      <button type="button" class="check ${done ? 'done' : ''}${prog}" data-done="${esc(t.id)}" title="${done ? 'Reopen' : 'Mark done'}" aria-label="${done ? 'Reopen' : 'Mark done'}: ${esc(t.title)}">✓</button>
      <div class="tmain"><div class="ttitle"><span class="jdot" style="display:inline-block;margin-right:6px;background:${colourOf(t.id)[0]}"></span>${esc(t.title)}</div><div class="tmeta">${meta}</div></div>${avatar(t)}</div>`;
  }).join('');
  $('rows').querySelectorAll('.trow').forEach(r => {
    r.onclick = e => { if (!e.target.closest('[data-done]')) openTask(r.dataset.id); };
    r.onkeydown = e => { if (e.key === 'Enter') openTask(r.dataset.id); };
  });
  $('rows').querySelectorAll('[data-done]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const t = TASKS.find(x => x.id === b.dataset.done);
    try { const r = await send('tasks/' + t.id, { status: t.status === 'Done' ? 'To do' : 'Done' }, 'PATCH');
      if (OPEN?.id === t.id) { OPEN = r; drawDetail(); } load(); }
    catch (err) { cp.alert(err.message); }
  });
}

/* ---------- One plan ---------- */
async function openTask(id, job = null, at = null) {
  try {
    if (OPEN?.id !== id) { KIND = 'comment'; ANSWERING = null; }
    OPEN = await api('tasks/' + id); if (job && job !== JOBOPEN) CLOSED.clear(); JOBOPEN = job; NEWSTART = ''; NEWASSIGNEE = '';
    showDetail(); drawDetail(); drawRows();
    if (MODE === 'timeline') {
      // The timeline moves so the job you clicked (or the repeat of it) sits in the middle of what's shown.
      const j = job && OPEN.jobs.find(x => x.id === job);
      const r = at && (j?.repeats || []).find(x => x.start === at);
      if (j?.start) centreOn((r || j).start, (r || j).end);
      drawCal();
    }
    save();
    if (job) document.querySelector(`.job[data-job="${CSS.escape(job)}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  catch (e) { showDetail(); $('detail').innerHTML = `<div class="notice">${esc(e.message)}</div>`; }
}

function showDetail() { $('detail').hidden = false; $('main').classList.toggle('withdetail', MODE === 'timeline'); }
function closeDetail() {
  if (ACT_OPEN) closeActivity();
  OPEN = null; JOBOPEN = null; $('detail').innerHTML = EMPTY_DETAIL;
  if (MODE === 'timeline') { $('detail').hidden = true; $('main').classList.remove('withdetail'); drawCal(); }
  drawRows(); save();
}

function projectOptions(selected) {
  const list = [...PROJECTS];
  if (selected && !list.some(p => p.id === selected.id)) list.unshift(selected);   // keep the current one even if you can't add to it
  return `<option value="">No project</option>` + list.map(p => `<option value="${esc(p.id)}" ${selected?.id === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
}

function drawDetail() {
  const t = OPEN, ro = !t.canChange ? 'disabled' : '';
  const opt = (list, v) => list.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
  $('detail').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px"><span class="tref">${esc(t.ref)}</span>
      <span class="muted">Created by ${esc(t.createdByName || t.createdBy)} · ${esc(ago(t.createdAt))}</span><span style="flex:1"></span>
      ${t.canDelete ? '<button class="btn small danger" id="del">Delete</button>' : ''}<button class="btn small" id="closeT">Close</button></div>
    <input class="titlein" id="fTitle" value="${esc(t.title)}" aria-label="Title" maxlength="200" ${ro}>
    <div class="fields">
      <div><label for="fStatus">Status</label><select id="fStatus" ${ro}>${opt(ME.statuses, t.status)}</select></div>
      <div><label for="fPriority">Priority</label><select id="fPriority" ${ro}>${opt(ME.priorities, t.priority)}</select></div>
      <div><label for="fDue">Due</label><input type="date" id="fDue" value="${esc(t.due)}" ${ro}></div>
      <div class="two"><label for="fAssignee">Owner</label><input id="fAssignee" list="people" value="${esc(t.assignee)}" placeholder="Pick someone or type their email" ${ro}></div>
      <div><label for="fProject">Project</label><select id="fProject" ${ro}>${projectOptions(t.project)}</select></div>
      <div class="wide"><label for="fDesc">Description</label><textarea class="desc" id="fDesc" placeholder="What this plan delivers, and what done looks like" ${ro}>${esc(t.description)}</textarea></div>
    </div>
    ${t.progress != null && t.status !== 'Done' ? `<div class="muted">Progress ${t.progress}%</div><div class="bigbar"><i style="width:${t.progress}%"></i></div>` : ''}
    <div id="dNotice" class="notice" hidden></div>
    ${jobsSection(t)}
    ${activityButton(t)}`;
  wireDetail();
}

function defaultAsk() {
  const t = OPEN, to = ME.email === t.assignee || !t.assignee ? t.createdBy : t.assignee;
  return to === ME.email ? 'Their email' : personName(to);
}

function ev(a) {
  const when = `<span class="when">${esc(ago(a.createdAt))}</span>`;
  const mine = a.author === ME.email || ME.admin;
  const del = mine && a.kind !== 'change' ? `<button type="button" data-del="${esc(a.id)}">Delete</button>` : '';
  if (a.kind === 'change' && (a.data || {}).field === 'job') {
    const d = a.data, verb = { added: 'added job', removed: 'removed job', done: 'finished job', scheduled: 'scheduled job', moved_out: 'moved job', moved_in: 'moved in job' }[d.action] || 'changed job';
    return `<div class="ev change"><span class="who2">${esc(a.authorName)}</span> ${esc(verb)} <b>${esc(d.to)}</b>${d.when ? ' · ' + esc(d.when) : ''} ${when}</div>`;
  }
  if (a.kind === 'change') {
    const d = a.data || {}, label = { title: 'renamed it', status: 'set status', priority: 'set priority', due: 'set the due date', assignee: 'assigned it', project: 'moved it' }[d.field] || 'changed ' + d.field;
    let to = d.to || 'nothing';
    if (d.field === 'due') to = d.to ? fmtDay(d.to) : 'no date';
    if (d.field === 'assignee') to = d.to || 'nobody';
    if (d.field === 'project') to = d.to ? 'to ' + d.to : 'out of its project';
    return `<div class="ev change"><span class="who2">${esc(a.authorName)}</span> ${esc(label)} ${d.field === 'project' ? esc(to) : '→ <b>' + esc(to) + '</b>'} ${when}</div>`;
  }
  if (a.kind === 'question') {
    const open = !a.answeredAt, forMe = a.waitingOn === ME.email;
    return `<div class="ev box question ${open ? '' : 'answered'}"><div style="font-size:12px"><b>Question</b> from ${esc(a.authorName)} ${when}</div>
      <div class="body">${withMentions(a.body)}</div>
      <div class="act">${open ? `<span>Waiting on <b>${esc(forMe ? 'you' : personName(a.waitingOn))}</b></span><button type="button" data-answer="${esc(a.id)}">Answer</button>` : `<span>Answered by ${esc(a.answeredBy)}</span>`}${del}</div></div>`;
  }
  if (a.kind === 'update') {
    return `<div class="ev box update"><div style="font-size:12px"><b>Update</b> from ${esc(a.authorName)}${a.progress != null ? ' · ' + a.progress + '%' : ''} ${when}</div>
      ${a.body ? `<div class="body">${withMentions(a.body)}</div>` : ''}<div class="act">${del}</div></div>`;
  }
  return `<div class="ev ${a.kind === 'answer' ? 'answer' : ''}"><span class="who2">${esc(a.authorName)}</span>${a.kind === 'answer' ? ' <span class="muted">answered</span>' : ''} ${when}
    <div class="body">${withMentions(a.body)}</div>${del ? `<div class="act">${del}</div>` : ''}</div>`;
}

/* ---------- Jobs ---------- */
function jobsSection(t) {
  const jobs = t.jobs || [], done = jobs.filter(j => j.status === 'Done').length;
  const starts = jobs.filter(j => j.start), first = starts.map(j => j.start).sort()[0], last = starts.map(j => j.end).sort().pop();
  const sum = jobs.length ? `${done} of ${jobs.length} done${first ? ` · ${shortDay(first)}${last !== first ? ' – ' + shortDay(last) : ''}` : ''}` : '';
  return `<div class="jobshead"><h2>Jobs</h2><span class="muted">${esc(sum)}</span>
      ${t.canChange ? '<button class="btn small" id="addJob">+ Add job</button>' : ''}</div>
    <div class="jobs" id="jobs">
      ${jobs.map(j => jobRow(t, j)).join('')}
      ${JOBOPEN === 'new' ? `<div class="job open" data-job="new">${jobForm(t, { title: '', start: NEWSTART, duration: 1, status: 'To do', people: NEWASSIGNEE ? [{ email: NEWASSIGNEE, name: personName(NEWASSIGNEE) }] : [], description: '', note: '' })}</div>` : ''}
      ${!jobs.length && JOBOPEN !== 'new' ? `<div class="jempty">No jobs yet. ${t.canChange ? 'Add the jobs that make up this plan, with when each is expected to start and how long it takes; they show on the timeline.' : ''}</div>` : ''}
    </div>`;
}

function jobRow(t, j) {
  const open = JOBOPEN === j.id, isDone = j.status === 'Done';
  const late = !isDone && j.end && j.end < today();
  const when = j.start ? `<span class="jw ${late ? 'late' : ''}" title="${esc(span(j.start, j.end))}">${late ? 'Overdue · ' : ''}${esc(shortDay(j.start))}${j.end !== j.start ? ' – ' + esc(shortDay(j.end)) : ''} · ${days(j.duration)}${recurTxt(j)}</span>`
    : '<span class="jw unsched">Not scheduled</span>';
  const who = avatars(j);
  return `<div class="job ${open ? 'open' : ''} ${isDone ? 'isdone' : ''}" data-job="${esc(j.id)}" ${t.canChange ? 'draggable="true"' : ''}>
    <div class="jh" data-toggle="${esc(j.id)}">
      ${t.canChange ? '<span class="grip" title="Drag to reorder" aria-hidden="true">⋮⋮</span>' : ''}
      ${jnum(j)}<button type="button" class="check ${isDone ? 'done' : ''}" data-jdone="${esc(j.id)}" ${t.canChange ? '' : 'disabled'} title="${isDone ? 'Reopen' : 'Mark done'}" aria-label="${isDone ? 'Reopen' : 'Mark done'}: ${esc(j.title)}">✓</button>
      <span class="jt">${esc(j.title)}</span>${t.canChange && !(j.subs || []).length && !open && !SUBADD.has(j.id) ? `<button type="button" class="jsadd" data-sfirst="${esc(j.id)}" title="Break this job into a checklist">+ Sub job</button>` : ''}${(j.subs || []).length ? `<span class="jsubn ${j.subsDone === j.subs.length ? 'all' : ''}" title="Sub jobs done">${j.subsDone} of ${j.subs.length}</span>` : ''}${pctOf(j) != null ? `<span class="jpct" title="In progress · ${pctOf(j)}% complete"><span class="pbar"><i style="width:${pctOf(j)}%"></i></span>${pctOf(j)}%</span>` : j.status !== 'To do' && !isDone ? statusChip(j.status) : ''}${when}${who}
    </div>
    ${subsBlock(t, j, open)}
    ${open ? (t.canChange ? jobForm(t, j) : jobText(j)) : ''}
  </div>`;
}

/* Sub jobs: a checklist inside a job. Tick, click a title to rename it, give one to someone, × to remove. */
const SUBADD = new Set();   // jobs whose "add a sub job" line is showing though they have none yet
let SUBFOCUS = null;        // the job whose add line gets the cursor after the page redraws
function subsBlock(t, j, open) {
  const subs = j.subs || [], can = t.canChange;
  if (!subs.length && !(can && (open || SUBADD.has(j.id)))) return '';
  return `<div class="subs" data-sjob="${esc(j.id)}">
    ${subs.map(s => `<div class="sub ${s.done ? 'done' : ''}" data-sub="${esc(s.id)}">
      <button type="button" class="scheck ${s.done ? 'done' : ''}" data-sdone ${can ? '' : 'disabled'} aria-label="${s.done ? 'Not done' : 'Done'}: ${esc(s.title)}" title="${s.done ? 'Not done' : 'Done'}">✓</button>
      <span class="stitle" ${can ? 'data-sedit tabindex="0" title="Click to rename"' : ''}>${esc(s.title)}</span>
      ${s.email ? (can ? `<button type="button" class="sname ${s.email === ME.email ? 'me' : ''}" data-swho title="${esc(s.email)}: click to change">${esc(s.name || s.email)}</button>`
                       : `<span class="sname ${s.email === ME.email ? 'me' : ''}" title="${esc(s.email)}">${esc(s.name || s.email)}</span>`)
                : can ? '<button type="button" class="swho" data-swho title="Give it to someone">+ Person</button>' : ''}
      ${can ? `<button type="button" class="sx" data-sdel aria-label="Remove ${esc(s.title)}" title="Remove">×</button>` : ''}
    </div>`).join('')}
    ${can ? `<div class="sadd"><input data-snew maxlength="200" placeholder="+ Add sub job" aria-label="New sub job"><input data-snewwho list="people" placeholder="Who (optional)" aria-label="Who it's for" autocomplete="off"></div>` : ''}
  </div>`;
}

async function subSend(t, jid, path, body, method) {
  try { OPEN = await send(`tasks/${t.id}/jobs/${jid}/subs${path}`, body, method); drawDetail(); load(); return true; }
  catch (err) { cp.alert(err.message); return false; }
}

function wireSubs(t, box) {
  box.querySelectorAll('[data-sfirst]').forEach(b => b.onclick = e => {
    e.stopPropagation(); SUBADD.add(b.dataset.sfirst); SUBFOCUS = b.dataset.sfirst; drawDetail();
  });
  box.querySelectorAll('.subs').forEach(list => {
    const jid = list.dataset.sjob;
    list.querySelectorAll('[data-sdone]').forEach(b => b.onclick = () => {
      const sid = b.closest('[data-sub]').dataset.sub, s = t.jobs.find(x => x.id === jid).subs.find(x => x.id === sid);
      subSend(t, jid, '/' + sid, { done: !s.done }, 'PATCH');
    });
    list.querySelectorAll('[data-sdel]').forEach(b => b.onclick = () => subSend(t, jid, '/' + b.closest('[data-sub]').dataset.sub, null, 'DELETE'));
    // Rename: the title becomes a box; Enter or leaving it saves, Escape puts it back.
    list.querySelectorAll('[data-sedit]').forEach(el => {
      const edit = () => {
        const sid = el.closest('[data-sub]').dataset.sub, was = el.textContent;
        const inp = document.createElement('input'); inp.className = 'stin'; inp.value = was; inp.maxLength = 200; inp.setAttribute('aria-label', 'Sub job');
        el.replaceWith(inp); inp.focus(); inp.select();
        let done = false;
        const finish = keep => { if (done) return; done = true; const v = inp.value.trim();
          if (keep && v && v !== was) subSend(t, jid, '/' + sid, { title: v }, 'PATCH'); else drawDetail(); };
        inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); finish(true); } else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); } };
        inp.onblur = () => finish(true);
      };
      el.onclick = edit; el.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); edit(); } };
    });
    // Who it's for: a box with the people list; empty takes them off it.
    list.querySelectorAll('[data-swho]').forEach(b => b.onclick = () => {
      const sid = b.closest('[data-sub]').dataset.sub, s = t.jobs.find(x => x.id === jid).subs.find(x => x.id === sid);
      const inp = document.createElement('input'); inp.className = 'swin'; inp.setAttribute('list', 'people'); inp.value = s.name || s.email || '';
      inp.placeholder = 'Name or email'; inp.setAttribute('aria-label', 'Who it’s for');
      b.replaceWith(inp); inp.focus(); inp.select();
      let done = false;
      const finish = keep => { if (done) return; done = true;
        if (!keep) return drawDetail();
        const v = inp.value.trim(), email = v ? findPerson(v).assignee : '';
        if (email === (s.email || '')) return drawDetail();
        subSend(t, jid, '/' + sid, { email }, 'PATCH');
      };
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); finish(true); } else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); } };
      inp.onchange = () => { if (PEOPLE.some(p => p.email === inp.value || p.name === inp.value)) finish(true); };
      inp.onblur = () => finish(true);
    });
    // Add: type, optionally who, Enter. The cursor stays on the add line for the next one.
    const add = list.querySelector('[data-snew]'), who = list.querySelector('[data-snewwho]');
    if (!add) return;
    const go = async () => {
      const title = add.value.trim(); if (!title) return;
      const w = who.value.trim(), email = w ? findPerson(w).assignee : '';
      SUBFOCUS = jid;
      if (await subSend(t, jid, '', { title, email }, 'POST')) SUBADD.delete(jid);
    };
    add.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } else if (e.key === 'Escape' && !add.value) { e.stopPropagation(); SUBADD.delete(jid); drawDetail(); } };
    who.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
    if (SUBFOCUS === jid) { SUBFOCUS = null; add.focus(); }
  });
}

function jobText(j) {
  return `<div class="jb jtext">
    <div class="muted" style="margin-top:8px">${j.start ? esc(span(j.start, j.end)) + ' · ' + days(j.duration) : 'Not scheduled'} · ${esc(saidJob(j))}${jobPeople(j).length ? ' · ' + esc(jobNames(j)) : ''}</div>
    ${j.description ? `<h3>Description</h3><div class="body">${withMentions(j.description)}</div>` : ''}
    ${j.note ? `<h3>Note</h3><div class="jnote">${withMentions(j.note)}</div>` : ''}
  </div>`;
}

const recurWord = j => (ME.recur || {})[j.recur] || '';
const recurTxt = j => j.recur ? ` · ↻ ${recurWord(j)}` : '';
/** A job's priority: its place in its plan (1 is the top). Drag a job up or down the plan to change it. */
const jnum = j => j.priority ? `<span class="jnum" title="Priority ${j.priority} in its plan: drag it up or down to change">${j.priority}</span>` : '';

function jobForm(t, j) {
  const opt = (list, v) => list.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
  return `<div class="jb"><div class="fields">
      <div class="wide"><label for="jTitle">Job</label><input id="jTitle" value="${esc(j.title)}" maxlength="200" placeholder="What needs doing"></div>
      ${j.id ? `<div class="wide"><label for="jPlan">Plan</label><select id="jPlan" class="jplan"><option value="${esc(t.id)}">${esc(t.ref)} ${esc(t.title)}</option></select>
        <span class="muted" id="jPlanHint" hidden>Saving moves the job, with its dates, people, sub jobs and notes, to the end of that plan.</span></div>` : ''}
      <div><label for="jStart">Expected start</label><input type="date" id="jStart" value="${esc(j.start)}"></div>
      <div><label for="jDur">Duration (working days)</label><input type="number" id="jDur" min="0.5" max="365" step="0.5" value="${esc(j.duration || 1)}" title="Whole or half days: 0.5, 1, 1.5 …"></div>
      <div><label>Ends</label><div class="ends" id="jEnds"></div></div>
      <div class="wide recur"><label class="rchk"><input type="checkbox" id="jRecur" ${j.recur ? 'checked' : ''}> Recurring</label>
        <span id="jRecurBox" ${j.recur ? '' : 'hidden'}><select id="jFreq" aria-label="How often">${Object.entries(ME.recur || {}).map(([k, v]) => `<option value="${k}" ${k === (j.recur || 'weekly') ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>
          <label class="runtil">until <input type="date" id="jUntil" value="${esc(j.recurUntil || '')}" aria-label="Repeat until (optional)"></label>
          <span class="muted" id="jRecurHint"></span></span></div>
      <div class="two"><label for="jWho">Assigned to</label><div class="pplpick" id="jPeople"><span id="jChips"></span><input id="jWho" list="people" placeholder="Add someone: name or email" autocomplete="off"></div></div>
      <div class="two"><label for="jStatus">Status</label><div class="stp"><select id="jStatus">${opt(ME.statuses, j.status)}</select>
        <span class="pctin" id="jPctBox" ${j.status === 'In progress' ? '' : 'hidden'}><input type="number" id="jPct" min="0" max="100" step="5" value="${esc(j.progress || 0)}" aria-label="Per cent complete"><span>% complete</span>
          <span class="pbar" aria-hidden="true"><i id="jPctBar" style="width:${Math.max(0, Math.min(100, j.progress || 0))}%"></i></span></span></div></div>
      <div class="wide"><label for="jDesc">Description</label><textarea class="desc" id="jDesc" placeholder="What the job involves. @name to tag someone.">${esc(j.description)}</textarea></div>
      <div class="wide"><label for="jNote">Note</label><textarea class="desc" id="jNote" style="min-height:56px" placeholder="Anything to remember: access, contacts, dependencies, kit. @name to tag someone.">${esc(j.note)}</textarea></div>
    </div>
    <div id="jNotice" class="notice" hidden></div>
    <div class="jactions"><button class="btn primary small" id="jSave">${j.id ? 'Save job' : 'Add job'}</button><button class="btn small" id="jCancel">Cancel</button>
      <span style="flex:1"></span>${j.id ? '<button class="btn small danger" id="jDel">Delete job</button>' : ''}</div>
  </div>`;
}

function wireJobs() {
  const t = OPEN, box = $('jobs');
  if (!box) return;
  if ($('addJob')) $('addJob').onclick = () => { JOBOPEN = 'new'; NEWSTART = ''; NEWASSIGNEE = ''; drawDetail(); $('jTitle')?.focus(); };
  wireSubs(t, box);
  box.querySelectorAll('[data-toggle]').forEach(h => h.onclick = e => {
    if (e.target.closest('[data-jdone], [data-sfirst]')) return;
    JOBOPEN = JOBOPEN === h.dataset.toggle ? null : h.dataset.toggle; drawDetail(); save();
    if (MODE === 'timeline') {
      const j = JOBOPEN && t.jobs.find(x => x.id === JOBOPEN);
      if (j?.start) centreOn(j.start, j.end);
      drawCal();
    }
  });
  box.querySelectorAll('[data-jdone]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const j = t.jobs.find(x => x.id === b.dataset.jdone);
    try { OPEN = await send(`tasks/${t.id}/jobs/${j.id}`, { status: j.status === 'Done' ? 'To do' : 'Done' }, 'PATCH'); drawDetail(); load(); }
    catch (err) { cp.alert(err.message); }
  });
  // The form (a job being edited or added)
  if ($('jSave')) {
    const ends = () => {
      const st = $('jStart').value, n = Math.max(0.5, Number($('jDur').value) || 1);
      $('jEnds').textContent = st ? `${fmtDay(workEnd(st, n))}` : '–';
    };
    $('jStart').oninput = () => { ends(); recurHint(); }; $('jDur').oninput = ends; ends();
    // Recurring: how often, and (optionally) until when. Each repeat is as long as the first, on the timeline.
    const recurHint = () => {
      const on = $('jRecur').checked;
      $('jRecurBox').hidden = !on;
      $('jRecurHint').textContent = !on ? '' : !$('jStart').value ? 'Set the expected start: it repeats from there.'
        : `Repeats ${($('jFreq').selectedOptions[0]?.textContent || '').toLowerCase()} from ${fmtDay($('jStart').value)}${$('jUntil').value ? '' : ', with no end'}. Each repeat shows on the timeline for whoever it's assigned to.`;
    };
    $('jRecur').onchange = recurHint; $('jFreq').onchange = recurHint; $('jUntil').oninput = recurHint; recurHint();
    // Assigned to: a chip per person; pick from the list or type a name or email, then Enter (or a comma).
    const editing = JOBOPEN === 'new' ? null : t.jobs.find(x => x.id === JOBOPEN);
    JPEOPLE = editing ? jobPeople(editing).map(p => ({ ...p })) : (NEWASSIGNEE ? [{ email: NEWASSIGNEE, name: personName(NEWASSIGNEE) }] : []);
    const chips = () => {
      $('jChips').innerHTML = JPEOPLE.map((p, i) => `<span class="pchip ${p.email === ME.email ? 'me' : ''}" title="${esc(p.email)}">${esc(p.name || p.email)}<button type="button" data-unp="${i}" aria-label="Take ${esc(p.name || p.email)} off this job">×</button></span>`).join('');
      $('jChips').querySelectorAll('[data-unp]').forEach(b => b.onclick = () => { JPEOPLE.splice(+b.dataset.unp, 1); chips(); $('jWho').focus(); });
      $('jWho').placeholder = JPEOPLE.length ? 'Add someone else' : 'Add someone: name or email';
    };
    const addWho = () => {
      const v = $('jWho').value.replace(/,$/, '').trim(); if (!v) return false;
      const p = findPerson(v);
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(p.assignee)) { $('jNotice').hidden = false; $('jNotice').textContent = `Pick “${v}” from the list, or type their email.`; return true; }
      $('jNotice').hidden = true;
      if (!JPEOPLE.some(x => x.email === p.assignee)) JPEOPLE.push({ email: p.assignee, name: p.assigneeName || personName(p.assignee) });
      $('jWho').value = ''; chips(); return true;
    };
    $('jWho').onkeydown = e => {
      if ((e.key === 'Enter' || e.key === ',' || (e.key === 'Tab' && $('jWho').value.trim())) && addWho()) e.preventDefault();
      else if (e.key === 'Enter') e.preventDefault();
      else if (e.key === 'Backspace' && !$('jWho').value && JPEOPLE.length) { JPEOPLE.pop(); chips(); }
    };
    // Picking from the suggestions fills the box with a whole email or name: take it straight away.
    $('jWho').oninput = e => { const v = $('jWho').value.trim().toLowerCase(); if (e.inputType === 'insertReplacementText' || !e.inputType || PEOPLE.some(p => p.email === v)) addWho(); };
    $('jPeople').onclick = e => { if (e.target === $('jPeople')) $('jWho').focus(); };
    chips();
    const pct = () => { const v = Math.max(0, Math.min(100, Math.round(Number($('jPct').value) || 0))); $('jPctBar').style.width = v + '%'; return v; };
    $('jStatus').onchange = () => { $('jPctBox').hidden = $('jStatus').value !== 'In progress'; if (!$('jPctBox').hidden) $('jPct').focus(); };
    $('jPct').oninput = pct;
    JM.desc?.destroy(); JM.note?.destroy();
    JM = { desc: cpMention.attach($('jDesc'), mentionPeople), note: cpMention.attach($('jNote'), mentionPeople) };
    $('jCancel').onclick = () => { JOBOPEN = null; NEWSTART = ''; drawDetail(); save(); };
    $('jTitle').onkeydown = e => { if (e.key === 'Enter') $('jSave').click(); };
    // Plan: any plan you can change; picking another one moves the job there when you save.
    if ($('jPlan')) {
      api('timeline').then(r => {
        if (!$('jPlan')) return;
        const plans = r.plans.filter(p => p.canChange && p.id !== t.id).sort((a, b) => a.title.localeCompare(b.title));
        $('jPlan').insertAdjacentHTML('beforeend', plans.map(p => `<option value="${esc(p.id)}">${esc(p.ref)} ${esc(p.title)}</option>`).join(''));
      }).catch(() => {});
      $('jPlan').onchange = () => { $('jPlanHint').hidden = $('jPlan').value === t.id; };
    }
    $('jSave').onclick = async () => {
      if ($('jWho').value.trim()) { addWho(); if ($('jWho').value.trim()) return $('jWho').focus(); }   // someone typed but not added
      const body = { title: $('jTitle').value, start: $('jStart').value, duration: Math.max(0.5, Math.round((Number($('jDur').value) || 1) * 2) / 2),
                     recur: $('jRecur').checked ? $('jFreq').value : '', recurUntil: $('jRecur').checked ? $('jUntil').value : '',
                     status: $('jStatus').value, ...($('jStatus').value === 'In progress' ? { progress: pct() } : {}), description: $('jDesc').value, note: $('jNote').value, people: JPEOPLE,
                     mentions: [...new Set([...(JM.desc?.picked() || []), ...(JM.note?.picked() || [])])] };
      $('jSave').disabled = true;
      try {
        OPEN = JOBOPEN === 'new' ? await send(`tasks/${t.id}/jobs`, body) : await send(`tasks/${t.id}/jobs/${JOBOPEN}`, body, 'PATCH');
        const to = $('jPlan')?.value;
        if (JOBOPEN !== 'new' && to && to !== t.id) {
          // Moved: open the plan it's in now, on that job.
          OPEN = await send(`tasks/${t.id}/jobs/${JOBOPEN}/move`, { plan: to });
          drawDetail(); load(); save();
          if (MODE === 'timeline') loadCal();
          document.querySelector(`.job[data-job="${CSS.escape(JOBOPEN)}"]`)?.scrollIntoView({ block: 'nearest' });
          return;
        }
        JOBOPEN = null; NEWSTART = ''; drawDetail(); load(); save();
      } catch (e) { $('jNotice').hidden = false; $('jNotice').textContent = e.message; $('jSave').disabled = false; }
    };
    if ($('jDel')) $('jDel').onclick = async () => {
      const j = t.jobs.find(x => x.id === JOBOPEN);
      if (!(await cp.confirm({ title: `Delete “${j.title}”?`, message: "The job comes off this plan and the timeline. This can't be undone.", confirm: 'Delete job', danger: true }))) return;
      try { OPEN = await api(`tasks/${t.id}/jobs/${j.id}`, { method: 'DELETE' }); JOBOPEN = null; drawDetail(); load(); save(); } catch (e) { cp.alert(e.message); }
    };
  }
  // Drag to reorder
  let dragged = null;
  box.querySelectorAll('.job[draggable="true"]').forEach(el => {
    el.addEventListener('dragstart', e => {
      if (e.target.closest('input, textarea, select') || JOBOPEN) { e.preventDefault(); return; }
      dragged = el; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); box.querySelectorAll('.over').forEach(x => x.classList.remove('over')); });
    el.addEventListener('dragover', e => { if (!dragged || dragged === el) return; e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', async e => {
      e.preventDefault(); el.classList.remove('over');
      if (!dragged || dragged === el) return;
      const ids = t.jobs.map(j => j.id).filter(id => id !== dragged.dataset.job);
      const at = ids.indexOf(el.dataset.job), below = e.offsetY > el.offsetHeight / 2;
      ids.splice(at + (below ? 1 : 0), 0, dragged.dataset.job);
      dragged = null;
      try { OPEN = await send(`tasks/${t.id}/jobs/order`, { ids }); drawDetail(); load(); if (MODE === 'timeline') loadCal(); } catch (err) { cp.alert(err.message); }
    });
  });
}

let LEFT = (() => { try { return Math.min(560, Math.max(200, Number(localStorage.getItem('cp.tl.left')) || 280)); } catch { return 280; } })();
const ZOOMS = [6, 9, 13, 18, 26, 34, 46, 60];
const between = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const dmy = s => s ? new Date(s + 'T00:00:00').toLocaleDateString() : '';
const said = st => st === 'To do' ? 'Not started' : st;
/** A job's status in words, with how far along it is while In progress. */
const pctOf = j => j.status === 'In progress' ? Math.max(0, Math.min(100, j.progress || 0)) : null;
/** How far a whole plan is: every job counts equally, Done 100%, In progress its %, anything else 0%. */
const planPct = p => { const js = p.jobs || []; return js.length ? Math.round(js.reduce((t, j) => t + (j.status === 'Done' ? 100 : pctOf(j) || 0), 0) / js.length) : null; };
const planBar = p => { const v = planPct(p); if (v == null) return '';
  const done = (p.jobs || []).filter(j => j.status === 'Done').length;
  return `<span class="ppct ${v === 100 ? 'full' : ''}" title="${v}% complete across all ${p.jobs.length} job${p.jobs.length > 1 ? 's' : ''} in the plan (${done} done)"><span class="pbar"><i style="width:${v}%"></i></span>${v}%</span>`; };
const saidJob = j => said(j.status) + (pctOf(j) != null ? ` · ${pctOf(j)}%` : '');
const avail = () => Math.max(200, ($('calGrid').clientWidth || 900) - LEFT);

/**
 * The timeline keeps to what's current: jobs with dates in last month, this month or later. Jobs with no
 * start date, and ones that finished before last month, are left off (Show all brings them back). The
 * + menu beside a person still offers every job, so the unscheduled ones are a click away there.
 */
let SHOW_ALL = (() => { try { return localStorage.getItem('tasks.showAll') === '1'; } catch { return false; } })();
const sinceDay = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth() - 1, 1, 12).toISOString().slice(0, 10); };
function recentOnly() {
  if (!CAL_ALL) return;
  const since = sinceDay();
  const keep = j => !!j.start && j.end >= since;
  CAL_HIDDEN = 0;
  CAL = SHOW_ALL ? CAL_ALL : { ...CAL_ALL, plans: CAL_ALL.plans.flatMap(p => {
    const jobs = p.jobs.filter(keep);
    CAL_HIDDEN += p.jobs.length - jobs.length;
    return jobs.length || !p.jobs.length ? [{ ...p, jobs }] : [];   // a plan with only hidden jobs goes too; a new, empty one stays
  }) };
  if (SHOW_ALL) CAL_HIDDEN = CAL_ALL.plans.reduce((k, p) => k + p.jobs.filter(j => !keep(j)).length, 0);
}
function setShowAll(on) {
  SHOW_ALL = on;
  try { localStorage.setItem('tasks.showAll', on ? '1' : '0'); } catch {}
  recentOnly(); drawCal();
}

async function loadCal() {
  try {
    CAL_ALL = await api('timeline?' + new URLSearchParams({ project: $('calProj').value, mine: $('calWho').value === 'mine' }));
    recentOnly();
    if (!RS) threeWeeks();
    drawCal();
  } catch (e) { $('calGrid').innerHTML = `<div class="notice" style="margin:16px">${esc(e.message)}</div>`; }
}

/** Show the whole plan: from the first job (or due date) to the last, with a little room either side. */
function fitRange() {
  const ds = [];
  (CAL?.plans || []).forEach(p => { if (p.due) ds.push(p.due); p.jobs.forEach(j => { if (j.start) ds.push(j.start, j.end); }); });
  ds.sort();
  if (!ds.length) { DW = 34; RS = addDays(today(), -7); RE = addDays(RS, Math.ceil(avail() / DW) - 1); }
  else {
    RS = addDays(ds[0], -2); RE = addDays(ds[ds.length - 1], 2);
    if (today() >= addDays(RS, -14) && today() < RS) RS = addDays(today(), -1);   // keep today in view when it's close
    const n = between(RS, RE) + 1;
    DW = Math.max(ZOOMS[0], Math.min(60, Math.floor(avail() / n)));
  }
  FIT = true;
}

/** The default view: this week (from Monday) and the next two, as wide as the space allows. */
function threeWeeks() {
  const d = new Date(today() + 'T00:00:00');
  RS = addDays(today(), -((d.getDay() + 6) % 7)); RE = addDays(RS, 20);
  DW = Math.max(ZOOMS[0], Math.min(60, Math.floor(avail() / 21)));
  WEEKS = true; FIT = false;
}

function zoom(dir) {
  const n = between(RS, RE) + 1, mid = addDays(RS, Math.floor(n / 2));
  const i = ZOOMS.findIndex(z => z >= DW), next = dir > 0 ? ZOOMS.find(z => z > DW) : [...ZOOMS].reverse().find(z => z < DW);
  if (!next) return;

  $('zoomIn').disabled = DW >= ZOOMS[ZOOMS.length - 1]; $('zoomOut').disabled = DW <= ZOOMS[0];
  const x = d => between(RS, d) * DW;   // left edge of a day

        ${canAdd ? `<button type="button" class="tladd" data-add="${esc(p.id)}" title="Add a job to ${esc(p.title)}" aria-label="Add a job to ${esc(p.title)}">+</button>` : ''}</div>
      <div class="tltrack ${canAdd ? 'pick' : ''}" style="width:${W}px" data-plan="${esc(p.id)}" ${canAdd ? 'title="Click a day to add a job starting then"' : ''}>${spanBar}${due}</div></div>`;
    if (!ex) continue;
    if (!p.jobs.length) rows += `<div class="tlrow tljob" style="min-height:44px"><div class="tllab" style="width:${LEFT}px" data-open="${esc(p.id)}"><span class="tlnone">No jobs yet</span></div><div class="tltrack" style="width:${W}px"></div></div>`;

  else {

      rows += `<div class="tlrow tlgroup" data-grp="${esc(g.email)}" data-gname="${esc(g.name)}" style="min-height:40px">

          ${anyChange ? `<button type="button" class="tladd" data-addp="${esc(g.email)}" title="Add a job for ${esc(g.name)}" aria-label="Add a job for ${esc(g.name)}">+</button>` : ''}</div>
        <div class="tltrack ${anyChange ? 'pick' : ''}" style="width:${W}px" data-person="${esc(g.email)}" ${anyChange ? `title="Click a day to add a job for ${esc(g.name)} starting then"` : ''}>${busy}</div></div>`;

/** A job bar's pieces, one per working stretch, placed inside the bar (which starts at s). The name goes in
 *  the first piece wide enough for it, the resize handle on the last; % done fills the working days in order. */
function barPieces(s, e, label, pc, handle, half = false) {
  const runs = workRuns(s, e), total = runs.reduce((k, [a, b]) => k + between(a, b) + 1, 0) - (half ? 0.5 : 0);
  const done = pc != null && pc !== '' ? Number(pc) / 100 * total : null;
  let before = 0, named = false;
  return runs.map(([a, b], i) => {
    const last = i === runs.length - 1, n = between(a, b) + 1 - (half && last ? 0.5 : 0), w = n * DW - 2;
    let fill = '';
    if (done != null) {
      const f = Math.round(Math.max(0, Math.min(1, (done - before) / n)) * 100);
      fill = `background:linear-gradient(to right, var(--c) ${f}%, color-mix(in srgb, var(--c) 50%, #fff) ${f}%);`;
    }
    before += n;
    const text = !named && w > 40 ? (named = true, esc(label)) : '';
    return `<span class="gseg" style="left:${between(s, a) * DW}px;width:${w}px;${fill}">${text}${handle && i === runs.length - 1 ? '<span class="rh"></span>' : ''}</span>`;
  }).join('');
}

/** A plan's summary line, broken at weekends like its jobs. */
const spanPieces = (s, e, colour, x) => workRuns(s, e).map(([a, b]) =>
  `<div class="tlspan" style="left:${x(a)}px;width:${(between(a, b) + 1) * DW}px;background:${colour}"></div>`).join('');

/** Drag the dates (anywhere that isn't a bar or a name) to move earlier or later; a sideways scroll does the same. */
function wirePanning() {
  const g = $('calGrid');
  let pan = null, swallow = false, acc = 0;
  g.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.gbar, .rbar, .tlleave, .tllab, .diamond, button')) return;
    pan = { x: e.clientX, rs: RS, re: RE, moved: false };
  });
  window.addEventListener('pointermove', e => {
    if (!pan) return;
    const dx = e.clientX - pan.x;
    if (!pan.moved && Math.abs(dx) < 5) return;
    if (!pan.moved) { pan.moved = true; g.classList.add('panning'); }
    const dd = Math.round(-dx / DW);
    if (addDays(pan.rs, dd) !== RS) { RS = addDays(pan.rs, dd); RE = addDays(pan.re, dd); FIT = WEEKS = false; drawCal(); }
  });
  window.addEventListener('pointerup', () => {
    if (!pan) return;
    if (pan.moved) { swallow = true; g.classList.remove('panning'); save(); setTimeout(() => { swallow = false; }, 0); }
    pan = null;
  });
  g.addEventListener('click', e => { if (swallow) { e.stopPropagation(); e.preventDefault(); swallow = false; } }, true);
  g.addEventListener('wheel', e => {
    if (MODE !== 'timeline' || !RS || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    e.preventDefault();
    acc += e.deltaX;
    const dd = Math.trunc(acc / DW);
    if (dd) { acc -= dd * DW; RS = addDays(RS, dd); RE = addDays(RE, dd); FIT = WEEKS = false; drawCal(); clearTimeout(g._save); g._save = setTimeout(save, 300); }
  }, { passive: false });
}

/**
 * The + beside a person (or a click on their row): schedule one of the jobs already in a plan for them,
 * or start a new job in a plan. Each plan lists its open jobs this person isn't on yet; picking one puts
 * them on it and schedules it (from the day you clicked, else where it already was, else today).
 */
/** Add or change someone's leave: first and last day, and a short note. Shown on their timeline row only. */
function leaveDialog(lv) {
  document.querySelector('dialog.leavedlg')?.remove();
  const d = document.createElement('dialog');
  d.className = 'leavedlg';
  d.innerHTML = `<form method="dialog">
      <h2>${lv.id ? 'Leave' : 'Add leave'} · ${esc(lv.name || personName(lv.email))}</h2>
      <p class="muted" style="margin:0">It shows on their row of the timeline, so nobody plans work for them then.</p>
      <div class="lrow"><div><label for="lvStart">First day</label><input type="date" id="lvStart" value="${esc(lv.start)}" required></div>
        <div><label for="lvEnd">Last day</label><input type="date" id="lvEnd" value="${esc(lv.end)}" required></div></div>
      <div style="margin-top:12px"><label for="lvNote">Note <span class="muted" style="font-weight:400">(optional)</span></label><input id="lvNote" maxlength="200" value="${esc(lv.note || '')}" placeholder="e.g. Holiday, Training, Half day"></div>
      <div class="notice" id="lvErr" hidden style="margin-top:12px"></div>
      <div class="lact"><button class="btn primary small" value="save">${lv.id ? 'Save' : 'Add leave'}</button><button class="btn small" value="cancel" formnovalidate>Cancel</button>
        <span style="flex:1"></span>${lv.id ? '<button class="btn small danger" type="button" id="lvDel">Remove</button>' : ''}</div>
    </form>`;
  document.body.append(d);
  const err = m => { $('lvErr').textContent = m; $('lvErr').hidden = !m; };
  $('lvStart').onchange = () => { if ($('lvEnd').value < $('lvStart').value) $('lvEnd').value = $('lvStart').value; };
  d.querySelector('form').onsubmit = async e => {
    if (e.submitter?.value !== 'save') return;
    e.preventDefault();
    const body = { email: lv.email, start: $('lvStart').value, end: $('lvEnd').value, note: $('lvNote').value };
    try { await send(lv.id ? `leave/${lv.id}` : 'leave', body, lv.id ? 'PATCH' : 'POST'); d.close(); loadCal(); }
    catch (x) { err(x.message); }
  };
  $('lvDel')?.addEventListener('click', async () => {
    if (!(await cp.confirm({ title: 'Remove this leave?', message: `${lv.name || personName(lv.email)}, ${shortDay(lv.start)}${lv.end !== lv.start ? ' – ' + shortDay(lv.end) : ''}.`, confirm: 'Remove', danger: true }))) return;
    try { await send(`leave/${lv.id}`, null, 'DELETE'); d.close(); loadCal(); } catch (x) { err(x.message); }
  });
  d.addEventListener('close', () => d.remove());
  d.showModal();
  $('lvStart').focus();
}

function planMenu(e, email, day) {
  document.querySelector('.planmenu')?.remove();
  const plans = (CAL_ALL || CAL).plans.filter(p => p.canChange);   // every job, including the ones the timeline leaves off
  if (!plans.length && !email) { cp.alert('Create a plan first, then add jobs to it.'); return; }
  const name = email ? personName(email) : 'nobody yet';
  const open = p => (p.jobs || []).filter(j => j.status !== 'Done' && !(email && (j.people || []).some(x => x.email === email)));
  if (!email && plans.length === 1 && !open(plans[0]).length) return addJobOn(plans[0].id, day, email);
  const first = OPEN && plans.find(p => p.id === OPEN.id);
  const list = first ? [first, ...plans.filter(p => p !== first)] : plans;
  const total = list.reduce((n, p) => n + open(p).length, 0);
  const when = j => j.start ? `${shortDay(j.start)}${j.end && j.end !== j.start ? ' – ' + shortDay(j.end) : ''}` : 'Not scheduled';
  const who = j => (j.people || []).length ? (j.people || []).map(x => x.name || personName(x.email)).join(', ') : 'Unassigned';
  const m = document.createElement('div');
  m.className = 'planmenu'; m.setAttribute('role', 'menu');
  m.innerHTML = (email ? `<button type="button" role="menuitem" class="pmleave" data-leave>🌴 Add leave for ${esc(name)}${day ? ' from ' + esc(shortDay(day)) : ''}</button>` : '') +
    (plans.length ? `<div class="g">Schedule a job for ${esc(name)}${day ? ' from ' + esc(shortDay(day)) : ''}</div>` : '') +
    (total > 6 ? `<input type="search" class="pmq" placeholder="Find a job or plan" aria-label="Find a job or plan">` : '') +
    list.map(p => {
      const jobs = open(p);
      return `<div class="pmplan" data-plan="${esc(p.id)}">
        <div class="pmhead"><span class="sq" style="background:${colourOf(p.id)[0]}"></span><span class="pmt" title="${esc(p.title)}">${esc(p.title)}</span><span class="ref">${esc(p.ref)}</span></div>` +
        jobs.map(j => `<button type="button" role="menuitem" class="pmjob" data-job="${esc(j.id)}" data-find="${esc((p.title + ' ' + p.ref + ' ' + j.title).toLowerCase())}">
          <span class="pmt">${esc(j.title || 'Untitled job')}</span><span class="pmm">${esc(when(j))} · ${esc(who(j))}</span></button>`).join('') +
        `<button type="button" role="menuitem" class="pmnew" data-pick="${esc(p.id)}" data-find="${esc((p.title + ' ' + p.ref).toLowerCase())}">+ New job in ${esc(p.title)}</button>
      </div>`;
    }).join('') + `<div class="pmnone" hidden>No jobs match.</div>`;
  document.body.append(m);
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(window.scrollX + 8, Math.min(e.pageX, window.scrollX + document.documentElement.clientWidth - r.width - 12)) + 'px';
  m.style.top = Math.max(window.scrollY + 8, Math.min(e.pageY + 6, window.scrollY + window.innerHeight - r.height - 12)) + 'px';
  const close = () => { m.remove(); document.removeEventListener('pointerdown', away, true); document.removeEventListener('keydown', key, true); };
  const away = ev => { if (!m.contains(ev.target)) close(); };
  const key = ev => {
    if (ev.key === 'Escape') { close(); return; }
    if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
    const items = [...m.querySelectorAll('.pmq, button')].filter(b => !b.closest('[hidden]') && !b.hidden);
    const i = items.indexOf(document.activeElement);
    items[(i + (ev.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]?.focus();
    ev.preventDefault();
  };
  setTimeout(() => { document.addEventListener('pointerdown', away, true); document.addEventListener('keydown', key, true); }, 0);
  const q = m.querySelector('.pmq');
  if (q) q.oninput = () => {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    let any = false;
    m.querySelectorAll('.pmplan').forEach(pl => {
      let shown = 0;
      pl.querySelectorAll('[data-find]').forEach(b => { b.hidden = !words.every(w => b.dataset.find.includes(w)); if (!b.hidden) shown++; });
      pl.hidden = !shown; any ||= !!shown;
    });
    m.querySelector('.pmnone').hidden = any;
  };
  m.querySelector('[data-leave]')?.addEventListener('click', () => { close(); leaveDialog({ email, start: day || today(), end: day || today(), note: '' }); });
  m.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { close(); addJobOn(b.dataset.pick, day, email); });
  m.querySelectorAll('[data-job]').forEach(b => b.onclick = async () => {
    const plan = (CAL_ALL || CAL).plans.find(p => p.id === b.closest('.pmplan').dataset.plan), job = plan.jobs.find(j => j.id === b.dataset.job);
    close();
    const body = { start: workday(day || job.start || today()) };
    if (email) body.people = [...(job.people || []).map(x => ({ email: x.email, name: x.name || personName(x.email) })), { email, name: personName(email) }];
    try { await send(`tasks/${plan.id}/jobs/${job.id}`, body, 'PATCH'); afterJobChange(plan.id); }
    catch (err) { cp.alert(err.message); }
  });
  (q || m.querySelector('button'))?.focus();
}

const dayAt = (track, e) => addDays(RS, Math.floor((e.clientX - track.getBoundingClientRect().left) / DW));

function wireTimeline() {
  const g = $('calGrid');
  g.querySelectorAll('.tllab[data-open], .diamond[data-open]').forEach(el => el.onclick = e => {
    if (e.target.closest('[data-add]')) return;
    openTask(el.dataset.open, el.dataset.job || null);
  });
  g.querySelectorAll('[data-add]').forEach(b => b.onclick = e => { e.stopPropagation(); addJobOn(b.dataset.add, ''); });
  g.querySelectorAll('.rbar').forEach(b => b.onclick = e => { e.stopPropagation(); openTask(b.dataset.ropen, b.dataset.rjob, b.dataset.rstart); });
  g.querySelectorAll('.tlleave').forEach(b => b.onclick = e => { e.stopPropagation(); const l = (CAL.leave || []).find(x => x.id === b.dataset.leave); if (l) leaveDialog(l); });
  g.querySelectorAll('.tlgroup .tltrack.pick[data-plan]').forEach(t => t.onclick = e => { if (!e.target.closest('.diamond')) addJobOn(t.dataset.plan, dayAt(t, e)); });
  g.querySelectorAll('.tllab[data-sub]').forEach(l => {
    l.onclick = e => headClick(e, l);
    l.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === l) { e.preventDefault(); toggleSub(l.dataset.sub, l); } };
  });
  g.querySelectorAll('.tllab [data-psub]').forEach(b => b.onclick = e => { e.stopPropagation(); openTask(b.dataset.psub); });
  g.querySelectorAll('.tlsub .tltrack.pick[data-subplan]').forEach(t => t.onclick = e => addJobOn(t.dataset.subplan, dayAt(t, e), t.dataset.person));
  g.querySelectorAll('.tlgroup .tltrack.pick[data-person]').forEach(t => t.onclick = e => planMenu(e, t.dataset.person, dayAt(t, e)));
  g.querySelectorAll('[data-addp]').forEach(b => b.onclick = e => { e.stopPropagation(); planMenu(e, b.dataset.addp, ''); });
  g.querySelectorAll('[data-sched]').forEach(t => t.onclick = async e => {
    try { await send(`tasks/${t.dataset.plan}/jobs/${t.dataset.sched}`, { start: dayAt(t, e) }, 'PATCH'); afterJobChange(t.dataset.plan); }
    catch (err) { cp.alert(err.message); }
  });
  g.querySelectorAll('.gbar').forEach(bar => {
    bar.onpointerdown = e => {
      if (e.button !== 0) return;
      const plan = CAL.plans.find(p => p.id === bar.dataset.plan), job = plan.jobs.find(j => j.id === bar.dataset.job);
      const resize = !!e.target.closest('.rh'), x0 = e.clientX, left0 = bar.offsetLeft, w0 = bar.offsetWidth;
      const len0 = job.duration || 1;
      let dd = 0, moved = false, s = job.start, len = len0;
      // By person, a bar can also be dragged up or down onto someone else: that gives them the job instead.
      const owner = bar.dataset.owner ?? null, y0 = e.clientY;
      let target = owner, tip = null;
      const groupAt = y => {
        let hit = null;
        g.querySelectorAll('.tlrow[data-grp]').forEach(r => { const b = r.getBoundingClientRect(); if (y >= b.top && y < b.bottom) hit = r.dataset.grp; });
        return hit;
      };
      const mark = grp => g.querySelectorAll('.tlrow[data-grp]').forEach(r => r.classList.toggle('droptarget', grp !== owner && r.dataset.grp === grp));
      if (plan.canChange) { bar.style.pointerEvents = 'auto'; bar.setPointerCapture(e.pointerId); }   // the frame follows the drag
      bar.onpointermove = ev => {
        if (!plan.canChange) return;
        const dx = ev.clientX - x0, dy = ev.clientY - y0;
        if (!moved && Math.abs(dx) < 4 && (owner === null || resize || Math.abs(dy) < 4)) return;
        moved = true; bar.classList.add('dragging'); bar.parentElement.style.zIndex = '10';   // above the rows it's dragged over
        if (owner !== null && !resize) {
          const at = groupAt(ev.clientY);
          target = at === null ? target : at;
          bar.style.transform = target !== owner ? `translateY(${dy}px)` : '';
          mark(target);
          if (target !== owner) {
            if (!tip) { tip = document.createElement('div'); tip.className = 'droptip'; document.body.append(tip); }
            const gname = g.querySelector(`.tlgroup[data-grp="${CSS.escape(target)}"]`)?.dataset.gname || 'Unassigned';
            tip.textContent = target ? `Give to ${gname}` : 'Unassign';
            tip.style.left = ev.pageX + 14 + 'px'; tip.style.top = ev.pageY + 14 + 'px';
          } else if (tip) { tip.remove(); tip = null; }
        }
        dd = Math.round(dx / DW);
        // Weekends don't count: a move lands on a weekday, and the end skips Saturdays and Sundays.
        if (resize) len = Math.max(isHalf(len0) ? 0.5 : 1, workDays(job.start, addDays(job.end, dd)) - (isHalf(len0) ? 0.5 : 0));
        else s = workday(addDays(job.start, dd));
        const e = workEnd(s, len);
        bar.style.left = left0 + between(job.start, s) * DW + 'px';
        bar.style.width = (between(s, e) + 1 - (isHalf(len) ? 0.5 : 0)) * DW - 2 + 'px';
        bar.innerHTML = barPieces(s, e, bar.dataset.label, bar.dataset.pc, true, isHalf(len));   // weekends stay empty while dragging too
        bar.title = `${span(s, e)} (${days(len)})`;
        const lab = bar.closest('.tlrow').querySelector('.js');
        if (lab) lab.textContent = `${dmy(s)} – ${dmy(e)} · ${said(job.status)}`;
      };
      bar.onpointerup = async () => {
        bar.onpointermove = bar.onpointerup = null;
        bar.style.pointerEvents = ''; bar.style.transform = ''; bar.parentElement.style.zIndex = '';
        tip?.remove(); mark(null);
        if (!moved) { openTask(plan.id, job.id); return; }
        bar.classList.remove('dragging');
        const give = owner !== null && !resize && target !== owner;
        if (!give && (resize ? len === len0 : s === job.start)) return drawCal();
        const body = resize ? { duration: len } : s !== job.start ? { start: s } : {};
        if (give) {
          // Swap this person for the one it was dropped on; anyone else on the job stays.
          const keep = jobPeople(job).filter(x => x.email !== owner && x.email !== target).map(x => ({ email: x.email, name: x.name || personName(x.email) }));
          body.people = target ? [{ email: target, name: personName(target) }, ...keep] : keep;
        }
        try { await send(`tasks/${plan.id}/jobs/${job.id}`, body, 'PATCH'); afterJobChange(plan.id); }
        catch (err) { cp.alert(err.message); drawCal(); }
      };
    };
  });
}

async function afterJobChange(pid) {
  FIT = false;   // keep the view still while you arrange jobs
  await loadCal();
  if (OPEN?.id === pid) { OPEN = await api('tasks/' + pid); drawDetail(); }
  load();
}

async function addJobOn(pid, day, assignee = '') {
  await openTask(pid);
  if (!OPEN?.canChange) return;
  JOBOPEN = 'new'; NEWSTART = day; NEWASSIGNEE = assignee; drawDetail();
  $('jobs')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); $('jTitle')?.focus();
}

/* ---------- Start ---------- */
(async () => {
  ME = await api('me');
  $('who').textContent = ME.email;
  const fromHash = new URLSearchParams(location.hash.slice(1));
  VIEW = TABS.some(([k]) => k === fromHash.get('view')) ? fromHash.get('view') : 'mine';
  // People to assign to: the portal's accounts with the Team Planning tool; otherwise whoever Team Planning already knows.
  const portal = await fetch('/api/people?tool=tasks', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
  PEOPLE = portal?.people?.length ? portal.people : (await api('people')).people;
  $('people').innerHTML = PEOPLE.map(p => `<option value="${esc(p.email)}">${esc(p.name)}</option>`).join('');
  const [{ projects }, all] = await Promise.all([api('projects'), api('tasks?view=all')]);
  PROJECTS = projects;
  const seen = new Map(PROJECTS.map(p => [p.id, p.name]));
  all.tasks.forEach(t => t.project && seen.set(t.project.id, t.project.name));
  const projOpts = [...seen].sort((a, b) => a[1].localeCompare(b[1])).map(([id, n]) => `<option value="${esc(id)}">${esc(n)}</option>`).join('');
  $('proj').innerHTML += projOpts; $('calProj').innerHTML += projOpts;
  if (fromHash.get('project')) $('proj').value = $('calProj').value = fromHash.get('project');
  $('proj').onchange = () => { $('calProj').value = $('proj').value; save(); load(); };
  $('calProj').onchange = () => { $('proj').value = $('calProj').value; save(); load(); };
  $('calWho').value = fromHash.get('who') === 'mine' ? 'mine' : '';
  $('calWho').onchange = () => { save(); loadCal(); };
  if (['person', 'plan'].includes(fromHash.get('by'))) GROUP = fromHash.get('by');
  $('calGroup').value = GROUP;
  $('calGroup').value = $('listGroup').value = GROUP;
  $('calGroup').onchange = () => setGroup($('calGroup').value);
  $('listGroup').onchange = () => setGroup($('listGroup').value);
  $('q').oninput = drawRows;
  $('jobSt').onchange = $('jobSort').onchange = () => { drawRows(); try { localStorage.setItem('cp.all', JSON.stringify([$('jobSt').value, $('jobSort').value])); } catch {} };
  try { const [st, by] = JSON.parse(localStorage.getItem('cp.all') || '[]'); if (st != null) $('jobSt').value = st; if (by) $('jobSort').value = by; } catch {}
  $('actClose').onclick = closeActivity;
  $('actModal').addEventListener('click', e => { if (e.target === $('actModal')) closeActivity(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ACT_OPEN && !document.querySelector('.cp-mention:not([hidden]), dialog[open]')) closeActivity(); });
  $('newBtn').onclick = newTask; $('newBtn2').onclick = newTask;
  if (/^\d{4}-\d{2}-\d{2}$/.test(fromHash.get('from') || '')) {
    RS = fromHash.get('from'); DW = ZOOMS.includes(Number(fromHash.get('zoom'))) ? Number(fromHash.get('zoom')) : 34; FIT = WEEKS = false; RE = RS;
  }
  wirePanning();
  $('calPrev').onclick = () => shift(-1); $('calNext').onclick = () => shift(1);
  $('calToday').onclick = goToday;
  $('zoomIn').onclick = () => zoom(1); $('zoomOut').onclick = () => zoom(-1);
  $('zoomFit').onclick = () => { FIT = true; WEEKS = false; drawCal(); save(); };
  let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(drawCal, 150); });
  document.querySelectorAll('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  setMode(['timeline', 'calendar'].includes(fromHash.get('mode')) ? 'timeline' : fromHash.get('mode') === 'all' ? 'all' : 'list');
  await load();
  if (fromHash.get('task')) openTask(fromHash.get('task'), fromHash.get('job'));
})().catch(e => { $('rows').innerHTML = `<div class="notice">${esc(e.message)}</div>`; });
</script>
